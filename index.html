<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus Dynamic UI</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            direction: rtl !important;
            text-align: right !important;
        }

        body {
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: 0px;
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            position: relative;
        }

        .cyber-grid {
            position: absolute;
            inset: 0;
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at 50% 45%, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 45%, black 20%, transparent 75%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-core {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            max-width: 300px;
            height: 75vw;
            max-height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 50%, transparent 70%);
            filter: blur(25px);
            pointer-events: none;
            z-index: 0;
            animation: corePulse 5s infinite ease-in-out alternate;
        }

        @keyframes corePulse {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            z-index: 2;
        }

        .graphic-wrapper {
            position: relative;
            width: 100%;
            max-width: 280px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            direction: ltr !important;
        }

        .svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        .laser-path-1 {
            stroke-dasharray: 40 160;
            animation: laserFlow 2s linear infinite;
        }

        .laser-path-2 {
            stroke-dasharray: 40 160;
            animation: laserFlowRev 2.4s linear infinite;
        }

        @keyframes laserFlow {
            0% { stroke-dashoffset: 200; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes laserFlowRev {
            0% { stroke-dashoffset: -200; }
            100% { stroke-dashoffset: 0; }
        }

        .avatar-container {
            position: relative;
            width: clamp(52px, 15vw, 64px);
            height: clamp(52px, 15vw, 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            animation: float3D 4.5s ease-in-out infinite;
        }

        .avatar-container.user { animation-delay: -2.25s; }

        @keyframes float3D {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .orbit-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.9);
            border-right-color: rgba(255, 255, 255, 0.2);
            animation: spinOrbit 3.5s linear infinite;
        }

        .avatar-container.user .orbit-ring {
            animation-duration: 4.5s;
            animation-direction: reverse;
        }

        @keyframes spinOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .avatar-box {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(15, 15, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .avatar-box svg.ai-svg {
            width: 55%;
            height: 55%;
            flex: none;
        }

        .avatar-box svg.user-svg {
            width: 50%;
            height: 50%;
            flex: none;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            padding: 0 10px;
        }

        .main-title {
            font-size: clamp(17px, 4.8vw, 21px);
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.3px;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==================== iOS-Style Chat Toolbar (Glassmorphism) ==================== */
        .input-card-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            padding: 2px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            direction: rtl !important;
            margin-bottom: 10px;
        }

        .input-card-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08), 0 12px 40px rgba(0, 0, 0, 0.9);
        }

        .input-card {
            width: 100%;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-radius: 26px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            direction: rtl !important;
        }

        .chat-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            color: #ffffff;
            direction: rtl !important;
            text-align: right !important;
            padding: 4px 2px;
            font-weight: 400;
            resize: none;
            max-height: 100px;
            min-height: 28px;
            line-height: 1.5;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }

        .bottom-row {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            direction: rtl !important;
            flex-direction: row !important;
            padding-top: 2px;
        }

        .right-buttons {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            direction: rtl !important;
            flex-direction: row !important;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            width: 36px;
            height: 36px;
        }

        .action-btn:active { 
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.2);
        }

        .action-btn.btn-text-icon {
            border-radius: 20px;
            width: auto;
            height: 34px;
            padding: 0 14px;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.06);
        }

        .action-btn.btn-text-icon.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .action-btn.btn-text-icon svg {
            width: 15px;
            height: 15px;
        }

        .voice-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 14px;
        }

        .voice-bar {
            width: 2.5px;
            height: 100%;
            background-color: #ffffff;
            border-radius: 2px;
            animation: waveAnimate 1.2s ease-in-out infinite alternate;
        }

        .voice-bar:nth-child(2) { animation-delay: 0.2s; }
        .voice-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes waveAnimate {
            0% { height: 20%; opacity: 0.4; }
            100% { height: 100%; opacity: 1; }
        }

        .btn-send {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.3;
            pointer-events: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(255, 255, 255, 0.1);
        }

        .btn-send.active {
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 2px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-send:active { transform: scale(0.88) !important; }
        .btn-send svg path { fill: #000000; }

        /* ==================== iOS Glassmorphism Keyboard ==================== */
        .keyboard-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px 28px 0 0;
            padding: 10px 6px max(12px, env(safe-area-inset-bottom)) 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.9);
            direction: ltr !important;
        }

        .keyboard-container.hidden {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 0;
        }

        .keyboard-handle-bar {
            width: 40px;
            height: 5px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            margin: 0 auto 8px auto;
            cursor: pointer;
            transition: background 0.2s;
        }
        .keyboard-handle-bar:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 100%;
            margin-bottom: 5px;
        }

        .key-btn {
            flex: 1;
            height: 48px;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.2);
            transition: all 0.1s ease;
            touch-action: manipulation;
            font-family: -apple-system, 'Vazirmatn', sans-serif;
            min-width: 10px;
            padding: 0 3px;
        }

        .key-btn:active, .key-btn.pressed {
            background: rgba(255, 255, 255, 0.45);
            transform: scale(0.94);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .key-btn.special {
            background: rgba(255, 255, 255, 0.08);
            font-size: 16px;
            color: #ddd;
        }

        .key-btn.wide-15 { flex: 1.5; }
        .key-btn.wide-2 { flex: 2.2; }
        .key-btn.space { 
            flex: 4.5; 
            font-size: 14px; 
            opacity: 0.7;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .key-btn.active-shift {
            background: rgba(255, 255, 255, 0.85);
            color: #000000;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .key-btn[data-key="BACK"] { font-size: 18px; }
        .key-btn[data-key="ENTER"] { font-size: 16px; background: rgba(50, 130, 255, 0.3); color: #fff; }
        .key-btn[data-key="LANG"] { font-size: 14px; font-weight: 600; }
        .key-btn[data-key="SHIFT"] { font-size: 20px; }

        @media (max-width: 420px) {
            .key-btn { height: 42px; font-size: 15px; }
            .key-btn.special { font-size: 13px; }
            .keyboard-row { gap: 4px; }
            .action-btn { width: 32px; height: 32px; }
            .action-btn.btn-text-icon { height: 30px; padding: 0 10px; font-size: 12px; }
            .btn-send { width: 34px; height: 34px; }
        }
    </style>
</head>

                        </div>
                        <svg id="micIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 8V13C18 16.3137 15.3137 19 12 19C8.68629 19 6 16.3137 6 13V8C6 4.68629 8.68629 2 12 2C13.777 2 15.3736 2.7725 16.4722 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M10 6.5C10 6.5 10.4727 6 12 6C13.5273 6 14 6.5 14 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M10 9.5C10 9.5 10.4727 9 12 9C13.5273 9 14 9.5 14 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M21 11V13C21 16.5337 18.9634 19.5918 16 21.0645M3 11V13C3 17.9706 7.02944 22 12 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>

                <button class="btn-send" id="btnSend">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14.2199 21.63C13.0399 21.63 11.3699 20.8 10.0499 16.83L9.32988 14.67L7.16988 13.95C3.20988 12.63 2.37988 10.96 2.37988 9.78001C2.37988 8.61001 3.20988 6.93001 7.16988 5.60001L15.6599 2.77001C17.7799 2.06001 19.5499 2.27001 20.6399 3.35001C21.7299 4.43001 21.9399 6.21001 21.2299 8.33001L18.3999 16.82C17.0699 20.8 15.3999 21.63 14.2199 21.63ZM7.63988 7.03001C4.85988 7.96001 3.86988 9.06001 3.86988 9.78001C3.86988 10.5 4.85988 11.6 7.63988 12.52L10.1599 13.36C10.3799 13.43 10.5599 13.61 10.6299 13.83L11.4699 16.35C12.3899 19.13 13.4999 20.12 14.2199 20.12C14.9399 20.12 16.0399 19.13 16.9699 16.35L19.7999 7.86001C20.3099 6.32001 20.2199 5.06001 19.5699 4.41001C18.9199 3.76001 17.6599 3.68001 16.1299 4.19001L7.63988 7.03001Z" fill="#000000"/>
                        <path d="M10.11 14.4C9.92005 14.4 9.73005 14.33 9.58005 14.18C9.29005 13.89 9.29005 13.41 9.58005 13.12L13.16 9.53C13.45 9.24 13.93 9.24 14.22 9.53C14.51 9.82 14.51 10.3 14.22 10.59L10.64 14.18C10.5 14.33 10.3 14.4 10.11 14.4Z" fill="#000000"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== iOS Keyboard ==================== -->
    <div class="keyboard-container" id="customKeyboard">
        <div class="keyboard-handle-bar" id="keyboardHandle" title="بستن کیبورد"></div>
        <div id="keyboardRows"></div>
    </div>

    <script>
        const textToType = "امروز چطور می‌تونم کمکت کنم؟";
        const typewriterEl = document.getElementById('typewriter');
        let charIndex = 0;

        function typeText() {
            if (charIndex < textToType.length) {
                typewriterEl.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeText, 45);
            }
        }
        setTimeout(typeText, 300);

        const input = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        function updateInputState() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 100) + 'px';

            if (input.value.trim().length > 0) {
                btnSend.classList.add('active');
            } else {
                btnSend.classList.remove('active');
            }
        }

        btnSend.addEventListener('click', sendMessage);

        function sendMessage() {
            if (input.value.trim() === '') return;
            input.value = '';
            updateInputState();
        }

        document.getElementById('btnSearch').addEventListener('click', function() {
            this.classList.toggle('active');
        });

        const btnVoice = document.getElementById('btnVoice');
        const micIcon = document.getElementById('micIcon');
        const voiceWave = document.getElementById('voiceWave');
        let isRecording = false;

        btnVoice.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                micIcon.style.display = 'none';
                voiceWave.style.display = 'flex';
                btnVoice.style.borderColor = 'rgba(255,255,255,0.5)';
                btnVoice.style.background = 'rgba(255,255,255,0.15)';
            } else {
                micIcon.style.display = 'block';
                voiceWave.style.display = 'none';
                btnVoice.style.borderColor = 'rgba(255,255,255,0.12)';
                btnVoice.style.background = 'rgba(255,255,255,0.08)';
            }
        });

        /* ==================== iOS Keyboard Logic ==================== */
        const keyboardContainer = document.getElementById('customKeyboard');
        const keyboardRows = document.getElementById('keyboardRows');
        const keyboardHandle = document.getElementById('keyboardHandle');

        let currentLang = 'fa';
        let isShift = false;

        const layouts = {
            fa: [
                ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح', 'ج', 'چ'],
                ['ش', 'س', 'ی', 'ب', 'ل', 'ا', 'ت', 'ن', 'م', 'ک', 'گ'],
                ['BACK', 'ظ', 'ط', 'ز', 'ر', 'ذ', 'د', 'پ', 'و', 'ENTER'],
                ['LANG', 'NUM', 'SPACE', '.', 'HIDE']
            ],
            en: [
                ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
                ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
                ['SHIFT', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'BACK'],
                ['LANG', 'NUM', 'SPACE', '.', 'ENTER']
            ],
            num: [
                ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
                ['@', '#', '$', '%', '&', '-', '+', '(', ')', '/'],
                ['=', '*', '"', '\'', ':', ';', '!', '?', 'BACK'],
                ['LANG', 'ABC', 'SPACE', ',', 'ENTER']
            ]
        };

        function renderKeyboard() {
            keyboardRows.innerHTML = '';
            let currentLayout = layouts[currentLang];

            currentLayout.forEach((row) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'keyboard-row';

                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'key-btn';
                    btn.setAttribute('data-key', key);

                    let displayKey = key;

                    if (currentLang === 'en' && isShift && key.length === 1 && key !== 'SHIFT') {
                        displayKey = key.toUpperCase();
                    }

                    if (key === 'BACK') {
                        btn.classList.add('special', 'wide-15');
                        btn.innerHTML = '⌫';
                    } else if (key === 'ENTER') {
                        btn.classList.add('special', 'wide-15');
                        btn.innerHTML = '↵';
                    } else if (key === 'SPACE') {
                        btn.classList.add('space');
                        btn.innerText = currentLang === 'fa' ? 'فاصله' : 'Space';
                    } else if (key === 'LANG') {
                        btn.classList.add('special', 'wide-15');
                        btn.innerText = currentLang === 'fa' ? 'EN' : 'فا';
                    } else if (key === 'NUM') {
                        btn.classList.add('special');
                        btn.innerText = '123';
                    } else if (key === 'ABC') {
                        btn.classList.add('special');
                        btn.innerText = 'ABC';
                    } else if (key === 'SHIFT') {
                        btn.classList.add('special', 'wide-15');
                        if (isShift) btn.classList.add('active-shift');
                        btn.innerHTML = '⇧';
                    } else if (key === 'HIDE') {
                        btn.classList.add('special');
                        btn.innerHTML = '⌨';
                    } else {
                        btn.innerText = displayKey;
                    }

                    btn.addEventListener('click', (e) => handleKeyPress(key, displayKey, e));
                    rowEl.appendChild(btn);
                });

                keyboardRows.appendChild(rowEl);
            });
        }

        function handleKeyPress(rawKey, displayKey, e) {
            e.preventDefault();

            if (rawKey === 'BACK') {
                input.value = input.value.slice(0, -1);
            } else if (rawKey === 'ENTER') {
                input.value += '\n';
            } else if (rawKey === 'SPACE') {
                input.value += ' ';
            } else if (rawKey === 'LANG') {
                currentLang = currentLang === 'fa' ? 'en' : 'fa';
                isShift = false;
                renderKeyboard();
            } else if (rawKey === 'NUM') {
                currentLang = 'num';
                renderKeyboard();
            } else if (rawKey === 'ABC') {
                currentLang = 'fa';
                renderKeyboard();
            } else if (rawKey === 'SHIFT') {
                isShift = !isShift;
                renderKeyboard();
            } else if (rawKey === 'HIDE') {
                keyboardContainer.classList.add('hidden');
            } else {
                input.value += displayKey;
                if (isShift && currentLang === 'en') {
                    isShift = false;
                    renderKeyboard();
                }
            }

            updateInputState();
            input.focus();
        }

        input.addEventListener('click', () => {
            keyboardContainer.classList.remove('hidden');
        });

        keyboardHandle.addEventListener('click', () => {
            keyboardContainer.classList.add('hidden');
        });

        renderKeyboard();
    </script>
</body>
</html>
