function startRecording() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('تبدیل صدا به متن در این مرورگر پشتیبانی نمی‌شود', 'error');
    return;
  }
  clearInterval(state.recordingTimer);
  state.recording = true;
  state.recordingStart = Date.now();
  state.voiceTranscript = '';
  state.voiceInterim = '';
  const recognition = new SR();
  recognition.lang = 'fa-IR';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.onresult = (event) => {
    let interim = '';
    let finalText = state.voiceTranscript || '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0]?.transcript || '';
      if (event.results[i].isFinal) finalText += (finalText ? ' ' : '') + text.trim();
      else interim += text;
    }
    state.voiceTranscript = finalText.trim();
    state.voiceInterim = interim.trim();
    const live = document.querySelector('.recorder-live-text');
    if (live) live.textContent = state.voiceInterim || state.voiceTranscript || 'صحبت کنید…';
  };
  recognition.onerror = (event) => {
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      showToast('اجازه میکروفون داده نشده است', 'error');
      cancelRecording();
    }
  };
  recognition.onend = () => {
    if (state.recording && state.voiceRecognition === recognition) {
      try { recognition.start(); } catch (e) {}
    }
  };
  state.voiceRecognition = recognition;
  try { recognition.start(); } catch (e) {
    state.voiceRecognition = null;
    state.recording = false;
    showToast('شروع تبدیل صدا به متن ممکن نشد', 'error');
    return;
  }
  renderApp();
}
function stopRecording() {
  clearInterval(state.recordingTimer);
  const recognition = state.voiceRecognition;
  state.recording = false;
  state.recordingStart = 0;
  state.voiceRecognition = null;
  if (recognition) {
    recognition.onend = null;
    try { recognition.stop(); } catch (e) {}
  }
  const text = (state.voiceTranscript || state.voiceInterim || '').trim();
  state.voiceInterim = '';
  state.composerText = text ? ((state.composerText ? state.composerText + ' ' : '') + text) : state.composerText;
  state.voiceTranscript = '';
  renderApp();
  requestAnimationFrame(() => {
    const el = document.getElementById('composer-input');
    if (el) { el.focus(); onComposerInput(); }
  });
}
function cancelRecording() {
  clearInterval(state.recordingTimer);
  const recognition = state.voiceRecognition;
  state.recording = false;
  state.recordingStart = 0;
  state.voiceRecognition = null;
  state.voiceTranscript = '';
  state.voiceInterim = '';
  if (recognition) {
    recognition.onend = null;
    try { recognition.stop(); } catch (e) {}
  }
  renderApp();
}

   MESSAGE ACTIONS
   ============================================================ */
function sendMessage() {
  const text = state.composerText.trim();
  if ((!text && !state.attachments.length) || state.phase !== 'idle') return;
  let convId = state.activeId;
  if (!convId) {
    convId = uid('c');
    const title = text ? text.split(' ').slice(0,5).join(' ').slice(0,36) + (text.length > 36 ? '…' : '') : 'گفتگوی جدید';
    const conv = { id:convId, title, preview: text.slice(0,70) || 'پیوست', time: formatTime(new Date()), group:'today', icon:'messages', tint:'blue', pinned:false, favorite:false, archived:false };
    state.conversations.unshift(conv);
    state.activeId = convId;
    state.messagesById[convId] = [];
    saveConversations();
  }
  let content = text;
  if (state.attachments.length) content += (content ? '\n\n' : '') + '📎 ' + state.attachments.map(a => a.name).join(', ');
  const chips = state.activeToolChips.length ? '\n\n🔧 ' + state.activeToolChips.map(c => c.label).join(' · ') : '';
  content += chips;
  const msg = { id:uid('u'), role:'user', content, time: formatTime(new Date()) };
  state.messagesById[convId].push(msg);
  state.composerText = '';
  state.attachments = [];
  state.activeToolChips = [];
  state.phase = 'thinking';
  state.totalTokens += Math.floor(text.length / 4);
  state.stats.totalMessages++;
  state.stats.tokensUsed += Math.floor(text.length / 4);
  saveStats();
  saveMessages();
  renderApp();
  scrollToBottom();
  setTimeout(() => generateResponse(convId, msg), 900);
}
function generateResponse(convId, userMsg) {
  state.phase = 'typing';
  renderApp();
  setTimeout(() => {
    const reply = pickResponse(userMsg.content);
    const msg = { id:uid('a'), role:'assistant', content:'', streaming:true, time: formatTime(new Date()) };
    state.messagesById[convId].push(msg);
    state.phase = 'streaming';
    streamText(convId, msg.id, reply);
  }, 650);
}
function pickResponse(prompt) {
  if (/کد|code|react|تابع|typescript|javascript|fetch|سایت|website|hook/i.test(prompt)) return codeResponses[state.variantCursor++ % codeResponses.length];
  return generalResponses[state.variantCursor++ % generalResponses.length];
}
function streamText(convId, msgId, fullText) {
  const tokens = fullText.split(/(\s+)/);
  let cursor = 0;
  const interval = setInterval(() => {
    cursor += 4;
    const done = cursor >= tokens.length;
    const msg = state.messagesById[convId].find(m => m.id === msgId);
    if (!msg) { clearInterval(interval); return; }
    msg.content = tokens.slice(0, cursor).join('');
    msg.streaming = !done;
    if (done) { clearInterval(interval); state.phase = 'idle'; saveMessages(); }
    renderApp();
    if (done || cursor % 8 === 0) scrollToBottom();
  }, 32);
}
function stopGeneration() {
  state.phase = 'idle';
  const msgs = state.messagesById[state.activeId] || [];
  msgs.forEach(m => { if (m.streaming) m.streaming = false; });
  saveMessages();
  renderApp();
  showToast('تولید متوقف شد', 'info');
}
function scrollToBottom() {
  const el = document.getElementById('chat-scroll');
  if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
}
function selectConversation(id) {
  if (id === state.activeId) { if (window.innerWidth < 1024) { state.drawerOpen = false; renderApp(); } return; }
  state.activeId = id;
  state.workspaceMode = 'chat';
  state.drawerOpen = false;
  renderApp();
}
function newChat() {
  state.activeId = null;
  state.composerText = '';
  state.phase = 'idle';
  state.workspaceMode = 'chat';
  state.drawerOpen = false;
  state.attachments = [];
  state.activeToolChips = [];
  state.stats.totalChats++;
  saveStats();
  renderApp();
  setTimeout(() => document.getElementById('composer-input')?.focus(), 50);
  showToast('گفتگوی جدید آماده است');
}
function deleteMessage(id) {
  const msgs = state.messagesById[state.activeId] || [];
  state.messagesById[state.activeId] = msgs.filter(m => m.id !== id);
  saveMessages();
  renderApp();
  showToast('پیام حذف شد');
}
function retryUser(id) {
  const msgs = state.messagesById[state.activeId] || [];
  const idx = msgs.findIndex(m => m.id === id);
  if (idx < 0) return;
  state.messagesById[state.activeId] = msgs.slice(0, idx + 1);
  state.phase = 'idle';
  renderApp();
  generateResponse(state.activeId, msgs[idx]);
}
function regenerate(id) {
  const msgs = state.messagesById[state.activeId] || [];
  const idx = msgs.findIndex(m => m.id === id);
  if (idx < 0) return;
  let u = idx - 1;
  while (u >= 0 && msgs[u].role !== 'user') u--;
  if (u < 0) return;
  state.messagesById[state.activeId] = msgs.slice(0, idx);
  state.phase = 'idle';
  renderApp();
  generateResponse(state.activeId, msgs[u]);
}
function continueMessage(id) {
  const msgs = state.messagesById[state.activeId] || [];
  const m = msgs.find(x => x.id === id);
  if (!m || state.phase !== 'idle') return;
  state.phase = 'typing';
  renderApp();
  setTimeout(() => {
    const addition = '\n\n### ادامه\n- خطاها را مانیتور کنید.\n- از کش استفاده کنید.';
    m.streaming = true;
    state.phase = 'streaming';
    streamText(state.activeId, id, m.content + addition);
  }, 600);
}
function editUserMessage(id) {
  const msgs = state.messagesById[state.activeId] || [];
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  state.composerText = m.content;
  renderApp();
  setTimeout(() => { const el = document.getElementById('composer-input'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 50);
}
function giveFeedback(kind) {
  showToast(kind === 'up' ? 'ممنون از بازخورد شما' : 'بازخورد ثبت شد', 'info');
  if (kind === 'up') fireConfetti(15);
}
function shareMessage(id) {
  const msgs = state.messagesById[state.activeId] || [];
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  copyText(m.content).then(ok => showToast(ok ? 'کپی شد' : 'ناموفق', ok ? 'success' : 'error'));
}
function speakMessage(id) {
  if (!('speechSynthesis' in window)) { showToast('مرورگر پشتیبانی نمی‌کند', 'error'); return; }
  const msgs = state.messagesById[state.activeId] || [];
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  const u = new SpeechSynthesisUtterance(m.content.replace(/[*_`#]/g, '').slice(0, 500));
  u.lang = 'fa-IR';
  u.rate = state.settings.voiceSpeed;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  showToast('در حال خواندن…', 'info');
}

}

  else if (key === 'style') state.imageStyle = val;

const GEN_IMAGES = [
  'https://cdn.magicpatterns.com/patterns/generated-images/ed0bb85e-a781-4f05-994b-9b93e85b09fc.jpg',
  'https://cdn.magicpatterns.com/patterns/generated-images/23247da9-f550-4de9-93d1-e0ee55dbd82a.jpg',
  'https://cdn.magicpatterns.com/patterns/generated-images/2f04097e-96eb-4dfe-880e-5cae75daf8f3.jpg',
  'https://cdn.magicpatterns.com/patterns/generated-images/6540a3bc-01c2-4a36-acb2-5c508e531d8f.jpg',
];
function runImageGeneration() {
  if (!state.imagePrompt.trim() || state.imageRunning) return;
  state.imageRunning = true;
  state.imageProgress = 0;
  state.imageStage = 0;
  renderApp();
  const startTime = performance.now();
  const duration = 2600;
  const timer = setInterval(() => {
    const t = Math.min(1, (performance.now() - startTime) / duration);
    state.imageProgress = Math.round((1 - Math.pow(1 - t, 2)) * 100);
    state.imageStage = Math.min(2, Math.floor(t * 3));
    const pct = document.getElementById('img-progress-pct');
    const bar = document.getElementById('img-progress-bar');
    if (pct) pct.textContent = toPersianDigits(state.imageProgress) + '٪';
    if (bar) bar.style.width = state.imageProgress + '%';
    const stagesEl = document.querySelectorAll('.gen-stage');
    stagesEl.forEach((el, i) => { el.className = 'gen-stage ' + (i < state.imageStage ? 'done' : i === state.imageStage ? 'active' : ''); });
    if (t >= 1) {
      clearInterval(timer);
      const count = state.imageCount;
      const urls = Array.from({length: count}, (_, i) => GEN_IMAGES[(i + state.imageResults.length) % GEN_IMAGES.length]);
      state.imageResults.unshift({ id: uid('img'), prompt: state.imagePrompt, urls, aspect: state.imageAspect, size: state.imageSize, quality: state.imageQuality, style: state.imageStyle, time: formatTime(new Date()) });

      state.imageProgress = 0;

function fileIcon(name) {
  if (!name) return 'file-text';
  if (name.endsWith('.html')) return 'hash';
  if (name.endsWith('.css')) return 'palette';
  if (name.endsWith('.js')) return 'zap';
  if (name.endsWith('.py')) return 'terminal';
  if (name.endsWith('.json')) return 'clipboard';
  if (name.endsWith('.sql')) return 'table';
  if (name.endsWith('.md')) return 'file-text';
  return 'file-text';
}

function removeFile(i) {

function onStudioEdit(value) {
  const p = state.codeProjects.find(p => p.id === state.activeProjectId);
  p.files[state.activeFileIndex].content = value;
  const lineCount = value.split('\n').length;
  const gutter = document.getElementById('editor-gutter');
  if (gutter) gutter.textContent = Array.from({length: Math.max(lineCount, 20)}, (_, i) => i + 1).join('\n');
}
function syncGutter(textarea) {
  const gutter = document.getElementById('editor-gutter');
  if (gutter) gutter.scrollTop = textarea.scrollTop;
}
function studioAction(action) {
  const p = state.codeProjects.find(p => p.id === state.activeProjectId);
  const file = p.files[state.activeFileIndex];
  const responses = {
    generate: `### تولید کد\n\nبر اساس فایل \`${file.name}\`، کد پیشنهادی:\n\n\`\`\`js\n// کد تولیدشده\nfunction example() {\n  return "Hello from Nova AI";\n}\n\`\`\``,
    debug: `### رفع خطا\n\nبررسی خودکار انجام شد. **هیچ خطای نحوی** پیدا نشد.\n\n- مقادیر null/undefined را چک کنید\n- خطاهای async را مدیریت کنید`,
    refactor: `### Refactor\n\n1. منطق را به توابع کوچک‌تر تقسیم کنید\n2. وابستگی‌ها را جدا کنید\n3. الگوهای طراحی مناسب را استفاده کنید`,
    optimize: `### بهینه‌سازی\n\n- الگوریتم را از O(n²) به O(n log n) کاهش دهید\n- از ساختار داده مناسب استفاده کنید\n- نتایج تکراری را کش کنید`,
    convert: `### تبدیل زبان\n\nکد را به زبان مورد نظر تبدیل کنید. زبان‌های پشتیبانی‌شده: JS، Python، TypeScript، SQL`,
    analyze: `### تحلیل کد\n\n- **پیچیدگی:** O(n)\n- **خوانایی:** خوب\n- **پیشنهاد:** کامنت‌های بیشتر`,
    build: `### ساخت پروژه\n\nدر حال ساخت... ✓\n\nپروژه با موفقیت ساخته شد.`,
    run: 'کد با موفقیت اجرا شد ✓',
    docs: `### مستندات\n\n\`\`\`md\n# ${file.name}\n\n## توضیح\nاین فایل شامل ...\n\`\`\``,
  };
  if (action === 'run' || action === 'build') { showToast(responses[action]); return; }
  state.studioResponse = responses[action] || 'عملیات انجام شد.';
  renderApp();
  showToast('پاسخ AI آماده شد');
}
function insertResponseIntoEditor() {

function renderSearch() {
  let overlay = document.getElementById('search-overlay');
  if (!overlay) {
    overlay = document.createElement('div');

    document.getElementById('nova-overlay-root').appendChild(overlay);
  }

    <div class="search-backdrop" onclick="closeSearch()">

          ${icon('search',20)}
          <input id="search-input" placeholder="جستجو در گفتگوها…" value="${escapeAttr(state.searchQuery)}" oninput="onSearchInput(this.value)" onkeydown="onSearchKeydown(event)" />
        </div>
        <div class="search-filters">
          ${[{v:'all',l:'همه'},{v:'today',l:'امروز'},{v:'week',l:'هفته'},{v:'pinned',l:'سنجاق'},{v:'favorites',l:'علاقه‌مندی'}].map(f => `<button class="search-filter ${state.searchFilter === f.v ? 'active' : ''}" onclick="setSearchFilter('${f.v}')">${f.l}</button>`).join('')}
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>
  `;
  renderSearchResults(state.searchQuery);
  setTimeout(() => document.getElementById('search-input')?.focus(), 40);
}
function setSearchFilter(f) { state.searchFilter = f; renderSearch(); }
function onSearchInput(q) { state.searchQuery = q; state.searchActiveIndex = 0; renderSearchResults(q); }
function onSearchKeydown(e) {
  const results = document.querySelectorAll('.search-result');
  if (e.key === 'Escape') { closeSearch(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); state.searchActiveIndex = Math.min(state.searchActiveIndex + 1, results.length - 1); highlightSearchResult(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); state.searchActiveIndex = Math.max(state.searchActiveIndex - 1, 0); highlightSearchResult(); }
  else if (e.key === 'Enter') { e.preventDefault(); const r = results[state.searchActiveIndex]; if (r) r.click(); }
}
function highlightSearchResult() {
  const results = document.querySelectorAll('.search-result');
  results.forEach((r, i) => { r.style.background = i === state.searchActiveIndex ? 'rgb(var(--fill)/0.1)' : ''; });
}
function renderSearchResults(q) {
  const ql = q.trim().toLowerCase();
  let pool = state.conversations.slice();
  if (state.searchFilter === 'today') pool = pool.filter(c => c.group === 'today');
  if (state.searchFilter === 'week') pool = pool.filter(c => ['today','yesterday','week'].includes(c.group));
  if (state.searchFilter === 'pinned') pool = pool.filter(c => c.pinned);
  if (state.searchFilter === 'favorites') pool = pool.filter(c => c.favorite);
  let results;
  if (!ql) results = pool.slice(0, 8).map(c => ({ c, snippet: c.preview, type:'chat' }));
  else {
    results = [];
    pool.forEach(c => {
      if (c.title.toLowerCase().includes(ql)) results.push({ c, snippet: c.preview, type:'chat' });
      const msgs = state.messagesById[c.id] || [];
      msgs.forEach(m => { if (m.content && m.content.toLowerCase().includes(ql) && !results.find(r => r.c.id === c.id && r.type === 'message')) results.push({ c, snippet: m.content.slice(0, 80), type:'message' }); });
    });
  }
  const el = document.getElementById('search-results');
  if (!el) return;
  if (!results.length) {
    el.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 24px;color:rgb(var(--ink-3))">${icon('search-x',28)}<p style="margin:0;font-size:14px">نتیجه‌ای پیدا نشد</p></div>`;
    return;
  }
  el.innerHTML = `<p style="padding:0 12px 6px;margin:0;font-size:12px;color:rgb(var(--ink-3))">${ql ? `${toPersianDigits(results.length)} نتیجه` : 'گفتگوهای اخیر'}</p>` + results.map(r => `
    <button class="search-result" onclick="closeSearch();selectConversation('${r.c.id}')">
      <span class="search-result-icon" style="${tintStyle(tintSoft(r.c.tint))}">${icon(r.type === 'message' ? 'messages' : r.c.icon,17)}</span>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:14px;font-weight:600;color:rgb(var(--ink));overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${highlightText(r.c.title, ql)}</span>
        <span style="display:block;font-size:12.5px;color:rgb(var(--ink-2));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">${highlightText(r.snippet || '', ql)}</span>
      </span>
    </button>
  `).join('');
}
function highlightText(text, q) {
  if (!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const re = new RegExp(escapeRegex(q), 'gi');
  return esc.replace(re, m => `<mark style="background:rgb(var(--accent)/0.2);color:rgb(var(--ink));border-radius:4px;padding:0 2px">${m}</mark>`);
}

function setSetting(key, value) {
  state.settings[key] = value;
  saveSettings();
  applyTheme();
  const rerender = ['theme','accent','compactMode','showTimestamps','largerText','highContrast','reducedMotion','sidebarWidth'];
  if (rerender.includes(key)) { renderApp(); if (state.settingsOpen) renderSettings(); }
}
function toggleSetting(key) {
  state.settings[key] = !state.settings[key];
  saveSettings();
  applyTheme();
  renderApp();
  if (state.settingsOpen) renderSettings();
}
function resetAllSettings() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.settings = { ...DEFAULT_SETTINGS };
  applyTheme();
  renderApp();
  if (state.settingsOpen) renderSettings();
  showToast('تنظیمات بازنشانی شد');
}
function clearAllData() {
  if (!state.activeId) { showToast('گفتگویی انتخاب نشده', 'warning'); return; }
  state.messagesById[state.activeId] = [];
  saveMessages();
  renderApp();
  if (state.settingsOpen) renderSettings();
  showToast('پیام‌ها پاک شدند');
}
function exportAllData() {
  const data = { settings: state.settings, conversations: state.conversations, messages: state.messagesById, stats: state.stats, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nova-backup-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('خروجی آماده دانلود شد');
}

}
function normalizePanelCode(el){let v=fromPersianDigits(el.value).replace(/\D/g,'').slice(0,16);el.value=v;const c=document.getElementById('panel-code-count');if(c)c.textContent=`${toPersianDigits(v.length)}/۱۶`;}
function activatePanelCode(requestedPlan){const input=document.getElementById('panel-activation-code');const code=fromPersianDigits(input?.value||'').replace(/\D/g,'');if(code.length!==16){showToast('کد فعال‌سازی باید دقیقاً ۱۶ رقمی باشد','error');input?.focus();return;}const map={'2900000000000001':'Pro','6900000000000001':'MAX','2900000000000029':'Pro','6900000000000069':'MAX'};const plan=map[code];if(!plan){showToast('کد معتبر نیست','error');return;}if(plan!==requestedPlan){showToast(`این کد مربوط به پنل ${plan} است`,'error');return;}profile.plan=plan;profile.planLabel=plan;try{localStorage.setItem('NOVA_ACTIVE_PANEL',JSON.stringify({plan,code,at:Date.now()}));}catch(e){}closeModal('panel-purchase-overlay');closeModal('max-overlay');showToast(`پنل ${plan} با موفقیت فعال شد ✓`,'success');fireConfetti(28);renderApp();}
function openSupportCenter(){if(document.getElementById('support-overlay'))return;const overlay=document.createElement('div');overlay.id='support-overlay';document.getElementById('nova-overlay-root').appendChild(overlay);let messages=[];try{messages=JSON.parse(localStorage.getItem('NOVA_SUPPORT_MESSAGES')||'[]')}catch(e){}overlay.innerHTML=`<div class="support-backdrop" onclick="closeSupportCenter()"><section class="support-window" onclick="event.stopPropagation()"><header class="support-header"><button class="support-round" onclick="closeSupportCenter()">${icon('chevron-right',21,2)}</button><div class="support-avatar">${icon('headphones',21,2)}</div><div class="support-title"><b>پشتیبانی ARIX</b><span></span></div><button class="support-round" onclick="">${icon('more-vertical',18)}</button></header><div class="support-wall" id="support-wall"><div class="support-day">امروز</div><div class="support-welcome"><b>سلام ${escapeHtml(profile.firstName)} 👋</b><p>اینجا می‌توانید مثل تلگرام با پشتیبانی گفتگو کنید.</p><div class="support-quick"><button onclick="supportQuick('مشکل در خرید پنل دارم')">خرید پنل</button><button onclick="supportQuick('کد فعال‌سازی من کار نمی‌کند')">فعال‌سازی</button><button onclick="supportQuick('مشکل فنی دارم')">مشکل فنی</button></div></div>${messages.map(renderSupportMessage).join('')}</div><div class="support-composer"><button class="support-attach" onclick="triggerSupportAttachment()">${icon('paperclip',19)}</button><textarea id="support-input" rows="1" placeholder="پیام خود را بنویسید…" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendSupportMessage();}"></textarea><button class="support-send" onclick="sendSupportMessage()">${icon('arrow-up',18,2.5)}</button></div></section></div>`;requestAnimationFrame(()=>{const w=document.getElementById('support-wall');if(w)w.scrollTop=w.scrollHeight;});}
function renderSupportMessage(m){return `<div class="support-msg ${m.from==='user'?'user':'agent'}"><div>${escapeHtml(m.text)}</div><small>${escapeHtml(m.time||'اکنون')} ${m.from==='user'?'✓':''}</small></div>`;}
function supportQuick(t){const i=document.getElementById('support-input');if(i){i.value=t;i.focus();}}
function sendSupportMessage(){const i=document.getElementById('support-input');const text=i?.value.trim();if(!text)return;let messages=[];try{messages=JSON.parse(localStorage.getItem('NOVA_SUPPORT_MESSAGES')||'[]')}catch(e){}messages.push({from:'user',text,time:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})});try{localStorage.setItem('NOVA_SUPPORT_MESSAGES',JSON.stringify(messages))}catch(e){}closeSupportCenter();openSupportCenter();showToast('پیام برای پشتیبانی ثبت شد','success');}
function triggerSupportAttachment(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*,.pdf,.txt,.zip';inp.onchange=()=>{if(inp.files?.[0])showToast(`فایل ${inp.files[0].name} آماده ارسال است`,'info')};inp.click();}

function topUpWallet(amount, credits) {
  profile.walletBalance += amount * 1000;
  profile.credits = Math.min(profile.totalCredits, profile.credits + credits);
  closeModal('wallet-overlay');
  showToast(`${toPersianDigits(amount)} هزار تومان شارژ شد`);
  fireConfetti(40);
}
function closeModal(id) { const el = document.getElementById(id); if (el) el.remove(); }

/* ============================================================
   CONTEXT MENU — Fixed positioning، کنار کلیک باز می‌شود
   ============================================================ */
function openAccountMenu(e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  openContextMenu([
    { id:'profile', label:'پروفایل', icon:'user', onSelect: () => { openSettings(); setTimeout(() => setSettingsSection('account'), 50); } },
    { id:'stats', label:'آمار و تحلیل', icon:'chart', onSelect: openStats },
    { id:'plan', label:'اشتراک MAX', icon:'crown', onSelect: openMaxCenter },
    { id:'wallet', label:'کیف پول', icon:'wallet', onSelect: openWallet },
    { id:'settings', label:'تنظیمات', icon:'settings', onSelect: openSettings },
    { type:'divider' },
    { id:'logout', label:'خروج از حساب', icon:'logout', danger:true, onSelect: () => { state.authed = false; saveAuth(); renderAuth(); } },
  ], rect);
}

function openConvMenu(e, id) {
  e.stopPropagation();
  e.preventDefault();
  const c = state.conversations.find(x => x.id === id);
  if (!c) return;
  state.contextMenuAnchorId = id;
  const rect = e.currentTarget.getBoundingClientRect();
  openContextMenu([
    { id:'open', label:'باز کردن', icon:'messages', onSelect: () => selectConversation(id) },
    { id:'rename', label:'تغییر نام', icon:'pencil', onSelect: () => renameConv(id) },
    { id:'pin', label: c.pinned ? 'برداشتن سنجاق' : 'سنجاق کردن', icon:'pin', onSelect: () => toggleConvFlag(id, 'pinned') },
    { id:'fav', label: c.favorite ? 'حذف از علاقه‌مندی' : 'افزودن به علاقه‌مندی', icon:'star', onSelect: () => toggleConvFlag(id, 'favorite') },
    { id:'archive', label: c.archived ? 'خروج از بایگانی' : 'بایگانی', icon:'folder', onSelect: () => toggleConvFlag(id, 'archived') },
    { type:'divider' },
    { id:'share', label:'اشتراک‌گذاری', icon:'share', onSelect: () => shareConv(id) },
    { id:'duplicate', label:'تکثیر گفتگو', icon:'copy', onSelect: () => duplicateConv(id) },
    { id:'export', label:'خروجی گرفتن', icon:'download', onSelect: () => exportConv(id) },
    { type:'divider' },
    { id:'delete', label:'حذف', icon:'trash', danger:true, onSelect: () => deleteConversation(id) },
  ], rect);
}

function openContextMenu(items, rect) {
  closeContextMenu();
  // محاسبه موقعیت دقیق
  const menuWidth = 230;
  const menuHeight = items.length * 42 + 12;
  let left = rect.right - menuWidth;
  let top = rect.bottom + 6;
  // اگر از پایین صفحه بیرون زد، بالا نمایش بده
  if (top + menuHeight > window.innerHeight - 12) {
    top = Math.max(12, rect.top - menuHeight - 6);
  }
  // اگر از چپ صفحه بیرون زد
  if (left < 12) left = 12;
  if (left + menuWidth > window.innerWidth - 12) left = window.innerWidth - menuWidth - 12;
  // اگر راست‌چین بود، از سمت راست rect شروع کن
  if (document.documentElement.dir === 'rtl') {
    left = rect.right - menuWidth;
    if (left < 12) left = 12;
    if (left + menuWidth > window.innerWidth - 12) left = window.innerWidth - menuWidth - 12;
  }

  const el = document.createElement('div');
  el.id = 'ctx-menu';
  el.innerHTML = `<div class="ctx-backdrop" onclick="closeContextMenu()"></div>
    <div class="ctx-menu glass-strong" style="top:${top}px;left:${left}px;right:auto">
      ${items.map(it => {
        if (it.type === 'divider') return `<div class="ctx-divider"></div>`;
        return `<button class="ctx-item ${it.danger ? 'danger' : ''}" onclick="ctxSelect('${it.id}')">
          ${icon(it.icon, 17)}
          <span class="ctx-item-label">${it.label}</span>
          ${it.hint ? `<span class="ctx-item-hint">${it.hint}</span>` : ''}
        </button>`;
      }).join('')}
    </div>`;
  document.getElementById('nova-overlay-root').appendChild(el);
  window.__ctxItems = items;
}

function ctxSelect(id) {
  const item = (window.__ctxItems || []).find(x => x.id === id);
  closeContextMenu();
  if (item && item.onSelect) item.onSelect();
}

function closeContextMenu() {
  const el = document.getElementById('ctx-menu');
  if (el) el.remove();
  state.contextMenuAnchorId = null;
}

function toggleConvFlag(id, flag) {
  const c = state.conversations.find(x => x.id === id);
  if (!c) return;
  c[flag] = !c[flag];
  saveConversations();
  renderApp();
  const labels = {
    pinned:['سنجاق شد','سنجاق برداشته شد'],
    favorite:['به علاقه‌مندی اضافه شد','از علاقه‌مندی حذف شد'],
    archived:['بایگانی شد','از بایگانی خارج شد'],
  };
  showToast(labels[flag][c[flag] ? 0 : 1]);
}

function deleteConversation(id) {
  const c = state.conversations.find(x => x.id === id);
  if (!c) return;
  openDeleteConversationConfirm(id, c.title);
}

function openDeleteConversationConfirm(id, title) {
  closeContextMenu();
  const old = document.getElementById('delete-conversation-confirm');
  if (old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'delete-conversation-confirm';
  overlay.innerHTML = `
    <div class="delete-confirm-backdrop" onclick="closeDeleteConversationConfirm()">
      <div class="delete-confirm-card" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title">
        <div class="delete-confirm-icon">${icon('trash',22,2)}</div>
        <div class="delete-confirm-copy">
          <span class="delete-confirm-kicker">حذف گفتگو</span>
          <h3 id="delete-confirm-title">از حذف این گفتگو مطمئنی؟</h3>
          <p>گفتگوی «${escapeHtml(title)}» و پیام‌های ذخیره‌شده‌ی آن حذف می‌شوند. این کار قابل بازگشت نیست.</p>
        </div>
        <div class="delete-confirm-actions">
          <button class="delete-confirm-cancel" onclick="closeDeleteConversationConfirm()">انصراف</button>
          <button class="delete-confirm-danger" onclick="confirmDeleteConversation('${id}')">حذف گفتگو</button>
        </div>
      </div>
    </div>`;
  document.getElementById('nova-overlay-root').appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
}

function closeDeleteConversationConfirm() {
  const el = document.getElementById('delete-conversation-confirm');
  if (!el) return;
  el.classList.remove('show');
  setTimeout(() => el.remove(), 180);
}

function confirmDeleteConversation(id) {
  const c = state.conversations.find(x => x.id === id);
  state.conversations = state.conversations.filter(x => x.id !== id);
  delete state.messagesById[id];
  if (state.activeId === id) state.activeId = null;
  saveConversations();
  saveMessages();
  closeDeleteConversationConfirm();
  renderApp();
  showToast(c ? `گفتگوی «${c.title}» حذف شد` : 'گفتگو حذف شد');
}

function renameConv(id) {
  const c = state.conversations.find(x => x.id === id);
  if (!c) return;
  const next = prompt('نام جدید:', c.title);
  if (next && next.trim()) { c.title = next.trim(); saveConversations(); renderApp(); showToast('نام ذخیره شد'); }
}

function renameChat() { if (!state.activeId) return; renameConv(state.activeId); }

function shareConv(id) {
  const c = state.conversations.find(x => x.id === id);
  if (!c) return;
  copyText(c.title).then(ok => showToast(ok ? 'لینک کپی شد' : 'ناموفق', ok ? 'success' : 'error'));
}

function duplicateConv(id) {
  const c = state.conversations.find(x => x.id === id);
  if (!c) return;
  const newId = uid('c');
  const newConv = { ...c, id: newId, title: c.title + ' (کپی)', pinned: false, favorite: false, time: formatTime(new Date()), group: 'today' };
  state.conversations.unshift(newConv);
  state.messagesById[newId] = (state.messagesById[id] || []).map(m => ({ ...m, id: uid('m') }));
  saveConversations();
  saveMessages();
  renderApp();
  showToast('گفتگو تکثیر شد');
}

function exportConv(id) {
  const c = state.conversations.find(x => x.id === id);
  const msgs = state.messagesById[id] || [];
  const text = `# ${c?.title || 'گفتگو'}\n\n` + msgs.map(m => `## ${m.role === 'user' ? 'شما' : 'نوا'}\n${m.content}`).join('\n\n---\n\n');
  const blob = new Blob([text], { type:'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nova-${id}.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('خروجی آماده دانلود شد');
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
function openLightbox(url) {
  const el = document.createElement('div');
  el.id = 'lightbox';
  el.className = 'lightbox';
  el.innerHTML = `<div class="lightbox-actions">
      <button class="icon-btn glass-strong size-lg" onclick="closeLightbox()" aria-label="بستن">${icon('x',19)}</button>
      <button class="icon-btn glass-strong size-lg" onclick="downloadImage('${url}')" aria-label="دانلود">${icon('download',19)}</button>
    </div>
    <img src="${url}" alt="" />`;
  el.onclick = (e) => { if (e.target === el) closeLightbox(); };
  document.getElementById('nova-overlay-root').appendChild(el);
}
function closeLightbox() { const el = document.getElementById('lightbox'); if (el) el.remove(); }

/* ============================================================
   MOBILE TAB
   ============================================================ */
function mobileTab(tab) {
  if (tab === 'home') { state.workspaceMode = 'chat'; closeDrawer(); closeSearch(); closeSettings(); }
  else if (tab === 'chats') openDrawer();
  else if (tab === 'search') openSearch();
  else if (tab === 'settings') openSettings();
  renderApp();
}

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
window.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (e.shiftKey && k === 'o') { e.preventDefault(); newChat(); }
  else if (k === 'k') { e.preventDefault(); openSearch(); }
  else if (k === '/') { e.preventDefault(); openTools(); }
  else if (k === ',') { e.preventDefault(); openSettings(); }
  else if (k === 'b') { e.preventDefault(); toggleSidebar(); }
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.toolsOpen) closeTools();
    else if (state.searchOpen) closeSearch();
    else if (state.settingsOpen) closeSettings();
    else if (state.lightbox) closeLightbox();
    else if (document.getElementById('ctx-menu')) closeContextMenu();
  }
});

/* ============================================================
   RESIZE
   ============================================================ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.authed) renderApp(); else renderAuth();
    if (state.settingsOpen) renderSettings();
  }, 150);
});

/* ============================================================
   BOOT
   ============================================================ */
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (state.settings.theme === 'system') { applyTheme(); if (state.authed) renderApp(); else renderAuth(); }
});

try {
  const savedAuth = JSON.parse(localStorage.getItem(AUTH_KEY) || '{}');
  state.authed = !!savedAuth.authed;
} catch (e) {}
state.authView = 'login';
if (state.authed) renderApp(); else renderAuth();
</script>

/* Better code diagnostics — practical local scan + AI-style explanation */
const _novaOldStudioAction = studioAction;
function studioAction(action){
  if(action==='diagnose'){
    const p=state.codeProjects.find(p=>p.id===state.activeProjectId), f=p?.files?.[state.activeFileIndex];
    const code=f?.content||'';
    const issues=[];
    const pairs=[['{','}'],['(',')'],['[',']']];
    pairs.forEach(([a,b])=>{const ca=(code.match(new RegExp('\\'+a,'g'))||[]).length, cb=(code.match(new RegExp('\\'+b,'g'))||[]).length;if(ca!==cb)issues.push(`تعداد ${a} و ${b} برابر نیست.`)});
    if(/\bconsole\.log\(/.test(code)) issues.push('console.log در کد باقی مانده؛ در نسخه نهایی بهتر است مدیریت شود.');
    if(/TODO|FIXME/i.test(code)) issues.push('TODO/FIXME در فایل وجود دارد و نیاز به تکمیل دارد.');
    if(!issues.length) issues.push('در بررسی اولیه مشکل واضحی پیدا نشد؛ ساختار و منطق را برای بررسی عمیق‌تر تحلیل کنید.');
    state.studioResponse=`### بررسی هوشمند ${f?.name||''}\n\n${issues.map(x=>`- ${x}`).join('\n')}\n\n**پیشنهاد:** بعد از اصلاح، دوباره «بررسی هوشمند» را اجرا کنید.`;
    renderApp(); showToast('بررسی کد انجام شد','success'); return;
  }
  if(action==='fix'){
    const p=state.codeProjects.find(p=>p.id===state.activeProjectId), f=p?.files?.[state.activeFileIndex]; if(!f)return;
    let code=f.content||'';
    code=code.replace(/TODO:?/gi,'DONE:').replace(/FIXME:?/gi,'FIXED:');
    f.content=code; state.studioResponse='### رفع خودکار\n\nموارد ساده و واضح اصلاح شدند. موارد منطقی پیچیده نیاز به بررسی بیشتر دارند.'; renderApp(); showToast('اصلاح اولیه انجام شد','success'); return;
  }
  return _novaOldStudioAction(action);
}

/* Add two dedicated diagnostic controls to the code assistant without changing the core editor */
const _novaOldRenderCodeStudio = renderCodeStudio;
function renderCodeStudio(){
  let html=_novaOldRenderCodeStudio();
  const diag=`<button class="studio-action-pro" onclick="studioAction('diagnose')"><span>${icon('shield-check',15,2)}</span><b>بررسی</b></button>`;
  const fix=`<button class="studio-action-pro" onclick="studioAction('fix')"><span>${icon('sparkles',15,2)}</span><b>اصلاح</b></button>`;
  html=html.replace(/(<button class="studio-action-pro[^>]*onclick="studioAction\('analyze'\)"[\s\S]*?<\/button>)/, '$1'+diag+fix);
  const assistantDiag=`<button onclick="studioAction('diagnose')">${icon('shield-check',16)}<span>بررسی</span></button><button onclick="studioAction('fix')">${icon('sparkles',16)}<span>اصلاح</span></button>`;
  html=html.replace(/(<button onclick="studioAction\('analyze'\)">[\s\S]*?<\/button>)/, '$1'+assistantDiag);
  return html;
}

/* Support: Telegram-like chat with a lightweight simulated acknowledgement */
const _novaOldSendSupportMessage = sendSupportMessage;
function sendSupportMessage(){
  const i=document.getElementById('support-input'), text=i?.value.trim(); if(!text)return;
  let messages=[]; try{messages=JSON.parse(localStorage.getItem('NOVA_SUPPORT_MESSAGES')||'[]')}catch(e){}
  messages.push({from:'user',text,time:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})});
  try{localStorage.setItem('NOVA_SUPPORT_MESSAGES',JSON.stringify(messages))}catch(e){}
  closeSupportCenter(); openSupportCenter(); showToast('پیام ارسال شد','success');
  setTimeout(()=>{
    let list=[]; try{list=JSON.parse(localStorage.getItem('NOVA_SUPPORT_MESSAGES')||'[]')}catch(e){}
    list.push({from:'agent',text:'پیام شما دریافت شد. پشتیبانی در اولین فرصت پاسخ می‌دهد.',time:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})});

}

/* Reliable conversation selection on touch devices. */
function selectConversation(id){
  const item=state.conversations.find(c=>c.id===id);
  if(!item) return;
  state.activeId=id;
  state.workspaceMode='chat';
  state.contextMenuAnchorId=null;
  state.drawerOpen=false;
  saveConversations();
  renderApp();
  requestAnimationFrame(()=>{
    const sc=document.getElementById('chat-scroll');
    if(sc) sc.scrollTop=sc.scrollHeight;
  });
}

/* Opening the tools panel from the mobile menu should never be swallowed by the closing animation. */
function openTools(){
  state.toolsOpen=true;
  state.toolsSearch='';
  renderToolsPanel();
  const panel=document.querySelector('#tools-overlay .tools-panel');
  if(panel) panel.setAttribute('data-open','true');
}

/* Make tool selection explicit and functional on touch. */
function selectTool(id){
  closeTools();
  requestAnimationFrame(()=>{
    switch(id){
      case 'chat':
        state.workspaceMode='chat'; state.activeToolChips=[]; renderApp(); break;
      case 'image-gen': openImageGenerator(); break;
      case 'video-gen': openVideoGenerator(); break;
      case 'code-editor':
      case 'project': openCodeStudio(); break;
      case 'code-generator': addToolChip('code-generator'); break;
      case 'debug-code': addToolChip('debug-code'); break;
      case 'refactor': addToolChip('refactor'); break;
      case 'optimize': addToolChip('optimize'); break;
      case 'convert': addToolChip('convert'); break;
      case 'analyze-code': addToolChip('analyze-code'); break;
      case 'analyze-file':
      case 'analyze-pdf': addToolChip('analyze-file'); break;
      case 'analyze-image': addToolChip('analyze-image'); break;
      case 'analyze-data': addToolChip('analyze-data'); break;
      case 'web-search': addToolChip('web-search'); break;
      default: addToolChip(id); break;
    }
  });
}
