<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>به زودی</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Font Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow: hidden;
            touch-action: none;
        }
        
        /* Fullscreen 3D Canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* Glassmorphism subtle card for mobile */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
        }

        /* Typing cursor effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.9s infinite;
            font-weight: 300;
            color: #020617;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="relative h-screen w-screen flex flex-col items-center justify-between p-6 selection:bg-black selection:text-white">

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- Top Badge -->
    <header class="relative z-10 w-full flex justify-center pt-4">
        <div class="glass-card px-4 py-2 rounded-full flex items-center gap-2 text-xs font-semibold text-slate-700 shadow-sm border border-white/80">
            <!-- Spinner icon rotating -->
            <svg class="animate-spin h-4 w-4 text-slate-800" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>نسخه جدید به زودی</span>
        </div>
    </header>

    <!-- Center Interactive Mobile Typography -->
    <main class="relative z-10 w-full max-w-sm my-auto text-center pointer-events-none">
        <div class="glass-card p-6 sm:p-8 rounded-3xl transition-all duration-300 flex flex-col items-center justify-center gap-3">
            
            <!-- Animated Spinner Circle Icon -->
            <div class="relative flex items-center justify-center w-14 h-14 mb-1">
                <div class="absolute inset-0 rounded-full border-2 border-slate-200 border-t-slate-900 animate-spin"></div>
                <div class="w-8 h-8 rounded-full bg-slate-900/5 backdrop-blur-sm flex items-center justify-center">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-900 animate-ping"></span>
                </div>
            </div>

            <!-- Main Heading: In Development -->
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight leading-snug">
                در حال توسعه
            </h1>

            <p class="text-xs sm:text-sm text-slate-500 font-medium">
                <span id="typed-text" class="typing-cursor"></span>
            </p>
        </div>
    </main>

    <!-- Bottom Minimalism Hint -->
    <footer class="relative z-10 pb-4 text-center text-[11px] text-slate-400 font-medium">
        <span>به زودی با تجربه‌ای متفاوت می‌آییم ✨</span>
    </footer>

    <script>
        let scene, camera, renderer, particles, sphereGroup;
        let mainSphere, wireSphere, innerGlowSphere;
        let targetX = 0, targetY = 0;
        let touchStartX = 0, touchStartY = 0;

        function init3D() {
            const container = document.getElementById('canvas-container');

            // 1. Scene & Camera Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xf8fafc, 0.025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 18;

            // 2. Renderer with High DPR for crisp look on Mobile screens
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 3. Lighting (Soft white studio lighting)
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight1.position.set(10, 20, 15);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xe2e8f0, 0.8);
            dirLight2.position.set(-10, -10, -10);
            scene.add(dirLight2);

            // 4. Create Interactive Morphing 3D Sphere Group
            sphereGroup = new THREE.Group();

            // Core Glassy Geometric Sphere
            const sphereGeo = new THREE.IcosahedronGeometry(5.2, 4);
            const sphereMat = new THREE.MeshPhongMaterial({
                color: 0xffffff,
                emissive: 0xf1f5f9,
                shininess: 100,
                flatShading: true,
                transparent: true,
                opacity: 0.9
            });
            mainSphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphereGroup.add(mainSphere);

            // Outer Wireframe Dynamic Sphere
            const wireGeo = new THREE.IcosahedronGeometry(5.6, 2);
            const wireMat = new THREE.MeshBasicMaterial({
                color: 0xcbd5e1,
                wireframe: true,
                transparent: true,
                opacity: 0.45
            });
            wireSphere = new THREE.Mesh(wireGeo, wireMat);
            sphereGroup.add(wireSphere);

            // Inner Soft White Core
            const innerGeo = new THREE.SphereGeometry(3.2, 32, 32);
            const innerMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.7
            });
            innerGlowSphere = new THREE.Mesh(innerGeo, innerMat);
            sphereGroup.add(innerGlowSphere);

            scene.add(sphereGroup);

            // 5. Floating Dust Particles around the Ball
            const particleCount = 400;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 50;
                positions[i + 1] = (Math.random() - 0.5) * 50;
                positions[i + 2] = (Math.random() - 0.5) * 50;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Soft White Particle Texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);

            const pTexture = new THREE.CanvasTexture(canvas);

            const particleMat = new THREE.PointsMaterial({
                color: 0xcbd5e1,
                size: 0.6,
                map: pTexture,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // 6. Mobile & Desktop Interaction Listeners
            window.addEventListener('resize', onWindowResize, false);
            
            // Touch control for Mobile
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    const deltaX = (e.touches[0].clientX - touchStartX) * 0.005;
                    const deltaY = (e.touches[0].clientY - touchStartY) * 0.005;
                    targetX += deltaX;
                    targetY += deltaY;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });

            // Mouse control for Desktop/Testing
            window.addEventListener('mousemove', (e) => {
                targetX = (e.clientX - window.innerWidth / 2) * 0.002;
                targetY = (e.clientY - window.innerHeight / 2) * 0.002;
            }, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Smooth ball rotation
            if (sphereGroup) {
                sphereGroup.rotation.y += 0.005;
                sphereGroup.rotation.x += 0.003;

                // Respond smoothly to user Touch/Mouse move
                sphereGroup.rotation.y += (targetX - sphereGroup.rotation.y) * 0.05;
                sphereGroup.rotation.x += (targetY - sphereGroup.rotation.x) * 0.05;

                // Subtle floating up & down breathing animation
                sphereGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.4;
            }

            if (wireSphere) {
                wireSphere.rotation.y -= 0.007;
                wireSphere.rotation.z += 0.003;
            }

            if (particles) {
                particles.rotation.y = elapsedTime * 0.02;
            }

            renderer.render(scene, camera);
        }

        const phrases = [
            "چیزی فوق‌العاده در راه است...",
            "طراحی مدرن، ساده و زیبا.",
            "به زودی رونمایی می‌شود."
        ];
        let phraseIdx = 0;
        let charIdx = 0;
        let isDeleting = false;
        const typedTextElement = document.getElementById('typed-text');

        function typeEffect() {
            const currentPhrase = phrases[phraseIdx];

            if (isDeleting) {
                typedTextElement.textContent = currentPhrase.substring(0, charIdx - 1);
                charIdx--;
            } else {
                typedTextElement.textContent = currentPhrase.substring(0, charIdx + 1);
                charIdx++;
            }

            let typeSpeed = isDeleting ? 40 : 90;

            if (!isDeleting && charIdx === currentPhrase.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIdx === 0) {
                isDeleting = false;
                phraseIdx = (phraseIdx + 1) % phrases.length;
                typeSpeed = 400;
            }

            setTimeout(typeEffect, typeSpeed);
        }

        window.onload = function() {
            init3D();
            animate();
            typeEffect();
        };
    </script>
</body>
</html>
