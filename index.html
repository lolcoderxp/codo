<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<title>ARIX AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ============================================================
   HARD RESET
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}
*::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; background: transparent !important; }
*::-webkit-scrollbar-track { display: none !important; }
*::-webkit-scrollbar-thumb { display: none !important; }
html, body, #root, #nova-overlay-root { overflow-x: hidden !important; }
body { overflow: hidden !important; }

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: 255 255 255;
  --bg-2: 248 249 251;
  --surface: 255 255 255;
  --surface-2: 252 252 253;
  --fill: 118 118 128;
  --ink: 17 19 24;
  --ink-2: 88 93 106;
  --ink-3: 138 143 155;
  --ink-4: 176 180 190;
  --accent: 10 118 250;
  --accent-strong: 0 100 235;
  --accent-soft: 235 244 255;
  --danger: 225 45 40;
  --warning: 240 160 0;
  --success: 48 186 90;
  --glass: 255 255 255;
  --glass-a: 0.75;
  --glass-strong-a: 0.9;
  --glass-float-a: 0.85;
  --hairline: 0 0 0;
  --hairline-a: 0.06;
  --highlight: rgba(255,255,255,0.75);
  --shadow-xs: 0 1px 2px rgba(16,24,40,0.03);
  --shadow-sm: 0 1px 3px rgba(16,24,40,0.04), 0 4px 12px -6px rgba(16,24,40,0.08);
  --shadow-md: 0 2px 6px rgba(16,24,40,0.04), 0 12px 32px -12px rgba(16,24,40,0.12);
  --shadow-lg: 0 4px 12px rgba(16,24,40,0.05), 0 24px 56px -16px rgba(16,24,40,0.16);
  --shadow-xl: 0 8px 24px rgba(16,24,40,0.06), 0 40px 80px -24px rgba(16,24,40,0.2);
  --code-bg: 247 248 251;
  --tok-plain: 36 41 51;
  --tok-keyword: 150 60 205;
  --tok-string: 22 124 52;
  --tok-number: 180 82 0;
  --tok-comment: 128 134 146;
  --tok-fn: 0 100 212;
  --blur: 24px;
  --blur-strong: 30px;
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 26px;
  --r-2xl: 32px;
  --r-pill: 9999px;
  --r-bubble: 20px;
  --dur-fast: 0.14s;
  --dur: 0.22s;
  --dur-slow: 0.35s;
  --ease-ios: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --sidebar-w: 300px;
  --sidebar-rail-w: 72px;
}
.dark {
  --bg: 0 0 0;
  --bg-2: 6 6 8;
  --surface: 17 18 21;
  --surface-2: 24 25 29;
  --fill: 150 150 160;
  --ink: 244 245 249;
  --ink-2: 162 166 178;
  --ink-3: 112 116 128;
  --ink-4: 84 88 100;
  --accent: 90 166 255;
  --accent-strong: 10 110 232;
  --accent-soft: 20 40 80;
  --danger: 255 80 72;
  --warning: 255 180 80;
  --success: 52 199 89;
  --glass: 10 10 12;
  --glass-a: 0.72;
  --glass-strong-a: 0.88;
  --glass-float-a: 0.82;
  --hairline: 255 255 255;
  --hairline-a: 0.08;
  --highlight: rgba(255,255,255,0.06);
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 4px 12px -6px rgba(0,0,0,0.5);
  --shadow-md: 0 2px 6px rgba(0,0,0,0.3), 0 12px 32px -12px rgba(0,0,0,0.6);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.3), 0 24px 56px -16px rgba(0,0,0,0.7);
  --shadow-xl: 0 8px 24px rgba(0,0,0,0.4), 0 40px 80px -24px rgba(0,0,0,0.8);
  --code-bg: 18 19 24;
  --tok-plain: 222 226 234;
  --tok-keyword: 205 150 255;
  --tok-string: 140 216 150;
  --tok-number: 255 180 110;
  --tok-comment: 112 118 132;
  --tok-fn: 116 184 255;
}
.hc { --glass-a: 0.95 !important; --glass-strong-a: 0.98 !important; --glass-float-a: 0.96 !important; --hairline-a: 0.14; }
.dark.hc { --hairline-a: 0.2; }
.no-motion *, .no-motion *::before, .no-motion *::after { animation: none !important; transition-duration: 0.01ms !important; }

/* ============================================================
   BASE
   ============================================================ */
html, body, #root { height: 100%; }
html, body {
  margin: 0;
  overscroll-behavior: none;
  font-family: 'Inter', 'Vazirmatn', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
  color: rgb(var(--ink));
  background-color: rgb(var(--bg));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid rgb(var(--accent) / 0.5); outline-offset: 2px; border-radius: 6px; }
::selection { background: rgb(var(--accent) / 0.25); color: rgb(var(--ink)); }

/* ============================================================
   GLASS
   ============================================================ */
.glass {
  background-color: rgb(var(--glass) / var(--glass-a));
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  border: 1px solid rgb(var(--hairline) / var(--hairline-a));
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-sm);
}
.glass-float {
  background-color: rgb(var(--glass) / var(--glass-float-a));
  -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(190%);
  backdrop-filter: blur(var(--blur-strong)) saturate(190%);
  border: 1px solid rgb(var(--hairline) / var(--hairline-a));
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-md);
}
.glass-strong {
  background-color: rgb(var(--glass) / var(--glass-strong-a));
  -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
  backdrop-filter: blur(var(--blur-strong)) saturate(200%);
  border: 1px solid rgb(var(--hairline) / var(--hairline-a));
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-lg);
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes scale-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes slide-down { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes drawer-in { from { transform: translateX(105%); } to { transform: translateX(0); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-20px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes caret-blink { to { visibility: hidden; } }
@keyframes dot-bounce { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-3px); opacity: 1; } }
@keyframes shimmer { to { transform: translateX(100%); } }
@keyframes text-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes confetti-fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
@keyframes pulse-soft { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
@keyframes wave { 0%, 100% { height: 6px; } 50% { height: 20px; } }
@keyframes ctx-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   APP SHELL
   ============================================================ */
#root { display: flex; flex-direction: column; height: 100dvh; }
.app-canvas {
  position: relative; display: flex; height: 100dvh; width: 100%; overflow: hidden;
  color: rgb(var(--ink));
  background-color: rgb(var(--bg));
  background-image:
    radial-gradient(1100px 560px at 100% -10%, rgb(var(--accent) / 0.05), transparent 62%),
    radial-gradient(900px 520px at 0% 110%, rgb(var(--accent) / 0.03), transparent 60%);
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar-wrap {
  position: relative; z-index: 40; flex-shrink: 0;
  padding: 10px 0 10px 10px;
  transition: width 0.35s var(--ease-ios);
  overflow: hidden;
}
.sidebar {
  height: 100%; width: 100%;
  border-radius: var(--r-2xl);
  display: flex; flex-direction: column; overflow: hidden;
  position: relative;
}
.sidebar-head {
  display: flex; align-items: center; gap: 10px;
  height: 64px; padding: 0 10px 0 14px; flex-shrink: 0;
  border-bottom: 1px solid rgb(var(--hairline) / 0.04);
}
.brand-mark {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 16px -8px rgb(var(--accent-strong) / 0.7);
  position: relative;
}
.sidebar-brand-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sidebar-brand {
  font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
  color: rgb(var(--ink));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.2;
}
.sidebar-status { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: rgb(var(--success)); line-height: 1; }
.sidebar-status-dot {
  width: 6px; height: 6px; border-radius: var(--r-pill);
  background: rgb(var(--success));
  box-shadow: 0 0 0 3px rgb(var(--success) / 0.15);
  flex-shrink: 0;
  animation: pulse-soft 2s ease-in-out infinite;
}
.sidebar-collapse {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--r-md);
  color: rgb(var(--ink-3));
  transition: background-color var(--dur-fast), color var(--dur-fast);
  flex-shrink: 0;
}
.sidebar-collapse:hover { background-color: rgb(var(--fill) / 0.1); color: rgb(var(--ink)); }
.sidebar-collapse:active { transform: scale(0.92); }
.sidebar-quick { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.sidebar-action {
  display: flex; align-items: center; gap: 10px;
  height: 44px; padding: 0 10px;
  border-radius: var(--r-md);
  text-align: start; font-size: 13.5px; font-weight: 500;
  color: rgb(var(--ink)); width: 100%;
  transition: background-color var(--dur-fast), transform var(--dur-fast);
  position: relative;
}
.sidebar-action:hover { background-color: rgb(var(--fill) / 0.07); }
.sidebar-action:active { transform: scale(0.98); }
.sidebar-action-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--r-md);
  flex-shrink: 0; color: rgb(var(--ink-2));
  transition: color var(--dur-fast);
}
.sidebar-action.primary {
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 20px -10px rgb(var(--accent-strong) / 0.7);
}
.sidebar-action.primary:hover { filter: brightness(1.05); }
.sidebar-action.primary .sidebar-action-icon { color: #fff; background: rgba(255,255,255,0.18); }
.sidebar-action-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-action-hint { display: flex; gap: 2px; color: rgb(var(--ink-3)); opacity: 0; transition: opacity var(--dur-fast); }
.sidebar-action:hover .sidebar-action-hint { opacity: 1; }
.sidebar-action.primary .sidebar-action-hint { color: rgba(255,255,255,0.7); }
.sidebar-action-hint .kbd-mini {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px;
  background: rgb(var(--fill) / 0.1);
  font-size: 9.5px; font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}
.sidebar-action.primary .sidebar-action-hint .kbd-mini { background: rgba(255,255,255,0.15); }

.sidebar-tabs-wrap { padding: 0 10px 8px; flex-shrink: 0; }
.sidebar-tabs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 4px; border-radius: var(--r-md);
  background: rgb(var(--fill) / 0.09); gap: 2px;
}
.sidebar-tab {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  height: 30px; border-radius: calc(var(--r-md) - 4px);
  font-size: 12px; font-weight: 600; color: rgb(var(--ink-2));
  transition: color var(--dur), background-color var(--dur), box-shadow var(--dur);
  cursor: pointer; position: relative;
}
.sidebar-tab:hover { color: rgb(var(--ink)); }
.sidebar-tab.active { background: rgb(var(--surface)); color: rgb(var(--ink)); box-shadow: var(--shadow-xs); }
.sidebar-tab-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: var(--r-pill);
  background: rgb(var(--fill) / 0.15);
  font-size: 9.5px; font-weight: 700; color: rgb(var(--ink-3));
  font-variant-numeric: tabular-nums;
}
.sidebar-tab.active .sidebar-tab-count { background: rgb(var(--accent) / 0.15); color: rgb(var(--accent)); }

.sidebar-nav {
  flex: 1; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  padding: 0 8px 8px;
  position: relative;
}
.sidebar-section { padding-top: 8px; }
.sidebar-section-label {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px 4px;
  font-size: 10.5px; font-weight: 700; color: rgb(var(--ink-3));
  text-transform: uppercase; letter-spacing: 0.08em;
  user-select: none;
}
.sidebar-section-count { margin-inline-start: auto; font-size: 9.5px; font-weight: 600; color: rgb(var(--ink-3)); opacity: 0.7; }

.conv-item {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  min-height: 46px; width: 100%;
  padding: 7px 36px 7px 10px;
  border-radius: var(--r-md);
  text-align: start; cursor: pointer;
  transition: background-color var(--dur-fast);
  margin-bottom: 1px;
}
.conv-item:hover { background-color: rgb(var(--fill) / 0.06); }
.conv-item.active { background-color: rgb(var(--accent) / 0.1); }
.conv-item.active::before {
  content: ''; position: absolute;
  inset-inline-start: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 22px;
  border-radius: 0 3px 3px 0;
  background: rgb(var(--accent));
}
.conv-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--r-sm);
  flex-shrink: 0;
  transition: transform var(--dur-fast);
}
.conv-item:hover .conv-icon { transform: scale(1.05); }
.conv-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.conv-title {
  font-size: 13px; font-weight: 500; color: rgb(var(--ink));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.3;
}
.conv-item.active .conv-title { color: rgb(var(--accent)); font-weight: 600; }
.conv-preview {
  font-size: 11px; color: rgb(var(--ink-3));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.3;
}
.conv-meta {
  position: absolute;
  inset-inline-end: 8px; top: 50%; transform: translateY(-50%);
  display: flex; align-items: center; gap: 3px;
  transition: opacity var(--dur-fast);
}
.conv-time {
  font-size: 10.5px; font-variant-numeric: tabular-nums;
  color: rgb(var(--ink-3)); white-space: nowrap;
}
.conv-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: var(--r-pill);
  color: rgb(var(--ink-3));
}
.conv-badge.pin { color: rgb(var(--accent)); }
.conv-badge.star { color: rgb(240,160,0); }
.conv-more {
  position: absolute;
  inset-inline-end: 6px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-md);
  color: rgb(var(--ink-2));
  opacity: 0;
  transition: opacity var(--dur-fast), background-color var(--dur-fast);
  z-index: 2;
}
.conv-item:hover .conv-more { opacity: 1; }
.conv-item:hover .conv-meta { opacity: 0; }
.conv-more:hover { background-color: rgb(var(--fill) / 0.15); color: rgb(var(--ink)); }
.conv-more.active { opacity: 1; background-color: rgb(var(--accent) / 0.15); color: rgb(var(--accent)); }

.sidebar-foot { flex-shrink: 0; border-top: 1px solid rgb(var(--hairline) / 0.05); padding: 8px; }
.user-card {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 8px 10px;
  border-radius: var(--r-md);
  text-align: start;
  transition: background-color var(--dur-fast);
  position: relative;
}
.user-card:hover { background-color: rgb(var(--fill) / 0.07); }
.user-card:active { transform: scale(0.99); }
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-weight: 700; flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 12px -6px rgb(var(--accent-strong) / 0.7);
  position: relative;
}
.avatar-online {
  position: absolute; bottom: -1px; inset-inline-end: -1px;
  width: 11px; height: 11px; border-radius: var(--r-pill);
  background: rgb(var(--success));
  border: 2px solid rgb(var(--surface));
  box-shadow: 0 0 0 1px rgb(var(--success) / 0.3);
}
.user-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.user-name {
  font-size: 13px; font-weight: 600; color: rgb(var(--ink));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.2;
}
.user-meta { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: rgb(var(--ink-3)); line-height: 1; }
.plan-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 6px; border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-size: 9px; font-weight: 800;
  letter-spacing: 0.04em;
}
.plan-badge.small { font-size: 8.5px; padding: 1px 5px; }
.user-card-chev { color: rgb(var(--ink-3)); flex-shrink: 0; transition: transform var(--dur); }
.user-card:hover .user-card-chev { transform: translateY(2px); }

.sidebar-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 48px 24px; text-align: center; color: rgb(var(--ink-3));
}
.sidebar-empty-icon {
  display: flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; border-radius: var(--r-pill);
  background: rgb(var(--fill) / 0.08); color: rgb(var(--ink-3));
  margin-bottom: 4px;
}
.sidebar-empty-title { font-size: 13px; font-weight: 600; color: rgb(var(--ink-2)); margin: 0; }
.sidebar-empty-desc { font-size: 11.5px; line-height: 1.6; margin: 0; max-width: 200px; }
.sidebar-empty-cta {
  margin-top: 8px;
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: var(--r-pill);
  background: rgb(var(--accent) / 0.1); color: rgb(var(--accent));
  font-size: 12px; font-weight: 600;
  transition: background-color var(--dur-fast);
}
.sidebar-empty-cta:hover { background: rgb(var(--accent) / 0.18); }

/* Mini Rail */
.mini-rail {
  height: 100%; width: 100%;
  border-radius: var(--r-2xl);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 4px; position: relative;
}
.rail-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: var(--r-md);
  color: rgb(var(--ink-2));
  transition: background-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
}
.rail-btn:hover { background-color: rgb(var(--fill) / 0.1); color: rgb(var(--ink)); }
.rail-btn:active { transform: scale(0.94); }
.rail-btn.active { background-color: rgb(var(--accent) / 0.12); color: rgb(var(--accent)); }
.rail-btn.active::before {
  content: ''; position: absolute;
  inset-inline-start: -6px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px;
  border-radius: 0 3px 3px 0;
  background: rgb(var(--accent));
}
.rail-btn.primary {
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 6px 16px -8px rgb(var(--accent-strong) / 0.7);
}
.rail-btn.primary:hover { filter: brightness(1.05); color: #fff; }
.rail-divider { width: 24px; height: 1px; background: rgb(var(--hairline) / 0.1); margin: 6px 0; }
.rail-spacer { flex: 1; }
.rail-avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-weight: 700;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 12px -6px rgb(var(--accent-strong) / 0.7);
  position: relative;
}
.rail-avatar .avatar-online { width: 10px; height: 10px; border-width: 2px; }
.rail-btn::after, .rail-btn:hover::after { content: none !important; display: none !important; }

/* ============================================================
   MAIN COLUMN
   ============================================================ */
.main-col { position: relative; min-width: 0; flex: 1; display: flex; flex-direction: column; }

/* Header */
.header-wrap {
  position: absolute; top: 0; left: 0; right: 0; z-index: 30;
  pointer-events: none;
  padding: max(env(safe-area-inset-top), 10px) 12px 8px;
}
@media (min-width: 640px) { .header-wrap { padding: max(env(safe-area-inset-top), 12px) 16px 10px; } }
@media (min-width: 1024px) { .header-wrap { padding: max(env(safe-area-inset-top), 14px) 20px 12px; } }
.header-inner {
  margin: 0 auto; max-width: 1080px;
  display: flex; align-items: center; gap: 8px;
  pointer-events: auto;
}
.header-title-box {
  flex: 1; min-width: 0; height: 52px;
  border-radius: var(--r-pill);
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px 0 6px;
}
@media (min-width: 1024px) { .header-title-box { height: 56px; max-width: 460px; flex: 0 1 460px; } }
.header-action-box {
  height: 52px; border-radius: var(--r-pill);
  display: flex; align-items: center; gap: 2px;
  padding: 4px; flex-shrink: 0;
}
@media (min-width: 1024px) { .header-action-box { height: 56px; } }
.header-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: var(--r-pill);
  color: rgb(var(--ink-2));
  transition: background-color var(--dur), color var(--dur), transform var(--dur-fast);
}
@media (min-width: 1024px) { .header-btn { width: 46px; height: 46px; } }
.header-btn:hover { background-color: rgb(var(--fill) / 0.1); color: rgb(var(--ink)); }
.header-btn:active { transform: scale(0.92); }
.chat-title-btn {
  min-width: 0; flex: 1;
  padding: 6px 8px; border-radius: var(--r-md);
  text-align: start;
  display: flex; align-items: center; gap: 6px;
  transition: background-color var(--dur);
}
.chat-title-btn:hover { background-color: rgb(var(--fill) / 0.07); }
.chat-title-text {
  font-size: 15px; font-weight: 600; line-height: 1.2;
  color: rgb(var(--ink));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-title-status {
  font-size: 11px; font-weight: 500; line-height: 1rem;
  color: rgb(var(--accent));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Chat Area */
.chat-scroll {
  height: 100%; overflow-y: auto;
  overscroll-behavior: contain;
  padding-bottom: 240px;
}
.chat-inner {
  margin: 0 auto; width: 100%; max-width: 760px;
  padding: 8px 16px 0;
}
@media (min-width: 640px) { .chat-inner { padding-left: 24px; padding-right: 24px; } }
@media (min-width: 1024px) { .chat-scroll { padding-bottom: 200px; } }

.bubble { border-radius: var(--r-bubble); padding: 11px 16px; font-size: 15px; line-height: 1.75; }
.bubble-user {
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff;
  border-end-end-radius: 6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 8px 20px -14px rgb(var(--accent-strong) / 0.9);
  max-width: min(74%, 560px); margin-inline-start: auto;
}
@media (min-width: 640px) { .bubble-user { max-width: 58%; } }
@media (max-width: 639px) { .bubble-user { max-width: 76%; padding: 9px 13px; font-size: 14px; line-height: 1.7; } }
.bubble-user .bubble-content { white-space: pre-wrap; }
.assistant-row { display: flex; justify-content: flex-start; gap: 10px; }
.assistant-body { flex: 1; min-width: 0; }
.user-row { display: flex; flex-direction: column; align-items: flex-end; width: 100%; }
.user-actions, .assistant-actions {
  display: flex; align-items: center; gap: 2px; margin-top: 4px;
  opacity: 0; transition: opacity var(--dur);
}
.user-actions { height: 32px; margin-top: 2px; }
.assistant-actions { margin-inline-start: -6px; flex-wrap: wrap; }
.user-row:hover .user-actions, .assistant-row:hover .assistant-actions { opacity: 1; }
.assistant-actions.always-visible { opacity: 1; }
@media (hover: none) { .user-actions, .assistant-actions { opacity: 1; } }

/* Markdown */
.md-content { line-height: 1.75; }
.md-content p { margin: 0; }
.md-content p + p { margin-top: 8px; }
.md-content h1, .md-content h2, .md-content h3, .md-content h4 { font-weight: 700; margin: 14px 0 6px; letter-spacing: -0.01em; line-height: 1.3; }
.md-content h1:first-child, .md-content h2:first-child, .md-content h3:first-child, .md-content h4:first-child { margin-top: 0; }
.md-content h1 { font-size: 1.28em; }
.md-content h2 { font-size: 1.14em; }
.md-content h3 { font-size: 1.04em; }
.md-content h4 { font-size: 1em; }
.md-content ul, .md-content ol { margin: 6px 0; padding: 0; list-style: none; }
.md-content li { display: flex; gap: 10px; margin-bottom: 6px; }
.md-content li:last-child { margin-bottom: 0; }
.md-content li .bullet { width: 5px; height: 5px; border-radius: var(--r-pill); background: rgb(var(--accent)); margin-top: 0.7em; flex-shrink: 0; }
.md-content li .num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 1.4em; height: 1.4em; border-radius: var(--r-pill);
  background: rgb(var(--accent) / 0.1); color: rgb(var(--accent));
  font-size: 0.75em; font-weight: 600;
  margin-top: 0.2em; flex-shrink: 0;
}
.md-content blockquote {
  position: relative; border-radius: var(--r-md);
  background: rgb(var(--fill) / 0.07);
  padding: 10px 20px 10px 12px; color: rgb(var(--ink-2)); margin: 8px 0;
}
.md-content blockquote::before {
  content: ''; position: absolute;
  top: 10px; bottom: 10px; inset-inline-start: 8px;
  width: 3px; border-radius: var(--r-pill);
  background: rgb(var(--accent) / 0.6);
}
.md-content code {
  border-radius: var(--r-sm);
  background: rgb(var(--fill) / 0.12);
  padding: 2px 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.84em;
}
.md-content strong { font-weight: 600; }
.md-content em { font-style: italic; color: rgb(var(--ink-2)); }
.md-content a { color: rgb(var(--accent)); text-decoration: underline; text-underline-offset: 2px; }
.md-content hr { border: 0; border-top: 1px solid rgb(var(--hairline) / 0.1); margin: 12px 0; }
.md-content table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
.md-content table th { background: rgb(var(--fill) / 0.06); padding: 10px 14px; text-align: start; font-weight: 600; }
.md-content table td { padding: 10px 14px; color: rgb(var(--ink-2)); border-top: 1px solid rgb(var(--hairline) / 0.07); }
.md-content .table-wrap { border-radius: var(--r-lg); border: 1px solid rgb(var(--hairline) / 0.08); background: rgb(var(--surface) / 0.5); overflow-x: auto; margin: 8px 0; }
.md-content .task-list { list-style: none; padding: 0; }
.md-content .task-item { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 4px; }
.md-content .task-check {
  width: 16px; height: 16px; border-radius: 5px;
  border: 1.5px solid rgb(var(--hairline) / 0.2);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 4px;
  background: rgb(var(--surface) / 0.7);
}
.md-content .task-check.checked { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: #fff; }

.code-block { border-radius: var(--r-lg); overflow: hidden; margin: 8px 0; direction: ltr; text-align: left; background: rgb(var(--code-bg) / 0.82); border: 1px solid rgb(var(--hairline) / var(--hairline-a)); }
.code-block-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 4px; }
.code-block-lang { margin-inline-end: auto; border-radius: var(--r-pill); background: rgb(var(--fill) / 0.1); padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; text-transform: lowercase; color: rgb(var(--ink-2)); }
.code-block-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 500; color: rgb(var(--ink-2)); transition: color var(--dur), background-color var(--dur); }
.code-block-btn:hover { color: rgb(var(--ink)); background: rgb(var(--fill) / 0.08); }
.code-block pre { margin: 0; padding: 6px 16px 16px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.75; }
.code-block .line { display: flex; }
.code-block .ln { width: 20px; margin-right: 16px; text-align: right; color: rgb(var(--tok-comment) / 0.6); user-select: none; flex-shrink: 0; }
.code-block .src { white-space: pre; }
.tok-plain { color: rgb(var(--tok-plain)); }
.tok-keyword { color: rgb(var(--tok-keyword)); }
.tok-string { color: rgb(var(--tok-string)); }
.tok-number { color: rgb(var(--tok-number)); }
.tok-comment { color: rgb(var(--tok-comment)); font-style: italic; }
.tok-fn { color: rgb(var(--tok-fn)); }

/* Typing */
.typing-row { display: flex; align-items: center; gap: 10px; }
.typing-dots { display: flex; align-items: center; gap: 5px; }
.typing-dots span { width: 7px; height: 7px; border-radius: var(--r-pill); background: rgb(var(--ink-3)); animation: dot-bounce 0.9s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }
.stream-caret { display: inline-block; width: 2px; height: 1.05em; margin-inline-start: 2px; vertical-align: -0.15em; border-radius: 2px; background: rgb(var(--accent)); animation: caret-blink 1s steps(2, start) infinite; }
.text-shimmer { background-image: linear-gradient(90deg, rgb(var(--ink-3)) 0%, rgb(var(--ink)) 50%, rgb(var(--ink-3)) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: text-shimmer 1.8s linear infinite; }
.skeleton { position: relative; overflow: hidden; background-color: rgb(var(--fill) / 0.1); border-radius: var(--r-lg); }
.skeleton::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background-image: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.35), transparent); animation: shimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
.dark .skeleton::after { background-image: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.06), transparent); }

/* Composer */
.composer-wrap {
  position: absolute; inset-inline: 0; bottom: 0; z-index: 20;
  pointer-events: none;
}
.composer-inner {
  margin: 0 auto; width: 100%; max-width: 760px;
  padding: 0 12px max(env(safe-area-inset-bottom), 12px);
  pointer-events: auto;
}
@media (min-width: 640px) { .composer-inner { padding: 0 24px 12px; } }
.composer { border-radius: var(--r-2xl); padding: 6px; transition: border-color var(--dur), box-shadow var(--dur); }
.composer-focus { border-color: rgb(var(--accent) / 0.35); box-shadow: inset 0 1px 0 var(--highlight), 0 0 0 4px rgb(var(--accent) / 0.1), var(--shadow-lg); }
.composer-row { display: flex; align-items: flex-end; gap: 2px; }
.composer textarea {
  display: block; max-height: 180px; min-height: 44px; min-width: 0; flex: 1;
  resize: none; background: transparent; padding: 10px 8px;
  font-size: 16px; line-height: 24px;
  color: rgb(var(--ink)); outline: none; border: 0;
}
.composer textarea::placeholder { color: rgb(var(--ink-3)); }
.composer-action { color: rgb(var(--ink-2)); background: transparent; }
.composer-action:hover { background: rgb(var(--fill) / 0.08); color: rgb(var(--ink)); }
.composer-action.active { background: rgb(var(--accent) / 0.12); color: rgb(var(--accent)); }
.composer-actions-end { display: flex; align-items: center; gap: 2px; padding-bottom: 2px; }
.send-btn { width: 42px !important; height: 42px !important; box-shadow: 0 6px 16px -8px rgb(var(--accent-strong) / 0.9); }
.send-btn:disabled { opacity: 0.35; box-shadow: none; cursor: default; }
.composer-footnote { margin: 8px 0 0; text-align: center; font-size: 11.5px; color: rgb(var(--ink-3)); }
.tool-chips-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 4px; animation: fade-in 0.2s var(--ease-ios); }
@media (min-width: 640px) { .tool-chips-row { padding: 10px 14px 6px; } }
.tool-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 10px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; animation: scale-in 0.2s var(--ease-spring); }
.tool-chip svg { flex-shrink: 0; }
.tool-chip-close { width: 20px; height: 20px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; color: inherit; opacity: 0.75; transition: opacity var(--dur-fast), background-color var(--dur-fast); margin-inline-start: 2px; }
.tool-chip-close:hover { opacity: 1; background: rgba(255,255,255,0.4); }

/* Attachment Cards — integrated inside the composer shell */
.attach-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
  box-sizing: border-box;
  padding: 6px 6px 8px;
  margin: 0;
}
@media (min-width: 640px) {
  .attach-preview { padding: 8px 10px 10px; }
}
.attach-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 18px;
  background: rgb(var(--surface) / 0.92);
  border: 1px solid rgb(var(--hairline) / 0.10);
  box-shadow: var(--shadow-xs);
  min-width: 0;
  width: min(100%, 330px);
  max-width: 330px;
  box-sizing: border-box;
  transition: transform var(--dur) var(--ease-spring), box-shadow var(--dur);
}
.attach-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.attach-card-close {
  position: absolute;
  top: 7px;
  inset-inline-end: 7px;
  width: 24px;
  height: 24px;
  border-radius: var(--r-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgb(var(--ink-3));
  background: rgb(var(--fill) / 0.05);
  transition: background-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
  z-index: 2;
}
.attach-card-close:hover { background: rgb(var(--fill) / 0.12); color: rgb(var(--ink)); transform: scale(1.04); }
.attach-card-body { display: flex; align-items: center; gap: 10px; width: 100%; padding-inline-end: 25px; }
.attach-card-info { flex: 1; min-width: 0; text-align: start; }
.attach-card-name { font-size: 13px; font-weight: 650; color: rgb(var(--ink)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
.attach-card-meta { font-size: 10.5px; color: rgb(var(--ink-3)); margin-bottom: 4px; }
.attach-card-status { display: flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 650; color: rgb(var(--success)); }
.attach-card-check { width: 14px; height: 14px; border-radius: var(--r-pill); background: rgb(var(--success)); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.attach-card-icon { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.attach-card-thumb { position: relative; width: 72px; height: 60px; border-radius: 15px; overflow: hidden; background: rgb(var(--fill) / 0.1); flex-shrink: 0; }
.attach-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.attach-card-thumb-actions { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: space-between; padding: 4px; background: linear-gradient(180deg, rgba(0,0,0,0.38), transparent 55%); }
.attach-thumb-btn { width: 22px; height: 22px; border-radius: var(--r-pill); background: rgba(255,255,255,0.95); color: rgb(var(--ink)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-xs); transition: transform var(--dur-fast); }
.attach-thumb-btn:hover { transform: scale(1.08); }
.attach-thumb-check { position: absolute; bottom: 4px; inset-inline-end: 4px; width: 20px; height: 20px; border-radius: var(--r-pill); background: rgb(var(--success)); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }

@media (max-width: 639px) {
  .composer-pro { padding: 5px !important; }
  .composer-pro .attach-preview {
    padding: 5px 5px 7px !important;
    gap: 7px !important;
  }
  .composer-pro .attach-card {
    width: 100%;
    max-width: none;
    min-height: 58px;
    border-radius: 17px;
    padding: 7px 9px;
  }
  .composer-pro .attach-card-thumb {
    width: 70px;
    height: 58px;
    border-radius: 14px;
  }
  .composer-pro .attach-card-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
  }
  .composer-pro .attach-card-name { font-size: 12.5px; }
  .composer-pro .attach-card-meta,
  .composer-pro .attach-card-status { font-size: 10px; }
  .composer-pro .composer-row-pro {
    border-top: 1px solid rgb(var(--hairline) / 0.06);
    padding-top: 2px;
  }
}

/* Voice Recorder */
.recorder-bar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r-pill); background: rgb(var(--danger) / 0.1); color: rgb(var(--danger)); margin-bottom: 8px; }
.recorder-pulse { width: 10px; height: 10px; border-radius: var(--r-pill); background: rgb(var(--danger)); animation: pulse-soft 1.2s ease-in-out infinite; }
.recorder-wave { display: flex; align-items: center; gap: 2px; height: 24px; }
.recorder-wave span { width: 3px; border-radius: var(--r-pill); background: currentColor; height: 6px; animation: wave 1s ease-in-out infinite; }

/* Mobile Nav */
.mobile-nav {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-radius: var(--r-2xl); padding: 6px; gap: 0;
  margin-top: 8px;
}
.mobile-nav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; height: 52px; border-radius: var(--r-xl);
  font-size: 10.5px; font-weight: 500;
  color: rgb(var(--ink-2));
  transition: color var(--dur), background-color var(--dur);
}
.mobile-nav button.active { color: rgb(var(--accent)); background: rgb(var(--accent) / 0.1); }

/* Icon Button */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  transition: background-color var(--dur), color var(--dur), transform var(--dur-fast);
  flex-shrink: 0;
}
.icon-btn:hover { background-color: rgb(var(--fill) / 0.1); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn.accent { background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; }
.icon-btn.accent:hover { filter: brightness(1.05); }
.icon-btn.soft { background-color: rgb(var(--fill) / 0.09); }
.icon-btn.size-xs { width: 26px; height: 26px; }
.icon-btn.size-sm { width: 32px; height: 32px; }
.icon-btn.size-md { width: 40px; height: 40px; }
.icon-btn.size-lg { width: 44px; height: 44px; }

/* Empty State */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px 0;
  min-height: calc(100dvh - 340px);
}
.empty-state h1 { margin: 22px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
@media (min-width: 640px) { .empty-state h1 { font-size: 28px; } }
.empty-state .sub { margin: 10px 0 0; max-width: 26rem; font-size: 15px; line-height: 1.7; color: rgb(var(--ink-2)); }
.chips-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 42rem; margin-top: 28px; }
.suggestion-chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 16px 0 14px;
  border-radius: var(--r-pill);
  font-size: 14px; font-weight: 500;
  color: rgb(var(--ink));
  transition: transform var(--dur-fast) var(--ease-spring), background-color var(--dur);
  cursor: pointer;
}
.suggestion-chip:hover { transform: translateY(-2px); }
.suggestion-chip:active { transform: scale(0.96); }

/* Tools Panel */
.tools-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,0.28);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  animation: fade-in 0.2s var(--ease-ios);
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 768px) { .tools-backdrop { align-items: center; padding: 24px; } }
.tools-panel {
  width: 100%; max-width: 720px;
  max-height: min(85dvh, 720px);
  border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  display: flex; flex-direction: column; overflow: hidden;

/* Context Menu */
.ctx-backdrop { position: fixed; inset: 0; z-index: 150; }
.ctx-menu {
  position: fixed;
  width: 230px;
  border-radius: var(--r-xl);
  padding: 6px;
  animation: ctx-in 0.16s var(--ease-ios);
  transform-origin: top right;
  z-index: 151;
}
.ctx-item {
  display: flex; align-items: center; gap: 12px;
  width: 100%; height: 40px; padding: 0 12px;
  border-radius: var(--r-sm);
  font-size: 14px; font-weight: 500;
  text-align: start;
  transition: background-color var(--dur-fast);
}
.ctx-item:hover { background: rgb(var(--fill) / 0.1); }
.ctx-item.danger { color: rgb(var(--danger)); }
.ctx-item.danger:hover { background: rgb(var(--danger) / 0.1); }
.ctx-item-label { flex: 1; }
.ctx-item-hint { font-size: 11px; color: rgb(var(--ink-3)); font-family: 'JetBrains Mono', monospace; }
.ctx-divider { height: 1px; background: rgb(var(--hairline) / 0.08); margin: 4px 8px; }

/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,0.72); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); animation: fade-in 0.22s; }
.lightbox img { max-width: 100%; max-height: 82dvh; border-radius: var(--r-2xl); box-shadow: var(--shadow-xl); object-fit: contain; }
.lightbox-actions { position: absolute; inset-inline: 0; top: 0; display: flex; justify-content: space-between; padding: max(env(safe-area-inset-top), 12px) 16px 0; }

/* Auth */
.auth-shell {
  position: relative; display: flex;
  height: 100dvh; width: 100%;
  overflow-y: auto; overscroll-behavior: contain;
  background-color: rgb(var(--bg));
  background-image:
    radial-gradient(1200px 600px at 100% -10%, rgb(var(--accent) / 0.08), transparent 60%),
    radial-gradient(900px 500px at 0% 110%, rgb(var(--accent) / 0.06), transparent 60%);
}
.auth-grid { display: grid; grid-template-columns: 1fr; width: 100%; min-height: 100dvh; }
@media (min-width: 1024px) { .auth-grid { grid-template-columns: 1.05fr 1fr; } }
.auth-brand-panel { display: none; padding: 60px 56px; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
@media (min-width: 1024px) { .auth-brand-panel { display: flex; } }
.auth-brand-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(600px 400px at 30% 20%, rgb(var(--accent) / 0.12), transparent 60%), radial-gradient(500px 500px at 80% 80%, rgb(var(--accent) / 0.08), transparent 60%); pointer-events: none; }
.auth-brand-head { position: relative; display: flex; align-items: center; gap: 12px; }
.auth-brand-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.auth-brand-hero { position: relative; margin: auto 0; max-width: 480px; }
.auth-brand-hero h2 { margin: 0; font-size: 40px; font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; color: rgb(var(--ink)); }
.auth-brand-hero p { margin: 16px 0 0; font-size: 16px; line-height: 1.7; color: rgb(var(--ink-2)); }
.auth-features { position: relative; display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
.auth-feature { display: flex; align-items: center; gap: 12px; font-size: 14.5px; color: rgb(var(--ink-2)); }
.auth-feature-icon { width: 32px; height: 32px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.auth-brand-foot { position: relative; font-size: 12.5px; color: rgb(var(--ink-3)); }
.auth-form-panel { display: flex; align-items: center; justify-content: center; padding: 60px 20px max(env(safe-area-inset-bottom), 24px); }
@media (min-width: 1024px) { .auth-form-panel { padding: 60px 56px; } }
.auth-card { width: 100%; max-width: 400px; padding: 32px 28px; border-radius: var(--r-2xl); }
@media (min-width: 1024px) {
  .auth-card {
    background: rgb(var(--glass) / var(--glass-strong-a));
    border: 1px solid rgb(var(--hairline) / var(--hairline-a));
    box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-lg);
    padding: 40px 36px;
  }
}
.auth-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; }
.auth-head h1 { margin: 18px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.auth-head p { margin: 6px 0 0; max-width: 320px; font-size: 14px; line-height: 1.5rem; color: rgb(var(--ink-2)); }
.auth-field { margin-bottom: 14px; }
.auth-field-label { display: block; padding: 0 4px 6px; font-size: 12.5px; font-weight: 600; color: rgb(var(--ink-2)); }
.auth-field-input { display: flex; align-items: center; gap: 10px; height: 52px; border-radius: var(--r-lg); border: 1px solid rgb(var(--hairline) / 0.1); background: rgb(var(--surface) / 0.7); padding: 0 6px 0 16px; transition: border-color var(--dur), box-shadow var(--dur); }
.auth-field-input:focus-within { border-color: rgb(var(--accent) / 0.4); box-shadow: 0 0 0 4px rgb(var(--accent) / 0.12); }
.auth-field-input.error { border-color: rgb(var(--danger) / 0.5); }
.auth-field-input input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; font-size: 16px; color: rgb(var(--ink)); }
.auth-field-input input::placeholder { color: rgb(var(--ink-3)); }
.auth-error { display: flex; align-items: center; gap: 6px; padding: 6px 4px 0; font-size: 12.5px; font-weight: 500; color: rgb(var(--danger)); }
.pw-strength { display: flex; gap: 4px; padding: 6px 4px 0; }
.pw-strength-bar { flex: 1; height: 4px; border-radius: var(--r-pill); background: rgb(var(--fill) / 0.15); transition: background-color var(--dur); }
.pw-strength-bar.active { background: rgb(var(--success)); }
.pw-strength-bar.active.weak { background: rgb(var(--danger)); }
.pw-strength-bar.active.fair { background: rgb(var(--warning)); }
.auth-submit { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: var(--r-pill); background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 14px 28px -14px rgb(var(--accent-strong) / 0.8); transition: transform var(--dur-fast), filter var(--dur); }
.auth-submit:hover { filter: brightness(1.05); }
.auth-submit:active { transform: scale(0.98); }
.auth-submit:disabled { opacity: 0.6; cursor: default; }
.auth-submit.success { background: linear-gradient(135deg, rgb(var(--success)) 0%, rgb(35 155 75) 100%); }
.divider { display: flex; align-items: center; gap: 12px; padding: 4px 0; font-size: 12.5px; color: rgb(var(--ink-3)); }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgb(var(--hairline) / 0.1); }
.social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.social-btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: var(--r-pill); border: 1px solid rgb(var(--hairline) / 0.1); background: rgb(var(--surface) / 0.7); font-size: 14px; font-weight: 600; transition: background-color var(--dur-fast), transform var(--dur-fast); }
.social-btn:hover { background: rgb(var(--surface)); }
.social-btn:active { transform: scale(0.97); }
.auth-link { font-weight: 600; color: rgb(var(--accent)); }
.auth-link:hover { text-decoration: underline; }
.auth-foot { padding-top: 8px; text-align: center; font-size: 13.5px; color: rgb(var(--ink-2)); }
.auth-hint { text-align: center; font-size: 12px; color: rgb(var(--ink-3)); }
.auth-hint button { color: rgb(var(--ink-2)); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
.form-alert { border-radius: var(--r-md); background: rgb(var(--danger) / 0.1); padding: 12px 16px; font-size: 13.5px; font-weight: 500; line-height: 1.5rem; color: rgb(var(--danger)); }

/* MAX Center */
.max-hero { padding: 40px 24px; text-align: center; border-radius: var(--r-2xl); background: linear-gradient(135deg, rgb(var(--accent) / 0.1), rgb(var(--accent) / 0.04)); border: 1px solid rgb(var(--accent) / 0.15); margin-bottom: 24px; }
.max-hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: var(--r-pill); background: linear-gradient(135deg, rgb(var(--accent)), rgb(var(--accent-strong))); color: #fff; font-size: 12px; font-weight: 700; margin-bottom: 16px; }
.max-hero h2 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.max-hero p { margin: 12px auto 0; max-width: 480px; font-size: 15px; line-height: 1.7; color: rgb(var(--ink-2)); }
.plan-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 768px) { .plan-grid { grid-template-columns: repeat(3, 1fr); } }
.plan-card { position: relative; display: flex; flex-direction: column; padding: 24px; border-radius: var(--r-2xl); border: 1px solid rgb(var(--hairline) / 0.08); background: rgb(var(--surface) / 0.7); transition: transform var(--dur) var(--ease-spring), box-shadow var(--dur); }
.plan-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.plan-card.featured { border: 2px solid rgb(var(--accent)); background: linear-gradient(180deg, rgb(var(--accent) / 0.08), rgb(var(--surface) / 0.9)); box-shadow: 0 8px 32px -12px rgb(var(--accent) / 0.4); }
.plan-card-name { font-size: 20px; font-weight: 700; margin: 0; }
.plan-card-tag { font-size: 12.5px; color: rgb(var(--ink-2)); margin: 4px 0 0; }
.plan-card-price { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 20px 0 4px; line-height: 1; }
.plan-card-price small { font-size: 12px; font-weight: 500; color: rgb(var(--ink-2)); margin-inline-start: 6px; }
.plan-features { margin: 20px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.plan-feature { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: rgb(var(--ink-2)); }
.plan-cta { margin-top: 24px; height: 46px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; background: rgb(var(--fill) / 0.1); color: rgb(var(--ink)); transition: background-color var(--dur); }
.plan-cta:hover { background: rgb(var(--fill) / 0.18); }
.plan-card.featured .plan-cta { background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 12px 24px -12px rgb(var(--accent-strong) / 0.7); }
.plan-card.featured .plan-cta:hover { filter: brightness(1.05); }
.credit-hero { border-radius: var(--r-2xl); padding: 24px; background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; position: relative; overflow: hidden; box-shadow: 0 16px 40px -16px rgb(var(--accent-strong) / 0.7); }
.credit-hero::before { content: ''; position: absolute; top: -40px; inset-inline-end: -40px; width: 180px; height: 180px; border-radius: var(--r-pill); background: rgba(255,255,255,0.08); }
.credit-label { position: relative; font-size: 13px; opacity: 0.85; margin: 0; }
.credit-value { position: relative; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 0; line-height: 1.1; }
.credit-progress { position: relative; height: 5px; border-radius: var(--r-pill); background: rgba(255,255,255,0.2); overflow: hidden; margin-top: 16px; }
.credit-progress > div { height: 100%; border-radius: var(--r-pill); background: #fff; transition: width var(--dur-slow); }

/* Wallet */
.tx-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid rgb(var(--hairline) / 0.06); }
.tx-item:last-child { border-bottom: 0; }
.tx-icon { width: 40px; height: 40px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tx-info { flex: 1; min-width: 0; }
.tx-title { font-size: 14px; font-weight: 600; margin: 0; }
.tx-date { font-size: 12px; color: rgb(var(--ink-3)); margin: 2px 0 0; }
.tx-amount { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tx-amount.plus { color: rgb(var(--success)); }
.tx-amount.minus { color: rgb(var(--ink-2)); }
.topup-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 540px) { .topup-grid { grid-template-columns: repeat(4, 1fr); } }
.topup-option { padding: 16px 12px; border-radius: var(--r-xl); border: 1px solid rgb(var(--hairline) / 0.1); background: rgb(var(--surface) / 0.7); text-align: center; transition: border-color var(--dur), background-color var(--dur), transform var(--dur-fast); }
.topup-option:hover { border-color: rgb(var(--accent) / 0.4); background: rgb(var(--accent) / 0.04); }
.topup-option:active { transform: scale(0.98); }
.topup-amount { font-size: 16px; font-weight: 700; color: rgb(var(--ink)); }
.topup-bonus { font-size: 11px; font-weight: 600; color: rgb(var(--success)); margin-top: 4px; }
.topup-credits { font-size: 11px; color: rgb(var(--ink-3)); margin-top: 2px; }

/* Confetti */
.confetti { position: fixed; width: 10px; height: 10px; top: -10px; z-index: 300; pointer-events: none; animation: confetti-fall linear forwards; }

/* Range */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  height: 28px; background: transparent; cursor: pointer; width: 100%; outline: none;
}
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: var(--r-pill); background: rgb(var(--fill) / 0.2); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; margin-top: -8px; height: 22px; width: 22px; border-radius: var(--r-pill); background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.06); transition: transform var(--dur-fast); }
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: var(--r-pill); background: rgb(var(--fill) / 0.2); }
input[type="range"]::-moz-range-thumb { height: 22px; width: 22px; border: none; border-radius: var(--r-pill); background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.22); }

/* Sources */
.sources-section { margin-top: 12px; padding: 12px; border-radius: var(--r-lg); background: rgb(var(--surface) / 0.6); border: 1px solid rgb(var(--hairline) / 0.06); }
.sources-title { font-size: 12px; font-weight: 700; color: rgb(var(--ink-3)); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.source-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); transition: background-color var(--dur-fast); cursor: pointer; }
.source-item:hover { background: rgb(var(--fill) / 0.06); }
.source-num { width: 24px; height: 24px; border-radius: var(--r-pill); background: rgb(var(--accent) / 0.12); color: rgb(var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.source-body { flex: 1; min-width: 0; }
.source-title { font-size: 13px; font-weight: 600; color: rgb(var(--ink)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-domain { font-size: 11.5px; color: rgb(var(--ink-3)); margin-top: 1px; }

/* Mobile tweaks */
@media (max-width: 640px) {
  .header-wrap { padding: max(env(safe-area-inset-top), 8px) 10px 6px; }
  .header-title-box { height: 48px; padding: 0 10px 0 4px; }
  .header-action-box { height: 48px; padding: 2px; }
  .header-btn { width: 40px; height: 40px; }
  .chat-inner { padding-left: 12px; padding-right: 12px; }
  .composer-inner { padding: 0 10px max(env(safe-area-inset-bottom), 10px); }
  .empty-state h1 { font-size: 22px; }
  .empty-state { min-height: calc(100dvh - 300px); padding: 24px 0; }
}

img, video, svg, canvas { max-width: 100%; }
table { max-width: 100%; }
pre { max-width: 100%; }

/* ============================================================
   PRO HEADER + UPDATES CHANNEL
   ============================================================ */
.header-action-box-pro { padding: 5px; gap: 2px; }
.header-action-box-pro .header-btn { position:relative; }
.header-update-btn { overflow:visible; }
.header-notification-dot,
.mobile-menu-notify-dot {
  position:absolute; width:7px; height:7px; border-radius:50%;
  background:rgb(var(--accent)); box-shadow:0 0 0 2px rgb(var(--glass));
}
.header-notification-dot { top:8px; inset-inline-end:8px; }
.mobile-menu-notify-dot { top:12px; inset-inline-start:12px; }

.mobile-menu-backdrop { align-items:flex-end !important; padding:0 !important; }
.mobile-menu-panel {
  width:min(100%,560px); max-height:min(88dvh,760px); overflow:auto;
  border-radius:30px 30px 0 0; padding:0 14px calc(env(safe-area-inset-bottom) + 14px);
  animation:menu-sheet-in .42s var(--ease-ios);
}
@keyframes menu-sheet-in { from{opacity:0;transform:translateY(28px) scale(.985)} to{opacity:1;transform:none} }
.mobile-menu-head { display:flex;align-items:center;justify-content:space-between;padding:8px 6px 14px; }
.mobile-menu-head h2 { margin:2px 0 0;font-size:20px;font-weight:800;letter-spacing:-.02em; }
.mobile-menu-kicker { font-size:9px;font-weight:800;letter-spacing:.18em;color:rgb(var(--accent)); }
.mobile-menu-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
.mobile-menu-tile {
  position:relative; min-height:78px; padding:12px; display:flex;align-items:center;gap:10px;
  text-align:start;border:1px solid rgb(var(--hairline)/.07);border-radius:20px;
  background:rgb(var(--surface)/.58);transition:transform .22s var(--ease-spring),background .22s,border-color .22s;
}
.mobile-menu-tile:hover { transform:translateY(-2px);background:rgb(var(--surface)/.9);border-color:rgb(var(--accent)/.18); }
.mobile-menu-tile:active { transform:scale(.975); }
.mobile-menu-icon { width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:15px;background:rgb(var(--accent)/.1);color:rgb(var(--accent));flex-shrink:0; }
.mobile-menu-copy { min-width:0;display:flex;flex-direction:column;gap:4px; }
.mobile-menu-copy strong { font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.mobile-menu-copy small { font-size:10.5px;color:rgb(var(--ink-3));white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.mobile-menu-chevron { margin-inline-start:auto;color:rgb(var(--ink-3)); }
.mobile-menu-logout { width:100%;height:46px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;color:rgb(var(--danger));background:rgb(var(--danger)/.07);font-size:13px;font-weight:700; }

.updates-settings-card {
  position:relative;overflow:hidden;display:flex;align-items:stretch;gap:16px;padding:0;
  border:1px solid rgb(var(--hairline)/.08);border-radius:24px;background:rgb(var(--surface)/.64);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .25s var(--ease-spring),box-shadow .25s,border-color .25s;margin-bottom:14px;
}
.updates-settings-card:hover { transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:rgb(var(--accent)/.2); }
.updates-settings-art { width:118px;min-height:168px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,rgb(var(--accent)/.18),rgb(var(--accent-strong)/.06)); }
.updates-settings-art::before { content:"";position:absolute;width:160px;height:160px;border-radius:50%;border:1px solid rgb(var(--accent)/.18); }
.updates-settings-avatar { width:62px;height:62px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgb(var(--accent)),rgb(var(--accent-strong)));color:#fff;box-shadow:0 14px 28px rgb(var(--accent-strong)/.28);z-index:2; }
.updates-settings-orb { position:absolute;border-radius:50%;background:rgb(var(--accent)/.18);filter:blur(2px); }
.orb-a{width:34px;height:34px;top:18px;inset-inline-start:12px}.orb-b{width:26px;height:26px;bottom:18px;inset-inline-end:12px}
.updates-settings-body { flex:1;min-width:0;padding:20px 18px 18px 0; }
.updates-settings-title-row { display:flex;justify-content:space-between;gap:10px;align-items:flex-start; }
.updates-live-pill { display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;color:rgb(var(--success));background:rgb(var(--success)/.09);padding:4px 8px;border-radius:999px; }
.updates-live-pill i { width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgb(var(--success)/.1); }
.updates-settings-title-row h3 { margin:8px 0 0;font-size:17px;font-weight:800; }
.updates-settings-body p { margin:8px 0 14px;font-size:12.5px;line-height:1.8;color:rgb(var(--ink-2)); }
.updates-settings-meta { display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:rgb(var(--ink-3)); }
.updates-settings-meta span:first-child { color:rgb(var(--accent));font-weight:700; }
.updates-settings-arrow { color:rgb(var(--ink-3));padding-top:4px; }

#updates-channel-overlay { position:fixed;inset:0;z-index:120; }
.updates-channel-backdrop { position:absolute;inset:0;background:rgb(0 0 0/.42);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .26s ease; }
#updates-channel-overlay.is-open .updates-channel-backdrop { opacity:1; }
.updates-channel-window {
  width:min(100%,760px);height:min(94dvh,900px);display:flex;flex-direction:column;overflow:hidden;
  border:1px solid rgb(var(--hairline)/.1);border-radius:28px;background:rgb(var(--bg));box-shadow:var(--shadow-xl);

function applyTheme() {
  const s = state.settings;
  const root = document.documentElement;
  const isDark = isDarkMode();
  const [accent, accentStrong] = ACCENTS[s.accent][isDark ? 'dark' : 'light'];
  root.classList.toggle('dark', isDark);
  root.classList.toggle('hc', s.highContrast);
  root.classList.toggle('no-motion', s.reducedMotion);
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-strong', accentStrong);
  document.body.style.backgroundColor = isDark ? '#000000' : '#f5f6fa';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isDark ? '#000000' : '#f5f6fa');
}
function isDarkMode() {
  const t = state.settings.theme;
  if (t === 'dark') return true;
  if (t === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches;
  return false;
}

/* ============================================================
   TOASTS
   ============================================================ */
function showToast(message, tone = 'success') {
  // Routine clicks/actions stay silent. Only real problems or warnings are surfaced.
  if (tone !== 'error' && tone !== 'warning') return;
  const item = { message, tone, id: uid('t') };
  if (state.toast) {
    state.toastQueue.push(item);
    if (state.toastQueue.length > 3) state.toastQueue.shift();
  } else {
    state.toast = item;
    state.toastTimer = setTimeout(() => {
      state.toast = state.toastQueue.shift() || null;
      if (state.toast) state.toastTimer = setTimeout(() => { state.toast = state.toastQueue.shift() || null; renderToast(); }, 2400);
      renderToast();
    }, 2600);
  }
  renderToast();
}
function renderToast() {
  const root = document.getElementById('nova-overlay-root');
  if (!root) return;
  let wrap = document.getElementById('toast-wrap');
  if (!state.toast && !state.toastQueue.length) { if (wrap) wrap.remove(); return; }
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toast-wrap';
    wrap.className = 'toast-wrap';
    wrap.setAttribute('aria-live', 'polite');
    root.appendChild(wrap);
  }
  const items = state.toast ? [state.toast, ...state.toastQueue] : state.toastQueue;
  wrap.innerHTML = items.map((t, i) => {
    const ic = t.tone === 'success' ? 'check' : t.tone === 'error' ? 'alert' : t.tone === 'warning' ? 'alert' : 'info';
    return `<div class="glass-strong toast" style="${i > 0 ? 'opacity:' + (1 - i * 0.2) + ';transform:scale(' + (1 - i * 0.04) + ')' : ''}">
      <span class="toast-icon ${t.tone}">${icon(ic, 15, 2.4)}</span>
      <span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(t.message)}</span>
    </div>`;
  }).join('');
}

function fireConfetti(count = 40) {
  const colors = ['#0a76fa','#e12873','#169646','#e16e00','#8c46dc','#00a0c0'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '9999px' : '2px';
    c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    c.style.animationDelay = (Math.random() * 0.3) + 's';
    document.getElementById('nova-overlay-root').appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

function bindAuthEvents() {
  const form = document.getElementById('auth-form');
  if (form) form.addEventListener('submit', onAuthSubmit);
  const pw = document.getElementById('reg-password');
  if (pw) pw.addEventListener('input', updatePwStrength);
}
function updatePwStrength() {
  const pw = document.getElementById('reg-password');
  const c = document.getElementById('pw-strength-container');
  if (!pw || !c) return;
  const v = pw.value;
  if (!v) { c.innerHTML = ''; return; }
  let strength = 0;
  if (v.length >= 8) strength++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) strength++;
  if (/\d/.test(v)) strength++;
  if (/[^a-zA-Z0-9]/.test(v)) strength++;
  const cls = strength <= 1 ? 'weak' : strength === 2 ? 'fair' : '';
  c.innerHTML = `<div class="pw-strength">${[0,1,2,3].map(i => `<div class="pw-strength-bar ${i < strength ? 'active ' + cls : ''}"></div>`).join('')}</div>`;
}
function onAuthSubmit(e) {
  e.preventDefault();
  const v = state.authView;
  if (v === 'login') submitLogin();
  else if (v === 'register') submitRegister();
  else if (v === 'forgot') submitForgot();
  else if (v === 'reset') submitReset();
}
function togglePw(id) {
  const inp = document.getElementById(id);
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';

async function submitLogin() {
  const email = (document.getElementById('login-email')?.value || '').trim();
  const password = (document.getElementById('login-password')?.value || '');
  const errors = {};
  if (!isEmail(email)) errors.email = 'یک ایمیل معتبر وارد کنید.';
  if (!password) errors.password = 'رمز عبور را وارد کنید.';
  state.authErrors = errors;
  state.authAlert = null;
  if (Object.keys(errors).length) { renderAuthForm(); return; }
  state.authSubmitState = 'loading';
  renderAuthForm();
  await wait(800);
  if (email.toLowerCase() !== DEMO_ACCOUNT.email) {
    state.authSubmitState = 'idle';
    state.authErrors = { email:'حسابی با این ایمیل پیدا نشد.' };
    renderAuthForm(); return;
  }
  if (password !== DEMO_ACCOUNT.password) {
    state.authSubmitState = 'idle';
    state.authErrors = { password:'رمز عبور نادرست است.' };
    renderAuthForm(); return;
  }
  state.authSubmitState = 'success';
  renderAuthForm();
  setTimeout(() => { state.authed = true; saveAuth(); renderApp(); fireConfetti(30); }, 600);
}
async function submitRegister() {
  const name = document.getElementById('reg-name')?.value.trim() || '';
  const email = document.getElementById('reg-email')?.value.trim() || '';
  const password = document.getElementById('reg-password')?.value || '';
  const errors = {};
  if (name.length < 2) errors.name = 'نام خود را وارد کنید.';
  if (!isEmail(email)) errors.email = 'یک ایمیل معتبر وارد کنید.';
  if (password.length < 8) errors.password = 'رمز باید حداقل ۸ کاراکتر باشد.';
  state.authErrors = errors;
  if (Object.keys(errors).length) { renderAuthForm(); return; }
  state.authSubmitState = 'loading';
  renderAuthForm();
  await wait(1000);
  state.authSubmitState = 'success';
  renderAuthForm();
  setTimeout(() => { state.authed = true; saveAuth(); renderApp(); showToast('حساب شما ساخته شد'); fireConfetti(50); }, 700);
}
async function submitForgot() {
  const email = document.getElementById('forgot-email')?.value.trim() || '';
  if (!isEmail(email)) { state.authErrors = { email:'ایمیل معتبر وارد کنید.' }; renderAuthForm(); return; }
  state.authSubmitState = 'loading';
  renderAuthForm();
  await wait(800);
  state.authEmail = email;
  state.authSubmitState = 'idle';
  state.authView = 'reset';
  showToast(`کد نمایشی: ${toPersianDigits(DEMO_RESET_CODE)}`, 'info');

async function submitReset() {
  const code = document.getElementById('reset-code')?.value || '';
  const password = document.getElementById('reset-password')?.value || '';
  const confirm = document.getElementById('reset-confirm')?.value || '';
  const errors = {};
  if (!/^\d{6}$/.test(fromPersianDigits(code))) errors.code = 'کد ۶ رقمی را وارد کنید.';
  if (password.length < 8) errors.password = 'رمز باید حداقل ۸ کاراکتر باشد.';
  if (confirm !== password) errors.confirm = 'تکرار رمز یکسان نیست.';
  state.authErrors = errors;
  if (Object.keys(errors).length) { renderAuthForm(); return; }
  state.authSubmitState = 'loading';
  renderAuthForm();
  await wait(800);
  if (fromPersianDigits(code) !== DEMO_RESET_CODE) {
    state.authSubmitState = 'idle';
    state.authErrors = { code:'کد نادرست است.' };
    renderAuthForm(); return;
  }
  state.authSubmitState = 'success';
  renderAuthForm();
  setTimeout(() => { showToast('رمز تغییر کرد. دوباره وارد شوید'); goAuth('login', state.authEmail); }, 800);
}

/* ============================================================
   MARKDOWN — با پشتیبانی جدول، چک‌لیست، نقل‌قول، کد
   ============================================================ */
function renderMarkdown(src) {
  if (!src) return '';
  const blocks = [];
  let text = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push({ lang: lang || 'text', code });
    return `\u0000CODE${blocks.length-1}\u0000`;
  });
  text = escapeHtml(text);
  // Headings
  text = text.replace(/^#{4}\s+(.*)$/gm, '<h4>$1</h4>');
  text = text.replace(/^#{3}\s+(.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^#{2}\s+(.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
  // Bold / italic
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // HR
  text = text.replace(/^---+$/gm, '<hr/>');
  // Task list FIRST (before regular list)
  text = text.replace(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/gm, (_, checked, label) => {
    const isChecked = checked !== ' ';
    return `<div class="task-item"><span class="task-check ${isChecked ? 'checked' : ''}">${isChecked ? icon('check',10,3) : ''}</span><span>${label}</span></div>`;
  });
  // Regular bullets
  text = text.replace(/^\s*[-*]\s+(.*)$/gm, '<li><span class="bullet"></span><span>$1</span></li>');
  // Numbered lists
  text = text.replace(/^\s*\d+\.\s+(.*)$/gm, '<li><span class="num">•</span><span>$1</span></li>');
  // Wrap lists
  text = text.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  // Blockquote
  text = text.replace(/^&gt;\s?(.*)$/gm, '<blockquote>$1</blockquote>');
  // Tables
  text = text.replace(/(?:^\|.*\|\s*$\n?)+/gm, (table) => {
    const rows = table.trim().split('\n').map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    const clean = rows.filter(r => !r.every(c => /^:?-{2,}:?$/.test(c)));
    if (!clean.length) return table;
    const head = clean[0], body = clean.slice(1);
    return `<div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  });
  // Paragraphs
  text = text.split('\n\n').map(p => {
    if (/^<(h[1-4]|ul|blockquote|div class="table-wrap"|hr|div class="task-item")/.test(p) || p.startsWith('\u0000CODE')) return p;
    return `<p>${p.replace(/\n/g, '<br/>')}</p>`;
  }).join('');
  // Restore code blocks
  text = text.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => renderCodeBlock(blocks[Number(i)]));
  return text;
}
function renderCodeBlock({ lang, code }) {
  const lines = code.split('\n');
  const highlighted = lines.map((line, i) => {
    const tokens = highlightLine(line, lang);
    return `<div class="line"><span class="ln">${i+1}</span><span class="src">${tokens.map(t => `<span class="tok-${t.type}">${escapeHtml(t.text)}</span>`).join('')}</span></div>`;
  }).join('');
  return `<div class="code-block">
    <div class="code-block-head">
      <span class="code-block-lang">${lang}</span>
      <button class="code-block-btn" onclick="copyText(decodeURIComponent('${encodeURIComponent(code)}'))">${icon('copy',12)} کپی</button>
      <button class="code-block-btn" onclick="insertIntoStudio(decodeURIComponent('${encodeURIComponent(code)}'),'${lang}')">${icon('terminal',12)} استودیو</button>
    </div>
    <pre><code>${highlighted}</code></pre>
  </div>`;
}
function highlightLine(line, lang) {
  const KEYWORDS = ['const','let','var','function','return','if','else','for','while','import','from','export','default','async','await','new','class','extends','interface','type','def','in','of','true','false','null','undefined','try','catch','throw','as','None','True','False','self','lambda','yield','public','private','protected','static','final','void'];
  const HASH = ['py','python','bash','sh','yaml','yml'].includes(lang);
  const comment = HASH ? '#.*$' : '\\/\\/.*$|\\/\\*[\\s\\S]*?\\*\\/';
  const STRING = `"(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'|\`(?:\\\\.|[^\\\\\`])*\``;
  const regex = new RegExp(`(${comment})|(${STRING})|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b(?:${KEYWORDS.join('|')})\\b)|(\\b[A-Za-z_$][\\w$]*(?=\\s*\\())`, 'g');
  const tokens = [];
  let last = 0, m;
  while ((m = regex.exec(line)) !== null) {
    if (m.index > last) tokens.push({ text: line.slice(last, m.index), type: 'plain' });
    tokens.push({ text: m[0], type: m[1] ? 'comment' : m[2] ? 'string' : m[3] ? 'number' : m[4] ? 'keyword' : 'fn' });
    last = m.index + m[0].length;
  }
  if (last < line.length) tokens.push({ text: line.slice(last), type:'plain' });
  return tokens;
}

function getFileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'image';
  if (['mp4','mov','avi','webm'].includes(ext)) return 'video';
  if (['mp3','wav','ogg'].includes(ext)) return 'volume';
  if (['zip','rar','7z','tar','gz'].includes(ext)) return 'package';
  if (['pdf'].includes(ext)) return 'file-text';
  if (['doc','docx','txt','md','rtf'].includes(ext)) return 'file-text';

  if (['js','ts','jsx','tsx','py','html','css','json','sql'].includes(ext)) return 'code';
  return 'file-text';
}
function getFileTint(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'pink';
  if (['mp4','mov','avi','webm'].includes(ext)) return 'violet';
  if (['mp3','wav','ogg'].includes(ext)) return 'teal';
  if (['zip','rar','7z','tar','gz'].includes(ext)) return 'orange';
  if (['pdf'].includes(ext)) return 'red';
  if (['doc','docx','txt','md','rtf'].includes(ext)) return 'blue';
  if (['xls','xlsx','csv'].includes(ext)) return 'green';
  if (['ppt','pptx'].includes(ext)) return 'orange';
  if (['js','ts','jsx','tsx','py','html','css','json','sql'].includes(ext)) return 'indigo';
  return 'gray';
}
function truncateMiddle(str, max) {
  if (str.length <= max) return str;
  const half = Math.floor((max - 3) / 2);
  return str.slice(0, half) + '...' + str.slice(-half);
}
