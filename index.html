<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طرح اولیه اپلیکیشن</title>
    <!-- اضافه کردن فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* تنظیمات کلی */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 0;
            color: #333;
            min-height: 100vh;
        }

        /* شبیه‌سازی صفحه موبایل */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* ۱. هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-right, .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: transparent;
            font-size: 17px;
        }

        /* دکمه منو همبرگری */
        .menu-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #555;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 0 9px;
        }

        .menu-line {
            height: 2px;
            background-color: #555;
            border-radius: 10px;
        }

        .menu-line.top { width: 100%; }
        .menu-line.bottom { width: 50%; }

        /* دکمه ورود / ثبت نام */
        .login-btn {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #555;
            padding: 7px 15px;
            border-radius: 22px;
            background: transparent;
            cursor: pointer;
            color: #333;
        }

        /* ۲. منوی دسته‌بندی (چهار باکس کوچک داخل باکس عریض) */
        .categories-wrapper {
            border: 1px solid #555;
            border-radius: 22px;
            padding: 5px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            width: 100%; /* پر کردن عرض کامل */
        }

        .category-pill {
            font-size: 11px; /* کوچک‌تر تا در باکس جا شود */
            cursor: pointer;
            padding: 4px 8px;
            border: 1px solid #aaa;
            border-radius: 16px;
            color: #555;
            white-space: nowrap;
            background-color: transparent;
            flex: 1; /* تقسیم مساوی عرض بین چهار باکس */
            text-align: center; /* وسط‌چین کردن متن */
            min-width: 0; /* جلوگیری از سرریز */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-pill.active {
            font-weight: bold;
            color: #000;
            border-color: #333;
            background-color: #f0f0f0;
        }

        /* ۳. بنر اصلی */
        .banner {
            border: 2px solid #555;
            border-radius: 25px;
            padding: 15px;
            height: 170px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .banner-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner-title {
            border: 1px solid #555;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .banner-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .banner-text {
            border: 1px solid #555;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .banner-shapes {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .shape-rect {
            width: 32px;
            height: 9px;
            border: 1px solid #555;
            border-radius: 10px;
        }
        
        .shape-square {
            width: 27px;
            height: 27px;
            border: 1px solid #555;
            border-radius: 10px;
        }

        /* ۴. ردیف دایره‌ها */
        .circles-row {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        .circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .circle {
            width: 48px;
            height: 48px;
            border: 1px solid #555;
            border-radius: 50%;
        }

        .circle-line {
            width: 38px;
            height: 5px;
            border: 1px solid #555;
            border-radius: 10px;
        }

        /* ۵. بخش متنی */
        .text-section {
            text-align: center;
            padding: 10px 0;
        }

        .text-section h3 {
            font-size: 15px;
            margin-bottom: 6px;
            font-weight: normal;
        }

        .text-section p {
            font-size: 13px;
            color: #666;
        }

        /* ۶. کارت‌های پایین */
        .bottom-cards {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .card {
            flex: 1;
            aspect-ratio: 1 / 1;
            border: 2px solid #555;
            border-radius: 25px;
        }

        /* فوتر */
        .footer-text {
            text-align: center;
            font-size: 13px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            color: #555;
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- ۱. هدر -->
        <header class="header">
            <div class="header-right">
                <button class="menu-btn">
                    <span class="menu-line top"></span>
                    <span class="menu-line bottom"></span>
                </button>
                <button class="login-btn">ورود / ثبت نام</button>
            </div>
            <div class="header-left">
                <button class="icon-btn">🔍</button>
            </div>
        </header>

        <!-- ۲. منوی دسته‌بندی (چهار باکس جدید) -->
        <nav class="categories-wrapper">
            <span class="category-pill active">فروشگاه</span>
            <span class="category-pill">هوش مصنوعی</span>
            <span class="category-pill">خرید</span>
            <span class="category-pill">امور مالی</span>
        </nav>

        <!-- ۳. بنر اصلی -->
        <section class="banner">
            <div class="banner-top">
                <span class="banner-title">محصولات</span>
                <button class="icon-btn" style="width: 27px; height: 27px; font-size: 13px;">✕</button>
            </div>
            <div class="banner-bottom">
                <span class="banner-text">اشتراک و نمایش</span>
                <div class="banner-shapes">
                    <div class="shape-rect"></div>
                    <div class="shape-square"></div>
                </div>
            </div>
        </section>

        <!-- ۴. ردیف دایره‌ها -->
        <section class="circles-row">
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
        </section>

        <!-- ۵. بخش متنی -->
        <section class="text-section">
            <h3>ربات‌های اشاره‌شده</h3>
            <p>پایین ربات‌هایی که شما اشاره کرده‌اید</p>
        </section>

        <!-- ۶. کارت‌های پایین -->
        <section class="bottom-cards">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </section>

        <!-- فوتر -->
        <footer class="footer-text">
            ما هورپی اسپرت و شکوه را...
        </footer>

    </div>

</body>
</html>
