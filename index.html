<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<title>Nova AI Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ============================================================
   HARD RESET
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}
*::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; background: transparent !important; }
html, body, #root, #nova-overlay-root { overflow-x: hidden !important; }
body { overflow: hidden !important; }

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: 245 246 250;
  --bg-2: 240 242 248;
  --surface: 255 255 255;
  --surface-2: 250 251 253;
  --fill: 118 118 128;
  --ink: 17 19 24;
  --ink-2: 88 93 106;
  --ink-3: 138 143 155;
  --ink-4: 176 180 190;
  --accent: 10 118 250;
  --accent-strong: 0 100 235;
  --accent-soft: 235 244 255;
  --danger: 225 45 40;
  --warning: 240 160 0;
  --success: 48 186 90;
  --glass: 255 255 255;
  --glass-a: 0.75;
  --glass-strong-a: 0.9;
  --glass-float-a: 0.85;
  --hairline: 0 0 0;
  --hairline-a: 0.06;
  --highlight: rgba(255,255,255,0.75);
  --shadow-xs: 0 1px 2px rgba(16,24,40,0.03);
  --shadow-sm: 0 1px 3px rgba(16,24,40,0.04), 0 4px 12px -6px rgba(16,24,40,0.08);
  --shadow-md: 0 2px 6px rgba(16,24,40,0.04), 0 12px 32px -12px rgba(16,24,40,0.12);
  --shadow-lg: 0 4px 12px rgba(16,24,40,0.05), 0 24px 56px -16px rgba(16,24,40,0.16);
  --shadow-xl: 0 8px 24px rgba(16,24,40,0.06), 0 40px 80px -24px rgba(16,24,40,0.2);
  --code-bg: 247 248 251;
  --tok-plain: 36 41 51;
  --tok-keyword: 150 60 205;
  --tok-string: 22 124 52;
  --tok-number: 180 82 0;
  --tok-comment: 128 134 146;
  --tok-fn: 0 100 212;
  --blur: 24px;
  --blur-strong: 30px;
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 26px;
  --r-2xl: 32px;
  --r-pill: 9999px;
  --r-bubble: 20px;
  --dur-fast: 0.14s;
  --dur: 0.22s;
  --dur-slow: 0.35s;
  --ease-ios: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --sidebar-w: 300px;
  --sidebar-rail-w: 72px;
}
.dark {
  --bg: 0 0 0;
  --bg-2: 6 6 8;
  --surface: 17 18 21;
  --surface-2: 24 25 29;
  --fill: 150 150 160;
  --ink: 244 245 249;
  --ink-2: 162 166 178;
  --ink-3: 112 116 128;
  --ink-4: 84 88 100;
  --accent: 90 166 255;
  --accent-strong: 10 110 232;
  --accent-soft: 20 40 80;
  --danger: 255 80 72;
  --warning: 255 180 80;
  --success: 52 199 89;
  --glass: 10 10 12;
  --glass-a: 0.72;
  --glass-strong-a: 0.88;
  --glass-float-a: 0.82;
  --hairline: 255 255 255;
  --hairline-a: 0.08;
  --highlight: rgba(255,255,255,0.06);
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 4px 12px -6px rgba(0,0,0,0.5);
  --shadow-md: 0 2px 6px rgba(0,0,0,0.3), 0 12px 32px -12px rgba(0,0,0,0.6);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.3), 0 24px 56px -16px rgba(0,0,0,0.7);
  --shadow-xl: 0 8px 24px rgba(0,0,0,0.4), 0 40px 80px -24px rgba(0,0,0,0.8);
  --code-bg: 18 19 24;
  --tok-plain: 222 226 234;
  --tok-keyword: 205 150 255;
  --tok-string: 140 216 150;
  --tok-number: 255 180 110;
  --tok-comment: 112 118 132;
  --tok-fn: 116 184 255;
}
.hc { --glass-a: 0.95 !important; --glass-strong-a: 0.98 !important; --glass-float-a: 0.96 !important; --hairline-a: 0.14; }
.dark.hc { --hairline-a: 0.2; }
.no-motion *, .no-motion *::before, .no-motion *::after { animation: none !important; transition-duration: 0.01ms !important; }

/* ============================================================
   BASE
   ============================================================ */
html, body, #root { height: 100%; }
html, body {
  margin: 0;
  overscroll-behavior: none;
  font-family: 'Inter', 'Vazirmatn', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
  color: rgb(var(--ink));
  background-color: rgb(var(--bg));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid rgb(var(--accent) / 0.5); outline-offset: 2px; border-radius: 6px; }
::selection { background: rgb(var(--accent) / 0.25); color: rgb(var(--ink)); }

/* ============================================================
   GLASS
   ============================================================ */
.glass {
  background-color: rgb(var(--glass) / var(--glass-a));
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  border: 1px solid rgb(var(--hairline) / var(--hairline-a));
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-sm);
}
.glass-float {
  background-color: rgb(var(--glass) / var(--glass-float-a));
  -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(190%);
  backdrop-filter: blur(var(--blur-strong)) saturate(190%);
  border: 1px solid rgb(var(--hairline) / var(--hairline-a));
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-md);
}
.glass-strong {
  background-color: rgb(var(--glass) / var(--glass-strong-a));
  -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
  backdrop-filter: blur(var(--blur-strong)) saturate(200%);
  border: 1px solid rgb(var(--hairline) / var(--hairline-a));
  box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-lg);
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes scale-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes slide-down { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes drawer-in { from { transform: translateX(105%); } to { transform: translateX(0); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-20px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes caret-blink { to { visibility: hidden; } }
@keyframes dot-bounce { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-3px); opacity: 1; } }
@keyframes shimmer { to { transform: translateX(100%); } }
@keyframes text-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes confetti-fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
@keyframes pulse-soft { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
@keyframes wave { 0%, 100% { height: 6px; } 50% { height: 20px; } }
@keyframes ctx-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
@keyframes arix-menu-in { from { opacity: 0; transform: translateY(9px) scale(0.965); } to { opacity: 1; transform: translateY(0) scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   APP SHELL
   ============================================================ */
#root { display: flex; flex-direction: column; height: 100dvh; }
.app-canvas {
  position: relative; display: flex; height: 100dvh; width: 100%; overflow: hidden;
  color: rgb(var(--ink));
  background-color: #000000;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar-wrap {
  position: relative; z-index: 40; flex-shrink: 0;
  padding: 10px 0 10px 10px;
  transition: width 0.35s var(--ease-ios);
  overflow: hidden;
}
.sidebar {
  height: 100%; width: 100%;
  border-radius: var(--r-2xl);
  display: flex; flex-direction: column; overflow: hidden;
  position: relative;
}
.sidebar-head {
  display: flex; align-items: center; gap: 10px;
  height: 64px; padding: 0 10px 0 14px; flex-shrink: 0;
  border-bottom: 1px solid rgb(var(--hairline) / 0.04);
}
.brand-mark {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 16px -8px rgb(var(--accent-strong) / 0.7);
  position: relative;
}
.sidebar-brand-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sidebar-brand {
  font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
  color: rgb(var(--ink));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.2;
}
.sidebar-status { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: rgb(var(--success)); line-height: 1; }
.sidebar-status-dot {
  width: 6px; height: 6px; border-radius: var(--r-pill);
  background: rgb(var(--success));
  box-shadow: 0 0 0 3px rgb(var(--success) / 0.15);
  flex-shrink: 0;
  animation: pulse-soft 2s ease-in-out infinite;
}
.sidebar-collapse {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--r-md);
  color: rgb(var(--ink-3));
  transition: background-color var(--dur-fast), color var(--dur-fast);
  flex-shrink: 0;
}
.sidebar-collapse:hover { background-color: rgb(var(--fill) / 0.1); color: rgb(var(--ink)); }
.sidebar-collapse:active { transform: scale(0.92); }
.sidebar-quick { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.sidebar-action {
  display: flex; align-items: center; gap: 10px;
  height: 44px; padding: 0 10px;
  border-radius: var(--r-md);
  text-align: start; font-size: 13.5px; font-weight: 500;
  color: rgb(var(--ink)); width: 100%;
  transition: background-color var(--dur-fast), transform var(--dur-fast);
  position: relative;
}
.sidebar-action:hover { background-color: rgb(var(--fill) / 0.07); }
.sidebar-action:active { transform: scale(0.98); }
.sidebar-action-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--r-md);
  flex-shrink: 0; color: rgb(var(--ink-2));
}
.sidebar-action.primary {
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 20px -10px rgb(var(--accent-strong) / 0.7);
}
.sidebar-action.primary .sidebar-action-icon { color: #fff; background: rgba(255,255,255,0.18); }
.sidebar-action-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-action-hint { display: flex; gap: 2px; color: rgb(var(--ink-3)); opacity: 0; transition: opacity var(--dur-fast); }
.sidebar-action:hover .sidebar-action-hint { opacity: 1; }
.sidebar-action-hint .kbd-mini {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px;
  background: rgb(var(--fill) / 0.1);
  font-size: 9.5px; font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}
.sidebar-tabs-wrap { padding: 0 10px 8px; flex-shrink: 0; }
.sidebar-tabs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 4px; border-radius: var(--r-md);
  background: rgb(var(--fill) / 0.09); gap: 2px;
}
.sidebar-tab {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  height: 30px; border-radius: calc(var(--r-md) - 4px);
  font-size: 12px; font-weight: 600; color: rgb(var(--ink-2));
  transition: color var(--dur), background-color var(--dur), box-shadow var(--dur);
  cursor: pointer; position: relative;
}
.sidebar-tab:hover { color: rgb(var(--ink)); }
.sidebar-tab.active { background: rgb(var(--surface)); color: rgb(var(--ink)); box-shadow: var(--shadow-xs); }
.sidebar-tab-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: var(--r-pill);
  background: rgb(var(--fill) / 0.15);
  font-size: 9.5px; font-weight: 700; color: rgb(var(--ink-3));
  font-variant-numeric: tabular-nums;
}
.sidebar-nav {
  flex: 1; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  padding: 0 8px 8px;
}
.sidebar-section { padding-top: 8px; }
.sidebar-section-label {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px 4px;
  font-size: 10.5px; font-weight: 700; color: rgb(var(--ink-3));
  text-transform: uppercase; letter-spacing: 0.08em;
  user-select: none;
}
.sidebar-section-count { margin-inline-start: auto; font-size: 9.5px; font-weight: 600; color: rgb(var(--ink-3)); opacity: 0.7; }

.conv-item {
  position: relative;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  width: calc(100% - 12px);
  margin: 4px 6px;
  padding: 8px 10px;
  border-radius: 20px;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.018);
  text-align: start;
  cursor: pointer;
  transition: transform 0.2s var(--ease-spring), background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.conv-item:hover {
  transform: translateX(-2px);
  background: rgba(255,255,255,0.035);
  border-color: rgba(255,255,255,0.055);
}
.conv-item.active {
  background: linear-gradient(135deg, rgb(var(--accent) / 0.12), rgba(255,255,255,0.025));
  border-color: rgb(var(--accent) / 0.16);
  box-shadow: 0 10px 26px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
}
.conv-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 42px; height: 42px; border-radius: 15px;
  flex-shrink: 0;
}
.conv-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.conv-title {
  font-size: 11.5px; font-weight: 750; color: rgb(var(--ink));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.35;
}
.conv-item.active .conv-title { color: rgb(var(--accent)); }
.conv-preview {
  font-size: 9.5px; color: rgb(var(--ink-3));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.5;
}
.conv-meta { display: flex; align-items: center; gap: 3px; }
.conv-time {
  font-size: 8px; font-variant-numeric: tabular-nums;
  color: rgb(var(--ink-3)); white-space: nowrap;
}
.conv-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: var(--r-pill);
  color: rgb(var(--ink-3));
}
.conv-badge.pin { color: rgb(var(--accent)); }
.conv-badge.star { color: rgb(240,160,0); }
.conv-more {
  position: absolute;
  inset-inline-end: 6px;
  bottom: 7px;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  color: rgb(var(--ink-3));
  background: rgba(255,255,255,0.035);
  opacity: 0;
  transform: scale(0.88);
  transition: opacity 0.2s, transform 0.2s, background 0.2s;
  z-index: 2;
}
@media (min-width: 768px) {
  .conv-more { opacity: 0; }
  .conv-item:hover .conv-more, .conv-more.active { opacity: 1; transform: scale(1); }
}
@media (max-width: 767px) {
  .conv-more { opacity: 1; transform: scale(1); }
}
.conv-more:hover { background: rgb(var(--fill) / 0.1); color: rgb(var(--ink)); }
.conv-more.active { background: rgb(var(--accent) / 0.15); color: rgb(var(--accent)); }

.sidebar-foot { flex-shrink: 0; border-top: 1px solid rgb(var(--hairline) / 0.05); padding: 8px; }
.user-card {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 8px 10px;
  border-radius: var(--r-md);
  text-align: start;
  transition: background-color var(--dur-fast);
}
.user-card:hover { background-color: rgb(var(--fill) / 0.07); }
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-weight: 700; flex-shrink: 0;
  position: relative;
}
.avatar-online {
  position: absolute; bottom: -1px; inset-inline-end: -1px;
  width: 11px; height: 11px; border-radius: var(--r-pill);
  background: rgb(var(--success));
  border: 2px solid rgb(var(--surface));
}
.user-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.user-name {
  font-size: 13px; font-weight: 600; color: rgb(var(--ink));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.user-meta { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: rgb(var(--ink-3)); line-height: 1; }
.plan-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 6px; border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-size: 9px; font-weight: 800;
}

.sidebar-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 48px 24px; text-align: center; color: rgb(var(--ink-3));
}
.sidebar-empty-icon {
  display: flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; border-radius: var(--r-pill);
  background: rgb(var(--fill) / 0.08); color: rgb(var(--ink-3));
  margin-bottom: 4px;
}
.sidebar-empty-title { font-size: 13px; font-weight: 600; color: rgb(var(--ink-2)); margin: 0; }
.sidebar-empty-desc { font-size: 11.5px; line-height: 1.6; margin: 0; max-width: 200px; }
.sidebar-empty-cta {
  margin-top: 8px;
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: var(--r-pill);
  background: rgb(var(--accent) / 0.1); color: rgb(var(--accent));
  font-size: 12px; font-weight: 600;
}

/* Mini Rail */
.mini-rail {
  height: 100%; width: 100%;
  border-radius: var(--r-2xl);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 4px;
}
.rail-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: var(--r-md);
  color: rgb(var(--ink-2));
  transition: background-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
}
.rail-btn:hover { background-color: rgb(var(--fill) / 0.1); color: rgb(var(--ink)); }
.rail-btn:active { transform: scale(0.94); }
.rail-btn.active { background-color: rgb(var(--accent) / 0.12); color: rgb(var(--accent)); }
.rail-btn.primary {
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 6px 16px -8px rgb(var(--accent-strong) / 0.7);
}
.rail-divider { width: 24px; height: 1px; background: rgb(var(--hairline) / 0.1); margin: 6px 0; }
.rail-spacer { flex: 1; }
.rail-avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%);
  color: #fff; font-weight: 700;
  position: relative;
}

/* ============================================================
   MAIN COLUMN
   ============================================================ */
.main-col { position: relative; min-width: 0; flex: 1; display: flex; flex-direction: column; }

/* Header */
.header-wrap {
  position: absolute; top: 0; left: 0; right: 0; z-index: 30;
  pointer-events: none;
  padding: max(env(safe-area-inset-top), 10px) 12px 8px;
}
@media (min-width: 640px) { .header-wrap { padding: max(env(safe-area-inset-top), 12px) 16px 10px; } }
@media (min-width: 1024px) { .header-wrap { padding: max(env(safe-area-inset-top), 14px) 20px 12px; } }
.header-inner {
  margin: 0 auto; max-width: 1080px;
  display: flex; align-items: center; gap: 10px;
  pointer-events: auto;
}
.header-title-box {
  flex: 1; min-width: 0; height: 54px;
  border-radius: var(--r-pill);

}

.chat-title-btn {

  display: flex; align-items: center; gap: 6px;
}
.chat-title-text {

}

}
.header-duo-pill {

.header-round-btn {

}
.header-round-btn:hover { background: rgb(var(--fill) / 0.09); color: rgb(var(--ink)); transform: translateY(-1px); }
.header-round-btn:active { transform: scale(0.94); }
.header-single-pill {
  width: 54px; height: 54px;

  display: flex; align-items: center; justify-content: center;

  border: 1px solid var(--nova-line, rgba(255,255,255,0.075));

  box-shadow: 0 10px 30px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);

}
.header-single-pill:hover { background: rgba(30,30,34,0.96); color: rgb(var(--ink)); transform: translateY(-1px); }
.header-single-pill:active { transform: scale(0.94); }

/* Chat Area */
.chat-scroll {
  height: 100%; overflow-y: auto;
  overscroll-behavior: contain;
  padding-bottom: 240px;
}
.chat-inner {
  margin: 0 auto; width: 100%; max-width: 760px;
  padding: 8px 16px 0;
}
@media (min-width: 640px) { .chat-inner { padding-left: 24px; padding-right: 24px; } }
@media (min-width: 1024px) { .chat-scroll { padding-bottom: 200px; } }

.bubble { border-radius: var(--r-bubble); padding: 11px 16px; font-size: 15px; line-height: 1.75; }
.bubble-user {
  background: linear-gradient(135deg, rgb(var(--accent) / 0.96) 0%, rgb(var(--accent-strong) / 0.9) 100%);
  color: #fff;
  border-end-end-radius: 6px;
  max-width: min(72%, 430px);
  width: fit-content;
  margin-inline-start: auto;
  padding: 8px 12px 6px;
  border-radius: 17px 17px 6px 17px;
}
.bubble-user .bubble-content {
  white-space: pre-wrap;
  font-size: 12.5px;
  line-height: 1.65;
  margin: 0;
}
.user-message-meta {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 4px; margin-top: 3px;
  font-size: 8.5px;
  line-height: 1;
  color: rgba(255,255,255,0.62);
  direction: ltr;
}
.user-message-check { font-size: 9px; letter-spacing: -2px; opacity: 0.85; }
.assistant-row { display: flex; justify-content: flex-start; gap: 10px; }
.assistant-body { flex: 1; min-width: 0; }
.user-row { display: flex; flex-direction: column; align-items: flex-end; width: 100%; }
.user-actions {
  display: flex; align-items: center; gap: 3px; margin-top: 1px;
  height: 24px;
  opacity: 0; transition: opacity var(--dur);
}
.user-row:hover .user-actions { opacity: 1; }
@media (hover: none) { .user-actions { opacity: 1; } }
.message-mini-action {
  width: 24px; height: 24px; border-radius: 9px;
  border: 1px solid rgb(var(--hairline) / 0.06);
  background: rgb(var(--surface) / 0.55);
  color: rgb(var(--ink-3));
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.18s var(--ease-spring), background 0.18s, color 0.18s;
}
.message-mini-action:hover {
  background: rgb(var(--surface-2));
  color: rgb(var(--ink));
  transform: translateY(-1px);
}

.assistant-actions-pro {
  display: grid;
  grid-template-columns: 40px minmax(108px, 1fr) auto;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  width: min(100%, 310px);
  opacity: 0.86;
  transition: opacity 0.2s ease;
}
.assistant-row:hover .assistant-actions-pro,
.assistant-actions-pro.always-visible { opacity: 1; }
@media (hover: none) { .assistant-actions-pro { opacity: 1; } }
.assistant-action-single,
.assistant-action-wide,
.assistant-action-group {
  height: 36px;
  display: flex; align-items: center;
  border-radius: 15px;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.075);
}
.assistant-action-single { width: 40px; justify-content: center; }
.assistant-action-wide { min-width: 0; padding: 3px 5px; justify-content: center; gap: 2px; }
.assistant-action-group { padding: 3px; gap: 2px; }
.assistant-action-btn {
  width: 30px; height: 30px;
  border: 0; border-radius: 10px;
  background: transparent;
  color: rgb(var(--ink-3));
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s var(--ease-spring), background 0.18s, color 0.18s;
  cursor: pointer;
}
.assistant-action-btn:hover { background: rgb(var(--fill) / 0.08); color: rgb(var(--ink)); transform: translateY(-1px) scale(1.03); }
.assistant-action-btn:active { transform: scale(0.9); }
.assistant-action-divider { width: 1px; height: 17px; background: rgb(var(--hairline) / 0.12); }

/* Markdown */
.md-content { line-height: 1.75; }
.md-content p { margin: 0; }
.md-content p + p { margin-top: 8px; }
.md-content h1, .md-content h2, .md-content h3, .md-content h4 { font-weight: 700; margin: 14px 0 6px; letter-spacing: -0.01em; line-height: 1.3; }
.md-content h1:first-child, .md-content h2:first-child, .md-content h3:first-child, .md-content h4:first-child { margin-top: 0; }
.md-content h1 { font-size: 1.28em; }
.md-content h2 { font-size: 1.14em; }
.md-content h3 { font-size: 1.04em; }
.md-content h4 { font-size: 1em; }
.md-content ul, .md-content ol { margin: 6px 0; padding: 0; list-style: none; }
.md-content li { display: flex; gap: 10px; margin-bottom: 6px; }
.md-content li:last-child { margin-bottom: 0; }
.md-content li .bullet { width: 5px; height: 5px; border-radius: var(--r-pill); background: rgb(var(--accent)); margin-top: 0.7em; flex-shrink: 0; }
.md-content li .num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 1.4em; height: 1.4em; border-radius: var(--r-pill);
  background: rgb(var(--accent) / 0.1); color: rgb(var(--accent));
  font-size: 0.75em; font-weight: 600;
  margin-top: 0.2em; flex-shrink: 0;
}
.md-content blockquote {
  position: relative; border-radius: var(--r-md);
  background: rgb(var(--fill) / 0.07);
  padding: 10px 20px 10px 12px; color: rgb(var(--ink-2)); margin: 8px 0;
}
.md-content blockquote::before {
  content: ''; position: absolute;
  top: 10px; bottom: 10px; inset-inline-start: 8px;
  width: 3px; border-radius: var(--r-pill);
  background: rgb(var(--accent) / 0.6);
}
.md-content code {
  border-radius: var(--r-sm);
  background: rgb(var(--fill) / 0.12);
  padding: 2px 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.84em;
}
.md-content strong { font-weight: 600; }
.md-content em { font-style: italic; color: rgb(var(--ink-2)); }
.md-content a { color: rgb(var(--accent)); text-decoration: underline; text-underline-offset: 2px; }
.md-content hr { border: 0; border-top: 1px solid rgb(var(--hairline) / 0.1); margin: 12px 0; }
.md-content table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
.md-content table th { background: rgb(var(--fill) / 0.06); padding: 10px 14px; text-align: start; font-weight: 600; }
.md-content table td { padding: 10px 14px; color: rgb(var(--ink-2)); border-top: 1px solid rgb(var(--hairline) / 0.07); }
.md-content .table-wrap { border-radius: var(--r-lg); border: 1px solid rgb(var(--hairline) / 0.08); background: rgb(var(--surface) / 0.5); overflow-x: auto; margin: 8px 0; }
.md-content .task-item { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 4px; }
.md-content .task-check {
  width: 16px; height: 16px; border-radius: 5px;
  border: 1.5px solid rgb(var(--hairline) / 0.2);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 4px;
  background: rgb(var(--surface) / 0.7);
}
.md-content .task-check.checked { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: #fff; }

.code-block { border-radius: var(--r-lg); overflow: hidden; margin: 8px 0; direction: ltr; text-align: left; background: rgb(var(--code-bg) / 0.82); border: 1px solid rgb(var(--hairline) / var(--hairline-a)); }
.code-block-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 4px; }
.code-block-lang { margin-inline-end: auto; border-radius: var(--r-pill); background: rgb(var(--fill) / 0.1); padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; text-transform: lowercase; color: rgb(var(--ink-2)); }
.code-block-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 500; color: rgb(var(--ink-2)); transition: color var(--dur), background-color var(--dur); }
.code-block-btn:hover { color: rgb(var(--ink)); background: rgb(var(--fill) / 0.08); }
.code-block pre { margin: 0; padding: 6px 16px 16px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.75; }
.code-block .line { display: flex; }
.code-block .ln { width: 20px; margin-right: 16px; text-align: right; color: rgb(var(--tok-comment) / 0.6); user-select: none; flex-shrink: 0; }
.code-block .src { white-space: pre; }
.tok-plain { color: rgb(var(--tok-plain)); }
.tok-keyword { color: rgb(var(--tok-keyword)); }
.tok-string { color: rgb(var(--tok-string)); }
.tok-number { color: rgb(var(--tok-number)); }
.tok-comment { color: rgb(var(--tok-comment)); font-style: italic; }
.tok-fn { color: rgb(var(--tok-fn)); }

/* Typing */
.typing-row { display: flex; align-items: center; gap: 10px; }
.typing-dots { display: flex; align-items: center; gap: 5px; }
.typing-dots span { width: 7px; height: 7px; border-radius: var(--r-pill); background: rgb(var(--ink-3)); animation: dot-bounce 0.9s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }
.stream-caret { display: inline-block; width: 2px; height: 1.05em; margin-inline-start: 2px; vertical-align: -0.15em; border-radius: 2px; background: rgb(var(--accent)); animation: caret-blink 1s steps(2, start) infinite; }
.text-shimmer { background-image: linear-gradient(90deg, rgb(var(--ink-3)) 0%, rgb(var(--ink)) 50%, rgb(var(--ink-3)) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: text-shimmer 1.8s linear infinite; }
.skeleton { position: relative; overflow: hidden; background-color: rgb(var(--fill) / 0.1); border-radius: var(--r-lg); }
.skeleton::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background-image: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.35), transparent); animation: shimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
.dark .skeleton::after { background-image: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.06), transparent); }

/* Composer */
.composer-wrap {
  position: absolute; inset-inline: 0; bottom: 0; z-index: 20;
  pointer-events: none;
}
.composer-inner {
  margin: 0 auto; width: 100%; max-width: 760px;
  padding: 0 12px max(env(safe-area-inset-bottom), 12px);
  pointer-events: auto;
}
@media (min-width: 640px) { .composer-inner { padding: 0 24px 12px; } }
.composer {
  border-radius: 30px;
  padding: 6px 8px;
  min-height: 54px;
  background: rgba(18,18,20,0.96);
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 12px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
}
.composer-focus { border-color: rgb(var(--accent) / 0.28); box-shadow: 0 18px 42px rgba(0,0,0,0.38), 0 0 0 4px rgb(var(--accent) / 0.055); }
.composer-row { display: flex; align-items: flex-end; gap: 6px; min-height: 42px; }
.composer textarea {
  display: block; max-height: 180px; min-height: 42px; min-width: 0; flex: 1;
  resize: none; background: transparent; padding: 9px 7px;
  font-size: 14px; line-height: 1.55;
  color: rgb(var(--ink)); outline: none; border: 0;
}
.composer textarea::placeholder { color: rgb(var(--ink-3)); }
.composer-circle {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: rgb(var(--ink-2));
  background: transparent;
  transition: transform 0.22s var(--ease-spring), background 0.2s, color 0.2s;
}
.composer-circle:hover { background: rgba(255,255,255,0.08); color: #fff; }
.composer-circle:active { transform: scale(0.88); }
.composer-leading-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.composer-attach { background: rgba(255,255,255,0.045); color: #b8bac2; }
.composer-actions-end { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.send-btn-pro.ready {
  background: linear-gradient(145deg, rgb(var(--accent)), rgb(var(--accent-strong)));
  color: #fff;
  box-shadow: 0 8px 20px rgb(var(--accent-strong) / 0.32), inset 0 1px 0 rgba(255,255,255,0.24);
}
.send-btn-pro.ready:hover { transform: scale(1.06); }
.voice-btn-pro {
  background: linear-gradient(145deg, rgb(var(--accent)), rgb(var(--accent-strong)));
  color: #fff;
  box-shadow: 0 7px 20px rgb(var(--accent-strong) / 0.28), inset 0 1px 0 rgba(255,255,255,0.25);
}
.stop-btn-pro { background: rgb(var(--danger) / 0.12); color: rgb(var(--danger)); }
.composer-footnote { margin: 8px 0 0; text-align: center; font-size: 11.5px; color: rgb(var(--ink-3)); }

.tool-chips-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 4px; animation: fade-in 0.2s var(--ease-ios); }
.tool-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 10px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; animation: scale-in 0.2s var(--ease-spring); }
.tool-chip-close { width: 20px; height: 20px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; color: inherit; opacity: 0.75; margin-inline-start: 2px; }

/* Attachment tray */
.attach-preview { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 10px 4px; }
.attach-card {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 16px;
  background: rgb(var(--surface) / 0.9);
  border: 1px solid rgb(var(--hairline) / 0.08);
  box-shadow: var(--shadow-xs);
  min-width: 220px; max-width: 320px;
}
.attach-card-close {
  position: absolute; top: 8px; inset-inline-end: 8px;
  width: 24px; height: 24px; border-radius: var(--r-pill);
  display: flex; align-items: center; justify-content: center;
  color: rgb(var(--ink-3));
  z-index: 2;
}
.attach-card-body { display: flex; align-items: center; gap: 10px; width: 100%; padding-inline-end: 24px; }
.attach-card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.attach-card-info { flex: 1; min-width: 0; }
.attach-card-name { font-size: 13px; font-weight: 600; color: rgb(var(--ink)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-card-meta { font-size: 11px; color: rgb(var(--ink-3)); }

/* New attachment (image thumb) */
.arix-attachment-preview {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  flex-wrap: wrap !important;
  margin: 0 0 7px !important;
  padding: 0 2px !important;
}
.arix-attach-card {
  position: relative !important;
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  padding: 0 !important;
  margin: 0 !important;
}
.arix-image-attachment {
  position: relative !important;
  width: 64px !important;
  height: 64px !important;
  border-radius: 13px !important;
  overflow: hidden !important;
  background: rgb(var(--surface-2)) !important;
  border: 1px solid rgb(var(--hairline) / 0.12) !important;
  box-shadow: 0 7px 20px rgba(0,0,0,0.22) !important;
}
.arix-image-attachment img {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}
.arix-image-remove, .arix-file-remove {
  position: absolute !important;
  top: 4px !important;
  right: 4px !important;
  width: 19px !important;
  height: 19px !important;
  border-radius: 50% !important;
  border: 1px solid rgba(255,255,255,0.18) !important;
  background: rgba(10,10,12,0.78) !important;
  color: #fff !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  z-index: 3 !important;
}
.arix-file-attachment {
  position: relative !important;
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  min-width: 190px !important;
  max-width: 250px !important;
  min-height: 58px !important;
  padding: 7px 9px !important;
  border-radius: 14px !important;
  background: rgb(var(--surface-2) / 0.82) !important;
  border: 1px solid rgb(var(--hairline) / 0.1) !important;
}
.arix-file-icon {
  width: 36px !important; height: 36px !important;
  border-radius: 10px !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
  flex: 0 0 36px !important;
}
.arix-file-copy {
  display: flex !important; flex-direction: column !important;
  gap: 2px !important; min-width: 0 !important;
  padding-right: 18px !important;
}
.arix-file-copy strong {
  font-size: 11.5px !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  max-width: 145px !important;
}
.arix-file-copy small { font-size: 9.5px !important; color: rgb(var(--ink-3)) !important; }

/* Voice Recorder */
.recorder-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; border-radius: var(--r-pill);
  background: rgb(var(--danger) / 0.1);
  color: rgb(var(--danger));
  margin-bottom: 8px;
}
.recorder-pulse { width: 10px; height: 10px; border-radius: var(--r-pill); background: rgb(var(--danger)); animation: pulse-soft 1.2s ease-in-out infinite; }
.recorder-wave { display: flex; align-items: center; gap: 2px; height: 24px; }
.recorder-wave span { width: 3px; border-radius: var(--r-pill); background: currentColor; height: 6px; animation: wave 1s ease-in-out infinite; }

/* Mobile Nav */
.mobile-nav {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-radius: var(--r-2xl); padding: 6px;
  margin-top: 8px;
}
.mobile-nav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; height: 52px; border-radius: var(--r-xl);
  font-size: 10.5px; font-weight: 500;
  color: rgb(var(--ink-2));
}
.mobile-nav-pro {
  background: rgba(12,12,14,0.92) !important;
  border: 1px solid rgba(255,255,255,0.08) !important;
  border-radius: 26px !important;
  padding: 5px !important;
  box-shadow: 0 18px 45px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05) !important;
  backdrop-filter: blur(24px);
}
.mobile-nav-pro button.active {
  background: linear-gradient(180deg, rgb(var(--accent) / 0.16), rgb(var(--accent) / 0.08)) !important;
  color: rgb(var(--accent)) !important;
}

/* Icon Button */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill);
  transition: background-color var(--dur), color var(--dur), transform var(--dur-fast);
  flex-shrink: 0;
}
.icon-btn:hover { background-color: rgb(var(--fill) / 0.1); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn.accent { background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; }
.icon-btn.soft { background-color: rgb(var(--fill) / 0.09); }
.icon-btn.size-xs { width: 26px; height: 26px; }
.icon-btn.size-sm { width: 32px; height: 32px; }
.icon-btn.size-md { width: 40px; height: 40px; }
.icon-btn.size-lg { width: 44px; height: 44px; }

/* Empty State */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px 0;
  min-height: calc(100dvh - 340px);
}
.empty-state h1 { margin: 22px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
@media (min-width: 640px) { .empty-state h1 { font-size: 28px; } }
.empty-state .sub { margin: 10px 0 0; max-width: 26rem; font-size: 15px; line-height: 1.7; color: rgb(var(--ink-2)); }
.chips-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 42rem; margin-top: 28px; }
.suggestion-chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 16px 0 14px;
  border-radius: var(--r-pill);
  font-size: 14px; font-weight: 500;
  color: rgb(var(--ink));
  transition: transform var(--dur-fast) var(--ease-spring), background-color var(--dur);
  cursor: pointer;
}
.suggestion-chip:hover { transform: translateY(-2px); }

/* Toast */
.toast-wrap { position: fixed; inset-inline: 0; top: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: max(env(safe-area-inset-top), 12px) 16px 0; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: var(--r-pill); font-size: 14px; font-weight: 500; color: rgb(var(--ink)); pointer-events: auto; max-width: 100%; animation: toast-in 0.26s var(--ease-ios); }
.toast-icon { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r-pill); color: #fff; flex-shrink: 0; }
.toast-icon.success { background: rgb(var(--success)); }
.toast-icon.info { background: rgb(var(--accent-strong)); }
.toast-icon.error { background: rgb(var(--danger)); }
.toast-icon.warning { background: rgb(var(--warning)); }

/* Context Menu */
.ctx-backdrop { position: fixed; inset: 0; z-index: 150; background: transparent; }
.ctx-menu {
  position: fixed;
  width: 230px;
  border-radius: var(--r-xl);
  padding: 6px;
  animation: ctx-in 0.16s var(--ease-ios);
  z-index: 151;
}
.ctx-item {
  display: flex; align-items: center; gap: 12px;
  width: 100%; height: 40px; padding: 0 12px;
  border-radius: var(--r-sm);
  font-size: 14px; font-weight: 500;
  text-align: start;
  transition: background-color var(--dur-fast);
}
.ctx-item:hover { background: rgb(var(--fill) / 0.1); }
.ctx-item.danger { color: rgb(var(--danger)); }
.ctx-item-label { flex: 1; }
.ctx-divider { height: 1px; background: rgb(var(--hairline) / 0.08); margin: 4px 8px; }

/* Auth */
.auth-shell {
  position: relative; display: flex;
  height: 100dvh; width: 100%;
  overflow-y: auto; overscroll-behavior: contain;
  background-color: rgb(var(--bg));
}
.auth-grid { display: grid; grid-template-columns: 1fr; width: 100%; min-height: 100dvh; }
@media (min-width: 1024px) { .auth-grid { grid-template-columns: 1.05fr 1fr; } }
.auth-brand-panel { display: none; padding: 60px 56px; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
@media (min-width: 1024px) { .auth-brand-panel { display: flex; } }
.auth-brand-head { display: flex; align-items: center; gap: 12px; }
.auth-brand-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.auth-brand-hero { margin: auto 0; max-width: 480px; }
.auth-brand-hero h2 { margin: 0; font-size: 40px; font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; color: rgb(var(--ink)); }
.auth-brand-hero p { margin: 16px 0 0; font-size: 16px; line-height: 1.7; color: rgb(var(--ink-2)); }
.auth-features { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
.auth-feature { display: flex; align-items: center; gap: 12px; font-size: 14.5px; color: rgb(var(--ink-2)); }
.auth-feature-icon { width: 32px; height: 32px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.auth-brand-foot { font-size: 12.5px; color: rgb(var(--ink-3)); }
.auth-form-panel { display: flex; align-items: center; justify-content: center; padding: 60px 20px max(env(safe-area-inset-bottom), 24px); }
@media (min-width: 1024px) { .auth-form-panel { padding: 60px 56px; } }
.auth-card { width: 100%; max-width: 400px; padding: 32px 28px; border-radius: var(--r-2xl); }
@media (min-width: 1024px) {
  .auth-card {
    background: rgb(var(--glass) / var(--glass-strong-a));
    border: 1px solid rgb(var(--hairline) / var(--hairline-a));
    box-shadow: inset 0 1px 0 var(--highlight), var(--shadow-lg);
    padding: 40px 36px;
  }
}
.auth-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; }
.auth-head h1 { margin: 18px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.auth-head p { margin: 6px 0 0; max-width: 320px; font-size: 14px; line-height: 1.5rem; color: rgb(var(--ink-2)); }
.auth-field { margin-bottom: 14px; }
.auth-field-label { display: block; padding: 0 4px 6px; font-size: 12.5px; font-weight: 600; color: rgb(var(--ink-2)); }
.auth-field-input { display: flex; align-items: center; gap: 10px; height: 52px; border-radius: var(--r-lg); border: 1px solid rgb(var(--hairline) / 0.1); background: rgb(var(--surface) / 0.7); padding: 0 6px 0 16px; }
.auth-field-input:focus-within { border-color: rgb(var(--accent) / 0.4); box-shadow: 0 0 0 4px rgb(var(--accent) / 0.12); }
.auth-field-input input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; font-size: 16px; color: rgb(var(--ink)); }
.auth-error { display: flex; align-items: center; gap: 6px; padding: 6px 4px 0; font-size: 12.5px; font-weight: 500; color: rgb(var(--danger)); }
.auth-submit { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: var(--r-pill); background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; font-size: 15px; font-weight: 600; box-shadow: 0 14px 28px -14px rgb(var(--accent-strong) / 0.8); }
.auth-submit:disabled { opacity: 0.6; cursor: default; }
.divider { display: flex; align-items: center; gap: 12px; padding: 4px 0; font-size: 12.5px; color: rgb(var(--ink-3)); }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgb(var(--hairline) / 0.1); }
.social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.social-btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: var(--r-pill); border: 1px solid rgb(var(--hairline) / 0.1); background: rgb(var(--surface) / 0.7); font-size: 14px; font-weight: 600; }
.auth-link { font-weight: 600; color: rgb(var(--accent)); }
.auth-foot { padding-top: 8px; text-align: center; font-size: 13.5px; color: rgb(var(--ink-2)); }
.form-alert { border-radius: var(--r-md); background: rgb(var(--danger) / 0.1); padding: 12px 16px; font-size: 13.5px; font-weight: 500; line-height: 1.5rem; color: rgb(var(--danger)); }

/* Mobile tweaks */
@media (max-width: 640px) {
  .header-wrap { padding: max(env(safe-area-inset-top), 8px) 8px 6px; }
  .header-inner { padding-inline: 8px; gap: 7px; }
  .header-title-box { height: 48px; min-width: 0; flex: 1; padding: 0 10px 0 4px; }
  .header-title-box .brand-mark { width: 34px !important; height: 34px !important; }
  .header-duo-pill { height: 48px; padding: 4px; gap: 2px; }
  .header-round-btn { width: 39px; height: 39px; }
  .header-single-pill { width: 48px; height: 48px; }
  .chat-title-text { font-size: 13px !important; }
  .chat-title-status { font-size: 9.5px !important; }
  .chat-inner { padding-left: 12px; padding-right: 12px; }
  .composer-inner { padding: 0 10px max(env(safe-area-inset-bottom), 10px); }
  .composer-wrap { padding: 7px 8px calc(env(safe-area-inset-bottom) + 8px); }
  .composer { min-height: 50px; border-radius: 28px; padding: 5px 6px; }
  .composer textarea { font-size: 13px; min-height: 38px; }
  .composer-circle { width: 38px; height: 38px; }
  .empty-state h1 { font-size: 22px; }
  .bubble-user { max-width: 72% !important; padding: 6px 10px 5px !important; font-size: 12.5px !important; line-height: 1.62 !important; border-radius: 16px 16px 5px 16px !important; }
  .assistant-actions-pro { width: min(100%, 286px) !important; grid-template-columns: 38px minmax(102px, 1fr) auto !important; gap: 7px !important; }
  .assistant-action-single, .assistant-action-wide, .assistant-action-group { height: 34px !important; border-radius: 13px !important; }
  .assistant-action-single { width: 38px !important; }
  .assistant-action-btn { width: 28px !important; height: 28px !important; border-radius: 9px !important; }
}

img, video, svg, canvas { max-width: 100%; }
table { max-width: 100%; }
pre { max-width: 100%; }

/* ============================================================
   IMAGE GENERATOR — premium redesign
   ============================================================ */
.arix-image-workspace {
  width: min(1120px, calc(100% - 32px));
  height: min(760px, calc(100vh - 112px));
  margin: 0 auto;
  display: grid;
  grid-template-columns: 390px minmax(0, 1fr);
  gap: 16px;
  padding: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 26px;
  background: linear-gradient(145deg, rgba(24,24,28,0.96), rgba(13,13,16,0.98));
  box-shadow: 0 24px 80px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.04);
}
.arix-image-config {
  display: flex; flex-direction: column;
  min-height: 0; overflow: auto; padding: 8px 8px 8px 4px;
}
.arix-image-top { display: flex; align-items: center; gap: 11px; padding: 4px 4px 16px; }
.arix-image-logo {
  width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.035));
  border: 1px solid rgba(255,255,255,0.1);
}
.arix-image-title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
.arix-image-subtitle { font-size: 11px; color: rgb(var(--ink-3)); margin: 3px 0 0; }
.arix-image-prompt {
  width: 100%; min-height: 142px;
  resize: none;
  border-radius: 17px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.035);
  color: rgb(var(--ink));
  padding: 14px;
  font: inherit; font-size: 13px; line-height: 1.75;
  outline: none;
}
.arix-image-prompt:focus { border-color: rgba(130,150,255,0.35); box-shadow: 0 0 0 3px rgba(100,120,255,0.08); }
.arix-image-section { margin-top: 14px; }
.arix-image-label { font-size: 11px; font-weight: 700; color: rgb(var(--ink-2)); margin: 0 0 7px; display: block; }
.arix-image-options { display: flex; gap: 6px; flex-wrap: wrap; }
.arix-image-option {
  height: 34px; padding: 0 11px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.09);
  background: rgba(255,255,255,0.035);
  color: rgb(var(--ink-2));
  font-size: 10.5px; cursor: pointer;
}
.arix-image-option:hover { background: rgba(255,255,255,0.07); color: rgb(var(--ink)); }
.arix-image-option.active { background: rgba(255,255,255,0.11); border-color: rgba(150,160,255,0.35); color: rgb(var(--ink)); }
.arix-image-generate {
  margin-top: 16px; width: 100%; height: 46px;
  border: 0; border-radius: 14px;
  background: linear-gradient(135deg, #fff, #d9d9df);
  color: #111;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 800; font-size: 12px; cursor: pointer;
}
.arix-image-generate:disabled { opacity: 0.55; cursor: default; }
.arix-image-results {
  min-width: 0; min-height: 0;
  border-radius: 20px;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.08);
  overflow: auto;
  padding: 16px;
}
.arix-image-results-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.arix-image-results-title { font-size: 12px; font-weight: 750; }
.arix-image-results-meta { font-size: 10px; color: rgb(var(--ink-3)); }
.arix-image-empty { height: 100%; min-height: 420px; display: grid; place-items: center; text-align: center; color: rgb(var(--ink-3)); }
.arix-image-empty-inner { max-width: 310px; }
.arix-image-empty-orb { width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 22px; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.16), rgba(255,255,255,0.035)); border: 1px solid rgba(255,255,255,0.08); }
.arix-image-empty h3 { font-size: 15px; color: rgb(var(--ink-2)); margin: 0 0 6px; }
.arix-image-empty p { font-size: 11px; line-height: 1.8; margin: 0; }
@media (max-width: 820px) {
  .arix-image-workspace {
    width: calc(100% - 16px);
    height: calc(100vh - 88px);
    grid-template-columns: 1fr;
    padding: 10px;
    border-radius: 20px;
    overflow: auto;
  }
  .arix-image-config { overflow: visible; }
  .arix-image-results { min-height: 280px; }

}
@media (max-width: 480px) {
  .arix-image-workspace {
    width: 100%; height: calc(100vh - 72px); margin: 0;
    border-radius: 0; border-inline: 0;
  }
  .arix-image-title { font-size: 18px; }
  .arix-image-prompt { min-height: 120px; }
  .arix-image-results { padding: 11px; }
}

/* ============================================================
   GEN MODAL (Image / Video)
   ============================================================ */
.gen-modal-backdrop {
  position: fixed; inset: 0; z-index: 95;
  background: rgba(0,0,0,0.35);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  animation: fade-in 0.22s var(--ease-ios);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.gen-modal { width: 100%; max-width: 1080px; max-height: calc(100dvh - 32px); border-radius: var(--r-2xl); display: flex; flex-direction: column; overflow: hidden; }
.gen-modal-head { padding: 20px 24px 16px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgb(var(--hairline) / 0.06); flex-shrink: 0; }
.gen-modal-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; overflow: hidden; }
@media (min-width: 900px) { .gen-modal-body { grid-template-columns: 380px minmax(0, 1fr); } }
.gen-config { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.gen-results { padding: 20px 24px; overflow-y: auto; background: rgb(var(--fill) / 0.02); }
.gen-field-label { display: block; font-size: 12px; font-weight: 700; color: rgb(var(--ink-3)); margin-bottom: 8px; }
.gen-textarea { display: block; width: 100%; resize: none; border-radius: var(--r-lg); border: 1px solid rgb(var(--hairline) / 0.1); background: rgb(var(--surface) / 0.7); padding: 14px; font-size: 14.5px; line-height: 1.7; color: rgb(var(--ink)); outline: none; font-family: inherit; }
.gen-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.gen-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; background: rgb(var(--fill) / 0.1); color: rgb(var(--ink-2)); cursor: pointer; }
.gen-chip.active { background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; }
.gen-submit { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: var(--r-pill); background: linear-gradient(135deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); color: #fff; font-size: 15px; font-weight: 600; margin-top: auto; }
.gen-submit:disabled { opacity: 0.5; cursor: default; }
.gen-progress-card { border-radius: var(--r-xl); padding: 20px; background: rgb(var(--surface) / 0.7); border: 1px solid rgb(var(--hairline) / 0.06); }
.gen-progress-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.gen-progress-icon { width: 44px; height: 44px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; background: rgb(var(--accent) / 0.1); color: rgb(var(--accent)); flex-shrink: 0; animation: pulse-soft 1.6s ease-in-out infinite; }
.gen-progress-bar { height: 5px; border-radius: var(--r-pill); overflow: hidden; background: rgb(var(--fill) / 0.12); }
.gen-progress-bar > div { height: 100%; border-radius: var(--r-pill); background: linear-gradient(90deg, rgb(var(--accent)) 0%, rgb(var(--accent-strong)) 100%); transition: width 0.2s linear; }
.gen-progress-pct { font-size: 15px; font-weight: 700; color: rgb(var(--ink)); }
.gen-progress-stages { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.gen-stage { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgb(var(--ink-3)); }
.gen-stage.done { color: rgb(var(--success)); }
.gen-stage.active { color: rgb(var(--accent)); font-weight: 600; }
.gen-stage-dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: currentColor; flex-shrink: 0; }
.gen-gallery { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.gen-result-tile { position: relative; overflow: hidden; border-radius: var(--r-xl); background: rgb(var(--fill) / 0.08); aspect-ratio: 1; cursor: pointer; }
.gen-result-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gen-result-tile-actions { position: absolute; top: 8px; inset-inline-end: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity var(--dur); }
.gen-result-tile:hover .gen-result-tile-actions { opacity: 1; }
.gen-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 24px; color: rgb(var(--ink-3)); min-height: 340px; }
.gen-empty-icon { width: 64px; height: 64px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; background: rgb(var(--accent) / 0.08); color: rgb(var(--accent)); margin-bottom: 16px; }
.gen-result-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* ============================================================
   CODE STUDIO
   ============================================================ */
.code-studio { height: 100%; display: grid; grid-template-columns: 1fr; overflow: hidden; }
@media (min-width: 1024px) { .code-studio { grid-template-columns: 240px minmax(0, 1fr) 340px; } }
.studio-sidebar { border-inline-end: 1px solid rgb(var(--hairline) / 0.06); background: rgb(var(--surface) / 0.4); overflow-y: auto; padding: 16px 12px; display: none; }
@media (min-width: 1024px) { .studio-sidebar { display: block; } }
.studio-main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.studio-tabs { display: flex; gap: 2px; padding: 8px 12px; border-bottom: 1px solid rgb(var(--hairline) / 0.06); overflow-x: auto; flex-shrink: 0; background: rgb(var(--surface) / 0.4); }
.studio-tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 500; color: rgb(var(--ink-2)); white-space: nowrap; }
.studio-tab.active { background: rgb(var(--surface)); color: rgb(var(--ink)); box-shadow: var(--shadow-xs); }
.editor-wrap { flex: 1; min-height: 0; display: flex; background: rgb(var(--code-bg) / 0.6); overflow: hidden; position: relative; direction: ltr; }
.editor-gutter { flex-shrink: 0; padding: 16px 8px 16px 12px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; color: rgb(var(--tok-comment) / 0.7); user-select: none; background: rgb(var(--code-bg) / 0.5); border-inline-end: 1px solid rgb(var(--hairline) / 0.06); overflow: hidden; }
.editor-textarea { flex: 1; min-width: 0; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; color: rgb(var(--tok-plain)); background: transparent; border: 0; outline: none; resize: none; white-space: pre; overflow: auto; tab-size: 2; }
.studio-assistant { border-inline-start: 1px solid rgb(var(--hairline) / 0.06); background: rgb(var(--surface) / 0.4); overflow-y: auto; padding: 16px; display: none; }
@media (min-width: 1024px) { .studio-assistant { display: block; } }

/* ============================================================
   SETTINGS
   ============================================================ */
.settings-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.32);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  animation: fade-in 0.22s var(--ease-ios);
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 768px) { .settings-backdrop { align-items: center; padding: 24px; } }
.settings-panel {
  position: relative; width: 100%; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
  background-color: #08080a;
}
@media (min-width: 768px) {
  .settings-panel {
    width: min(1080px, calc(100vw - 48px));
    height: min(740px, calc(100dvh - 48px));
    border-radius: 30px;
    display: grid; grid-template-columns: 260px minmax(0, 1fr);
    background-color: #08080a;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 40px 80px -24px rgba(0,0,0,0.8);
  }
}
.settings-nav { display: none; flex-direction: column; min-height: 0; border-inline-end: 1px solid rgba(255,255,255,0.06); background: #0b0b0d; padding: 20px 10px; }
@media (min-width: 768px) { .settings-nav { display: flex; } }
.settings-nav-title { font-size: 20px; font-weight: 700; padding: 0 12px 16px; letter-spacing: -0.02em; }
.settings-nav-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.settings-nav-item { display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 12px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; color: rgb(var(--ink)); text-align: start; margin-bottom: 2px; }

@media (min-width: 768px) { .settings-content-scroll { padding: 0 32px 32px; } }
.settings-card { border-radius: 22px; border: 1px solid rgba(255,255,255,0.065); background: linear-gradient(180deg, #101013, #09090b); box-shadow: 0 14px 34px rgba(0,0,0,0.22); overflow: hidden; margin-bottom: 16px; }

.toggle { position: relative; width: 51px; height: 31px; border-radius: var(--r-pill); background: rgb(var(--fill) / 0.25); flex-shrink: 0; }
.toggle.on { background: rgb(var(--accent-strong)); }
.toggle::after { content: ''; position: absolute; top: 2px; inset-inline-start: 2px; width: 27px; height: 27px; border-radius: var(--r-pill); background: #fff; transition: transform var(--dur) var(--ease-ios); }
.toggle.on::after { transform: translateX(-20px); }

/* ============================================================
   PROFILE / APPEARANCE

}

.profile-glow-b { width: 130px; height: 130px; bottom: -90px; inset-inline-start: -40px; background: rgb(var(--accent-strong) / 0.1); }
.profile-topline { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.profile-main { position: relative; display: flex; align-items: center; gap: 15px; margin-top: 20px; }
.profile-avatar-xl { position: relative; width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, rgb(var(--accent)), rgb(var(--accent-strong))); color: #fff; font-size: 25px; font-weight: 800; box-shadow: 0 0 0 5px rgba(255,255,255,0.035), 0 16px 38px rgba(0,0,0,0.4); flex-shrink: 0; }

.profile-main-copy { min-width: 0; }

.profile-main-copy p { margin: 4px 0 0; font-size: 11.5px; color: rgb(var(--ink-3)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 9px; font-size: 10px; color: rgb(var(--ink-3)); }
.profile-stat-strip { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 16px; }

.profile-stat-strip span { display: block; margin-top: 3px; font-size: 10px; color: rgb(var(--ink-3)); }
.profile-quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.appearance-hero-card { display: grid; grid-template-columns: 190px 1fr; gap: 20px; align-items: center; padding: 18px; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; background: linear-gradient(180deg, #101013, #09090b); margin-bottom: 14px; overflow: hidden; }
.appearance-preview { height: 145px; border-radius: 18px; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 9px; }

.appearance-preview-body i, .appearance-preview-body b, .appearance-preview-body em { display: block; height: 7px; border-radius: 999px; background: rgba(255,255,255,0.12); }
.appearance-preview-body i { width: 62%; background: rgb(var(--accent) / 0.8); margin-inline-start: auto; }

.appearance-section-head { display: flex; align-items: center; gap: 11px; padding: 16px; }

.appearance-section-head b { font-size: 13.5px; }
.appearance-section-head small { font-size: 10.5px; color: rgb(var(--ink-3)); }
.appearance-section-icon { width: 38px; height: 38px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgb(var(--accent) / 0.1); color: rgb(var(--accent)); }
.appearance-theme-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 14px 16px 16px; }
.appearance-theme-option { min-height: 68px; border: 1px solid rgba(255,255,255,0.06); border-radius: 19px; padding: 10px; display: flex; align-items: center; gap: 9px; text-align: start; background: rgba(255,255,255,0.025); color: rgb(var(--ink)); }

.appearance-theme-option > span:nth-child(2) { display: flex; flex-direction: column; gap: 2px; flex: 1; }

.theme-black-dot, .theme-light-dot { width: 30px; height: 30px; border-radius: 11px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.14); }

.accent-grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px; }
.accent-swatch { width: 38px; height: 38px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; color: #fff; transition: transform var(--dur) var(--ease-spring); }
.accent-swatch:hover { transform: scale(1.1); }

/* ============================================================
   SEARCH
   ============================================================ */
.search-backdrop {
  position: fixed; inset: 0; z-index: 92;
  background: rgba(0,0,0,0.28);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  animation: fade-in 0.2s var(--ease-ios);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 12vh 16px 16px;
}
.search-panel { width: 100%; max-width: 620px; max-height: 70dvh; border-radius: var(--r-2xl); overflow: hidden; display: flex; flex-direction: column; animation: slide-down 0.26s var(--ease-ios); }
.search-input-wrap { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgb(var(--hairline) / 0.06); }
.search-input-wrap input { flex: 1; height: 32px; background: transparent; border: 0; outline: none; font-size: 16px; color: rgb(var(--ink)); }
.search-filters { display: flex; gap: 4px; padding: 10px 16px; border-bottom: 1px solid rgb(var(--hairline) / 0.06); overflow-x: auto; flex-shrink: 0; }
.search-filter { height: 30px; padding: 0 12px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; color: rgb(var(--ink-2)); white-space: nowrap; }
.search-filter.active { background: rgb(var(--accent)); color: #fff; }
.search-results { flex: 1; overflow-y: auto; padding: 8px; }

.search-result:hover { background: rgb(var(--fill) / 0.06); }
.search-result-icon { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--r-pill); flex-shrink: 0; }

/* ============================================================
   DELETE CONFIRM
   ============================================================ */
.delete-confirm-backdrop {
  position: fixed; inset: 0; z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,0.68);

  opacity: 0;
  transition: opacity 0.18s ease;
}
#delete-conversation-confirm.show .delete-confirm-backdrop { opacity: 1; }
.delete-confirm-card {
  width: min(410px, 100%);
  padding: 22px;
  border-radius: 30px;
  background: linear-gradient(160deg, #17171b, #0a0a0c);
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 30px 100px rgba(0,0,0,0.62), inset 0 1px 0 rgba(255,255,255,0.04);
  transform: translateY(12px) scale(0.97);

}
#delete-conversation-confirm.show .delete-confirm-card { transform: translateY(0) scale(1); }
.delete-confirm-icon { width: 54px; height: 54px; border-radius: 19px; display: flex; align-items: center; justify-content: center; color: #ff6d78; background: rgba(255,82,96,0.1); border: 1px solid rgba(255,82,96,0.13); margin-bottom: 15px; }
.delete-confirm-kicker { font-size: 9px; font-weight: 800; color: #ff6d78; }
.delete-confirm-copy h3 { margin: 5px 0 7px; font-size: 18px; line-height: 1.5; }
.delete-confirm-copy p { margin: 0; color: rgb(var(--ink-2)); font-size: 11px; line-height: 2; }

.delete-confirm-actions button { height: 46px; border-radius: 16px; font-size: 11px; font-weight: 800; }
.delete-confirm-cancel { background: rgb(var(--fill) / 0.07); color: rgb(var(--ink-2)); border: 1px solid rgb(var(--hairline) / 0.08); }
.delete-confirm-danger { background: linear-gradient(135deg, #ff5867, #d92f44); color: #fff; }

/* ============================================================
   CHAT PLUS MENU — FINAL
   ============================================================ */

  pointer-events: none !important;
  overflow: visible !important;
}

  pointer-events: auto;
}
#chat-plus-overlay {
  position: fixed !important;
  inset: 0 !important;
  width: auto !important;
  height: auto !important;
  min-width: 0 !important;
  min-height: 0 !important;
  z-index: 100000 !important;
  pointer-events: none !important;
  background: transparent !important;
  background-color: transparent !important;
  box-shadow: none !important;
  border: 0 !important;
  filter: none !important;
  backdrop-filter: none !important;

}

}

.chat-plus-grid {

}

}

.mobile-menu-head h2 { margin: 2px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.mobile-menu-kicker { font-size: 9px; font-weight: 800; letter-spacing: 0.18em; color: rgb(var(--accent)); }
.mobile-menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mobile-menu-tile {
  position: relative; min-height: 78px; padding: 12px;
  display: flex; align-items: center; gap: 10px;
  text-align: start;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  background: rgba(255,255,255,0.04);
}
.mobile-menu-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 15px; background: rgb(var(--accent) / 0.1); color: rgb(var(--accent)); flex-shrink: 0; }
.mobile-menu-copy { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mobile-menu-copy strong { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mobile-menu-copy small { font-size: 10.5px; color: rgb(var(--ink-3)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mobile-menu-chevron { margin-inline-start: auto; color: rgb(var(--ink-3)); }

/* Updates channel */
.updates-settings-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: stretch;
  gap: 16px;
  padding: 0;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px;
  background: linear-gradient(180deg, #101013, #09090b);
  margin-bottom: 14px;
  cursor: pointer;
}
.updates-settings-art { width: 118px; min-height: 168px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: linear-gradient(145deg, rgb(var(--accent) / 0.18), rgb(var(--accent-strong) / 0.06)); }
.updates-settings-avatar { width: 62px; height: 62px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgb(var(--accent)), rgb(var(--accent-strong))); color: #fff; z-index: 2; }
.updates-settings-body { flex: 1; min-width: 0; padding: 20px 18px 18px 0; }
.updates-settings-title-row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.updates-settings-title-row h3 { margin: 8px 0 0; font-size: 17px; font-weight: 800; }
.updates-live-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; color: rgb(var(--success)); background: rgb(var(--success) / 0.09); padding: 4px 8px; border-radius: 999px; }
.updates-settings-body p { margin: 8px 0 14px; font-size: 12.5px; line-height: 1.8; color: rgb(var(--ink-2)); }
.updates-settings-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 10.5px; color: rgb(var(--ink-3)); }
.updates-settings-arrow { color: rgb(var(--ink-3)); padding-top: 4px; }

/* ============================================================
   UTILITY
   ============================================================ */
.no-scroll { overflow: hidden !important; }
.hidden { display: none !important; }
</style>

function applyTheme() {
  const s = state.settings;
  const root = document.documentElement;
  const isDark = isDarkMode();
  const [accent, accentStrong] = ACCENTS[s.accent][isDark ? 'dark' : 'light'];
  root.classList.toggle('dark', isDark);
  root.classList.toggle('hc', s.highContrast);
  root.classList.toggle('no-motion', s.reducedMotion);
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-strong', accentStrong);
  document.body.style.backgroundColor = isDark ? '#000000' : '#f5f6fa';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isDark ? '#000000' : '#f5f6fa');
}
function isDarkMode() {
  const t = state.settings.theme;
  if (t === 'dark') return true;
  if (t === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches;
  return false;
}

function showToast(message, tone = 'success') {
  const item = { message, tone, id: uid('t') };
  if (state.toast) {
    state.toastQueue.push(item);
    if (state.toastQueue.length > 3) state.toastQueue.shift();
  } else {
    state.toast = item;
    state.toastTimer = setTimeout(() => {
      state.toast = state.toastQueue.shift() || null;
      if (state.toast) state.toastTimer = setTimeout(() => { state.toast = state.toastQueue.shift() || null; renderToast(); }, 2400);
      renderToast();
    }, 2600);
  }
  renderToast();
}
function renderToast() {
  const root = document.getElementById('nova-overlay-root');
  if (!root) return;
  let wrap = document.getElementById('toast-wrap');
  if (!state.toast && !state.toastQueue.length) { if (wrap) wrap.remove(); return; }
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toast-wrap';
    wrap.className = 'toast-wrap';
    wrap.setAttribute('aria-live', 'polite');
    root.appendChild(wrap);
  }
  const items = state.toast ? [state.toast, ...state.toastQueue] : state.toastQueue;
  wrap.innerHTML = items.map((t, i) => {
    const ic = t.tone === 'success' ? 'check' : t.tone === 'error' ? 'alert' : t.tone === 'warning' ? 'alert' : 'info';
    return `<div class="glass-strong toast" style="${i > 0 ? 'opacity:' + (1 - i * 0.2) + ';transform:scale(' + (1 - i * 0.04) + ')' : ''}">
      <span class="toast-icon ${t.tone}">${icon(ic, 15, 2.4)}</span>
      <span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(t.message)}</span>
    </div>`;
  }).join('');
}
function fireConfetti(count = 40) {
  const colors = ['#0a76fa','#e12873','#169646','#e16e00','#8c46dc','#00a0c0'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `position:fixed;width:10px;height:10px;top:-10px;z-index:300;pointer-events:none;left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'9999px':'2px'};animation:confetti-fall ${1.5+Math.random()*1.5}s linear forwards;animation-delay:${Math.random()*0.3}s`;
    document.getElementById('nova-overlay-root').appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

async function onAuthSubmit(e) {
  e.preventDefault();
  const v = state.authView;
  if (v === 'login') return submitLogin();
  if (v === 'register') return submitRegister();
  if (v === 'forgot') return submitForgot();
  if (v === 'reset') return submitReset();
}
async function submitLogin() {
  const email = (document.getElementById('login-email')?.value || '').trim();
  const password = (document.getElementById('login-password')?.value || '');
  const errors = {};
  if (!isEmail(email)) errors.email = 'یک ایمیل معتبر وارد کنید.';
  if (!password) errors.password = 'رمز عبور را وارد کنید.';
  state.authErrors = errors;
  if (Object.keys(errors).length) { renderAuth(); return; }
  state.authSubmitState = 'loading';
  renderAuth();
  await wait(800);
  if (email.toLowerCase() !== DEMO_ACCOUNT.email) {
    state.authSubmitState = 'idle';
    state.authErrors = { email:'حسابی با این ایمیل پیدا نشد.' };
    renderAuth(); return;
  }
  if (password !== DEMO_ACCOUNT.password) {
    state.authSubmitState = 'idle';
    state.authErrors = { password:'رمز عبور نادرست است.' };
    renderAuth(); return;
  }
  state.authSubmitState = 'success';
  renderAuth();
  setTimeout(() => { state.authed = true; saveAuth(); renderApp(); fireConfetti(30); }, 600);
}
async function submitRegister() {
  const name = document.getElementById('reg-name')?.value.trim() || '';
  const email = document.getElementById('reg-email')?.value.trim() || '';
  const password = document.getElementById('reg-password')?.value || '';
  const errors = {};
  if (name.length < 2) errors.name = 'نام خود را وارد کنید.';
  if (!isEmail(email)) errors.email = 'یک ایمیل معتبر وارد کنید.';
  if (password.length < 8) errors.password = 'رمز باید حداقل ۸ کاراکتر باشد.';
  state.authErrors = errors;
  if (Object.keys(errors).length) { renderAuth(); return; }
  state.authSubmitState = 'loading';
  renderAuth();
  await wait(1000);
  state.authSubmitState = 'success';
  renderAuth();
  setTimeout(() => { state.authed = true; saveAuth(); renderApp(); showToast('حساب شما ساخته شد'); fireConfetti(50); }, 700);
}
async function submitForgot() {
  const email = document.getElementById('forgot-email')?.value.trim() || '';
  if (!isEmail(email)) { state.authErrors = { email:'ایمیل معتبر وارد کنید.' }; renderAuth(); return; }
  state.authSubmitState = 'loading';
  renderAuth();
  await wait(800);
  state.authEmail = email;
  state.authSubmitState = 'idle';
  state.authView = 'reset';
  showToast(`کد نمایشی: ${toPersianDigits(DEMO_RESET_CODE)}`, 'info');
  renderAuth();
}
async function submitReset() {
  const code = document.getElementById('reset-code')?.value || '';
  const password = document.getElementById('reset-password')?.value || '';
  const confirm = document.getElementById('reset-confirm')?.value || '';
  const errors = {};
  if (!/^\d{6}$/.test(fromPersianDigits(code))) errors.code = 'کد ۶ رقمی را وارد کنید.';
  if (password.length < 8) errors.password = 'رمز باید حداقل ۸ کاراکتر باشد.';
  if (confirm !== password) errors.confirm = 'تکرار رمز یکسان نیست.';
  state.authErrors = errors;
  if (Object.keys(errors).length) { renderAuth(); return; }
  state.authSubmitState = 'loading';
  renderAuth();
  await wait(800);
  if (fromPersianDigits(code) !== DEMO_RESET_CODE) {
    state.authSubmitState = 'idle';
    state.authErrors = { code:'کد نادرست است.' };
    renderAuth(); return;
  }
  state.authSubmitState = 'success';
  renderAuth();
  setTimeout(() => { showToast('رمز تغییر کرد. دوباره وارد شوید'); goAuth('login', state.authEmail); }, 800);
}
