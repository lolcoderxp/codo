<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طرح اولیه اپلیکیشن</title>
    <!-- اضافه کردن فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* تنظیمات کلی */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        /* شبیه‌سازی صفحه موبایل */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 25px; /* گردی بیشتر برای کل صفحه */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid #ddd;
        }

        /* ۱. هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .header-right, .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: transparent;
            font-size: 16px;
        }

        /* --- استایل دکمه منو همبرگری --- */
        .menu-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #555;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 0 8px;
        }

        .menu-line {
            height: 2px;
            background-color: #555;
            border-radius: 10px;
        }

        .menu-line.top { width: 100%; }
        .menu-line.bottom { width: 50%; }
        /* ---------------------------------------- */

        /* --- دکمه ورود / ثبت نام --- */
        .login-btn {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #555;
            padding: 6px 15px;
            border-radius: 25px; /* گردی بیشتر */
            background: transparent;
            cursor: pointer;
            color: #333;
        }

        /* ۲. منوی دسته‌بندی (باکس عریض و کم‌ارتفاع با باکس داخلی) */
        .categories-wrapper {
            border: 1px solid #555;
            border-radius: 25px; /* گردی بسیار نرم برای باکس بیرونی */
            padding: 5px 8px;    /* کاهش پدینگ برای کم‌ارتفاع شدن */
            display: flex;
            justify-content: center; /* وسط‌چین کردن باکس داخلی */
        }

        /* باکس داخلی که متن‌ها را در خود جای می‌دهد */
        .categories-inner {
            display: flex;
            gap: 15px;
            align-items: center;
            white-space: nowrap;
            padding: 4px 12px;   /* پدینگ داخلی */
            border: 1px solid #aaa; /* حاشیه برای باکس داخلی */
            border-radius: 20px; /* گردی نرم برای باکس داخلی */
            width: 100%;         /* پر کردن عرض باکس بیرونی */
            justify-content: space-around; /* پخش شدن متن‌ها */
        }

        .category-pill {
            font-size: 13px;
            cursor: pointer;
            padding: 2px 0; /* کاهش پدینگ عمودی برای کم‌ارتفاعی */
            color: #555;
        }

        /* استایل برای تب فعال */
        .category-pill.active {
            font-weight: bold;
            color: #000;
            border-bottom: 2px solid #333;
        }
        /* ---------------------------------------- */

        /* ۳. بنر اصلی */
        .banner {
            border: 2px solid #555;
            border-radius: 25px; /* گردی نرم */
            padding: 15px;
            height: 160px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .banner-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner-title {
            border: 1px solid #555;
            padding: 3px 10px;
            border-radius: 20px; /* گردی نرم */
            font-size: 12px;
        }

        .banner-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .banner-text {
            border: 1px solid #555;
            padding: 3px 10px;
            border-radius: 20px; /* گردی نرم */
            font-size: 12px;
        }

        .banner-shapes {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-end;
        }

        .shape-rect {
            width: 30px;
            height: 8px;
            border: 1px solid #555;
            border-radius: 10px; /* گردی نرم */
        }
        
        .shape-square {
            width: 25px;
            height: 25px;
            border: 1px solid #555;
            border-radius: 10px; /* گردی نرم */
        }

        /* ۴. ردیف دایره‌ها */
        .circles-row {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        .circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .circle {
            width: 45px;
            height: 45px;
            border: 1px solid #555;
            border-radius: 50%;
        }

        .circle-line {
            width: 35px;
            height: 5px;
            border: 1px solid #555;
            border-radius: 10px; /* گردی نرم */
        }

        /* ۵. بخش متنی */
        .text-section {
            text-align: center;
            padding: 10px 0;
        }

        .text-section h3 {
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .text-section p {
            font-size: 12px;
            color: #666;
        }

        /* ۶. کارت‌های پایین */
        .bottom-cards {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .card {
            flex: 1;
            aspect-ratio: 1 / 1;
            border: 2px solid #555;
            border-radius: 25px; /* گردی نرم */
        }

        /* فوتر */
        .footer-text {
            text-align: center;
            font-size: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            color: #555;
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- ۱. هدر -->
        <header class="header">
            <div class="header-right">
                <button class="menu-btn">
                    <span class="menu-line top"></span>
                    <span class="menu-line bottom"></span>
                </button>
                <button class="login-btn">ورود / ثبت نام</button>
            </div>
            <div class="header-left">
                <button class="icon-btn">🔍</button>
            </div>
        </header>

        <!-- ۲. منوی دسته‌بندی (باکس عریض + باکس داخلی) -->
        <nav class="categories-wrapper">
            <div class="categories-inner">
                <span class="category-pill active">همه</span>
                <span class="category-pill">لوازم خانگی</span>
                <span class="category-pill">خودرو</span>
                <span class="category-pill">پوشاک</span>
            </div>
        </nav>

        <!-- ۳. بنر اصلی -->
        <section class="banner">
            <div class="banner-top">
                <span class="banner-title">محصولات</span>
                <button class="icon-btn" style="width: 25px; height: 25px; font-size: 12px;">✕</button>
            </div>
            <div class="banner-bottom">
                <span class="banner-text">اشتراک و نمایش</span>
                <div class="banner-shapes">
                    <div class="shape-rect"></div>
                    <div class="shape-square"></div>
                </div>
            </div>
        </section>

        <!-- ۴. ردیف دایره‌ها -->
        <section class="circles-row">
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
            <div class="circle-item"><div class="circle"></div><div class="circle-line"></div></div>
        </section>

        <!-- ۵. بخش متنی -->
        <section class="text-section">
            <h3>ربات‌های اشاره‌شده</h3>
            <p>پایین ربات‌هایی که شما اشاره کرده‌اید</p>
        </section>

        <!-- ۶. کارت‌های پایین -->
        <section class="bottom-cards">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </section>

        <!-- فوتر -->
        <footer class="footer-text">
            ما هورپی اسپرت و شکوه را...
        </footer>

    </div>

</body>
</html>
