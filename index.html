<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Cyber AI UI</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px 24px 16px;
            overflow: hidden;
            position: relative;
        }

        /* پس‌زمینه هولوگرام و نوری */
        .ambient-glow {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(0, 0, 0, 0) 75%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 4s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.95; }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 360px;
            z-index: 1;
        }

        .graphic-wrapper {
            position: relative;
            width: 310px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        /* هسته فوق‌العاده بزرگ و خفن در مرکز */
        .hologram-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            pointer-events: none;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-ring-out {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.35);
            animation: spinClockwise 8s linear infinite;
        }

        .core-ring-1 {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: #ffffff;
            border-bottom-color: rgba(255, 255, 255, 0.3);
            animation: spinCounter 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .core-ring-2 {
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-left-color: #ffffff;
            animation: spinClockwise 3s ease-in-out infinite;
        }

        .core-ring-3 {
            position: absolute;
            inset: 34px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.6);
            animation: spinCounter 2s linear infinite;
        }

        .core-center-node {
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 25px 8px rgba(255, 255, 255, 0.95);
            animation: nodePulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
        @keyframes spinCounter { 100% { transform: rotate(-360deg); } }
        @keyframes nodePulse { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.35); opacity: 1; } }

        .svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.5));
        }

        .laser-stream-1 { stroke-dasharray: 50 150; stroke-dashoffset: 200; animation: streamFast 1.3s linear infinite; }
        .laser-stream-2 { stroke-dasharray: 30 170; stroke-dashoffset: -200; animation: streamFast 1.6s linear infinite; }
        .laser-stream-3 { stroke-dasharray: 15 185; stroke-dashoffset: 200; animation: streamFast 2s linear infinite; }

        @keyframes streamFast { 100% { stroke-dashoffset: 0; } }

        /* آواتارهای ساده‌تر و شیک (کوچک‌تر از هسته) */
        .avatar-container {
            position: relative;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            animation: floatLevitate 4s ease-in-out infinite;
        }

        .avatar-container.user { animation-delay: -2s; }

        @keyframes floatLevitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* حلقه مینی‌مال و شیک دور آواتارها */
        .avatar-clean-orbit {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            animation: spinClockwise 4s linear infinite;
        }

        .avatar-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .main-title {
            font-size: 21px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.3px;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.45) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
        }

        .input-card-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            border-radius: 26px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0.12) 100%);
            z-index: 10;
            transition: max-width 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 1), 0 0 15px rgba(0, 0, 0, 0.8);
            will-change: max-width, box-shadow;
        }

        .input-card-wrapper:focus-within {
            max-width: 380px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.35) 100%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.12), 0 25px 50px rgba(0, 0, 0, 1);
        }

        .input-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(35px) saturate(190%);
            -webkit-backdrop-filter: blur(35px) saturate(190%);
            border-radius: 25px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .chat-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14.5px;
            color: #ffffff;
            direction: rtl;
            padding: 4px 4px;
        }

        .chat-input::placeholder { color: rgba(255, 255, 255, 0.35); }

        .bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
        .right-buttons { display: flex; align-items: center; gap: 8px; }

        .btn-plus, .btn-search {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            backdrop-filter: blur(15px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .btn-plus { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-search { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }

        .btn-plus:active, .btn-search:active { transform: scale(0.93); }

        .btn-send {
            width: 36px; height: 36px; border-radius: 50%; border: none; background-color: #ffffff; color: #000000;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 18px rgba(255, 255, 255, 0.25); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-send:active { transform: scale(0.88); }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

    <div class="ambient-glow"></div>

    <div class="main-container">
        <div class="graphic-wrapper">
            <!-- هسته غول‌پیکر نوری مرکز -->
            <div class="hologram-core">
                <div class="core-ring-out"></div>
                <div class="core-ring-1"></div>
                <div class="core-ring-2"></div>
                <div class="core-ring-3"></div>
                <div class="core-center-node"></div>
            </div>

            <!-- شبکه جریانات لیزری -->
            <svg class="svg-canvas" viewBox="0 0 310 140" fill="none">
                <!-- خطوط تاری پس‌زمینه -->
                <path d="M 35 70 C 110 15, 200 125, 275 70" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" fill="none" />
                <path d="M 35 70 C 110 125, 200 15, 275 70" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" fill="none" />
                <path d="M 35 70 L 275 70" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" fill="none" />

                <!-- پرتوی لیزری پرسرعت متصل به هسته بزرگ -->
                <path d="M 35 70 C 110 15, 200 125, 275 70" stroke="url(#laserGrad)" stroke-width="3" stroke-linecap="round" fill="none" class="laser-stream-1" />
                <path d="M 35 70 C 110 125, 200 15, 275 70" stroke="url(#laserGrad)" stroke-width="3" stroke-linecap="round" fill="none" class="laser-stream-2" />
                <path d="M 35 70 L 275 70" stroke="url(#laserGrad)" stroke-width="2" stroke-linecap="round" fill="none" class="laser-stream-3" />

                <defs>
                    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
                        <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                    </linearGradient>
                </defs>
            </svg>

            <!-- آواتار هوش مصنوعی -->
            <div class="avatar-container ai">
                <div class="avatar-clean-orbit"></div>
                <div class="avatar-box">
                    <svg fill="#ffffff" width="20" height="20" viewBox="0 0 24 24">

.098 2.431-.213.62-.09 1.364-.288 1.908-.442a11.537 11.537 0 002.236-.9c.732-.386 1.634-1.033 1.89-1.847.4-1.269-1.44-2.406-2.352-2.802-.637-.277-1.13-.467-1.479-.57a.02.02 0 00-.019.003.02.02 0 00-.006.009.022.022 0 000 .01z"></path>
                    </svg>
                </div>
            </div>

            <!-- آواتار کاربر -->
            <div class="avatar-container user">
                <div class="avatar-clean-orbit"></div>
                <div class="avatar-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="9" r="3" stroke="#ffffff" stroke-width="1.5"></circle>
                        <path d="M17.9691 20C17.81 17.1085 16.9247 15 11.9999 15C7.07521 15 6.18991 17.1085 6.03076 20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></path>
                        <path d="M7 3.33782C8.47087 2.48697 10.1786 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 10.1786 2.48697 8.47087 3.33782 7" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="title-container">
            <h1 class="main-title">چطور می‌تونم کمکت کنم؟</h1>
        </div>
    </div>

    <div class="input-card-wrapper">
        <div class="input-card">
            <input type="text" class="chat-input" placeholder="سوالت رو اینجا بپرس..." />

            <div class="bottom-row">
                <div class="right-buttons">
                    <button class="btn-plus">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    
                    <button class="btn-search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <span>جست‌وجو</span>
                    </button>
                </div>

                <button class="btn-send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'a' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
